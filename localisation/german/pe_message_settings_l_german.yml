 pe_settings.desc:0 "§GAktiv§! / §RStumm§! zeigt den aktuellen Zustand. Klicke auf eine Kategorie, um sie umzuschalten. Die Änderung gilt sofort für zukünftige Meldungen im gesamten Reich und wird im Spielstand gespeichert.\n\n§YEchte Entscheidungen und Angebote bleiben sichtbar.§! Wirtschaftsabläufe, Kosten, Belohnungen und negative Folgen laufen auch bei stummen Meldungen weiter. Bereits angezeigte Meldungen werden nicht entfernt.\n\nStandard: alles aktiv. Die allgemeinen Stellaris-Nachrichteneinstellungen gelten zusätzlich."
 pe_settings_all_on:0 "Alle Meldungen aktivieren (Standard)"
 pe_settings_all_off:0 "Alle Meldungen stummschalten"
 pe_settings_all_tip:0 "Gilt für alle Kategorien auf beiden Seiten. Ereignisse mit Entscheidungen bleiben sichtbar."
