 decision_pe_message_settings:0 "Privatwirtschaft: Nachrichten einstellen"
 decision_pe_message_settings_desc:0 "Wähle, welche Meldungen und Informationsfenster der Privatwirtschaft du erhalten möchtest. Gilt für dein gesamtes Reich; jederzeit kostenlos änderbar."
