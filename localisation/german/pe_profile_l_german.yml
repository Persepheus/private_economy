l_german:
 pe_prof_1:0 "Gründerkonzern"
 pe_prof_c_1:0 ", Gründerkonzern"
 pe_prof_text_1:0 "\n\n§HProfil: Gründerkonzern§!\n„Wer wartet, bis der Markt bereit ist, kommt zu spät.“\nJunge Teilhaber, hohe Schulden, große Pläne. Die Büros stehen in umgebauten Lagerhallen, die Sitzungen dauern bis tief in die Nacht, und jedes Quartal soll das größte werden.\n\nÜbernimmt öfter unabhängige Firmen, fängt eher Preiskämpfe an und greift früher nach Stationen, Habitaten und Megastrukturen. Er verleiht freigiebig, bis tief ins Minus, und gerät so leichter in die Krise. Sozialleistungen zahlt er erst, wenn er richtig reich ist."
 pe_prof_2:0 "Solides Haus"
 pe_prof_c_2:0 ", Solides Haus"
 pe_prof_text_2:0 "\n\n§HProfil: Solides Haus§!\n„Wir rechnen in Jahrhunderten, nicht in Quartalen.“\nMarmorne Kontore, vorsichtige Buchhalter und eine Rücklage, über die man nicht spricht. Ein solides Haus übersteht die Krisen, an denen andere zerbrechen.\n\nEs verleiht nur, was es hat, und gerät deshalb selten in Krisen. Mit ihm im Reich bieten die Investoren eher Staatsanleihen an. Preiskämpfe, Übernahmen und große Bauprojekte wagt es nur selten. Eine Kündigung trägt es mit Fassung."
 pe_prof_3:0 "Familienkonzern"
 pe_prof_c_3:0 ", Familienkonzern"
 pe_prof_text_3:0 "\n\n§HProfil: Familienkonzern§!\n„Mein Großvater hat dieses Werk gegründet. Meine Enkel werden es führen.“\nDer Name über dem Tor ist der Name der Familie. Man kennt die Arbeiter beim Namen, feiert ihre Hochzeiten und erwartet dafür Treue, über Generationen.\n\nZahlt schon mit halb so viel Kasse Sozialleistungen, stiftet gern und hält an seinem Hauptsitz fest, statt in ein Habitat oder eine andere Stadt zu ziehen. Mit ihm im Reich gibt es öfter Familienförderung und Hilfe in der Not. Eine Kränkung vergisst er nicht: Wer ihm einen Vertrag kündigt, wartet zehn Jahre auf den nächsten."
 pe_prof_4:0 "Technologiekonzern"
 pe_prof_c_4:0 ", Technologiekonzern"
 pe_prof_text_4:0 "\n\n§HProfil: Technologiekonzern§!\n„Das Produkt von morgen ist das einzige, das zählt.“\nLabore statt Lagerhallen, Patente statt Schlote. Hier sitzen die Ingenieure mit am Vorstandstisch, und die Kantine hat nie geschlossen.\n\nBaut sein Forschungsinstitut schneller aus und greift eher nach Dyson-Schwärmen. Mit ihm im Reich gibt es öfter Technologielizenzen, Prototypen, Stiftungen für die Wissenschaft und Roboter-Startups. Weil es bei ihm viel zu holen gibt, kommt Industriespionage öfter vor."
 pe_prof_5:0 "Rüstungskonzern"
 pe_prof_c_5:0 ", Rüstungskonzern"
 pe_prof_text_5:0 "\n\n§HProfil: Rüstungskonzern§!\n„Frieden ist eine Phase. Wir planen für die Zeit danach.“\nWerkhallen voller Panzerplatten, Generäle im Aufsichtsrat, Verträge mit langen Laufzeiten. Man spricht leise hier, und man spricht über Kaliber.\n\nAls Industriekonzern wird er vor allen anderen um einen Rüstungsvertrag gefragt und bietet ihn viel öfter an. Er verleast eher Kriegsflotten, stellt zuerst Werkschutz und Schutzflotten und baut gern Zitadellen. Eine Kündigung nimmt er übel: zehn Jahre ohne neue Verhandlungen."
 pe_prof_6:0 "Finanzhaus"
 pe_prof_c_6:0 ", Finanzhaus"
 pe_prof_text_6:0 "\n\n§HProfil: Finanzhaus§!\n„Wir stellen nichts her. Wir sorgen dafür, dass andere es können.“\nKursanzeigen in jedem Flur, Anleihen statt Fabriken, Händler, die nie schlafen. Ein Finanzhaus verdient an jeder Bewegung des Marktes, nach oben wie nach unten.\n\nMit einem Finanzhaus im Reich bewegt sich die Börse mehr: Börsengänge, Übernahmen und Rallys, aber auch Crashs und Insiderhandel. Es übernimmt öfter Firmen und bietet eher Staatsanleihen an."
 pe_prof_7:0 "Genossenschaft"
 pe_prof_c_7:0 ", Genossenschaft"
 pe_prof_text_7:0 "\n\n§HProfil: Genossenschaft§!\n„Hier gehört jedem ein Stück des Werks, und so arbeitet hier auch jeder.“\nDer Vorstand wird gewählt, die Gewinne werden geteilt, die Versammlungen sind lang und laut. Wer hier arbeitet, bleibt.\n\nZahlt schon mit halb so viel Kasse Sozialleistungen, führt selten Preiskämpfe und übernimmt selten. An Rüstung ist sie kaum interessiert, an Familienförderung und Werkswohnungen umso mehr. Mit ihr im Reich wird seltener gestreikt, und Umweltskandale werden seltener."
 pe_prof_8:0 "Pionierkonzern"
 pe_prof_c_8:0 ", Pionierkonzern"
 pe_prof_text_8:0 "\n\n§HProfil: Pionierkonzern§!\n„Die besten Vorkommen liegen dort, wo noch keine Karte hinreicht.“\nProspektoren, Vermesser, Glücksritter. Die Zentrale ist ein Schiff, und der Vorstand ist selten zu Hause.\n\nBaut eher Stationen und Habitate und bietet öfter Erkundungschartas, Bergung, Jagdrechte und Konvoischutz an. Mit ihm im Reich melden Prospektoren öfter einen Fund."
 pe_prof_9:0 "Kartell"
 pe_prof_c_9:0 ", Kartell"
 pe_prof_text_9:0 "\n\n§HProfil: Kartell§!\n„Wettbewerb ist etwas für Leute, die es sich leisten können zu verlieren.“\nAbsprachen in Hinterzimmern, Preise, die nur steigen, und Freunde in jedem Ministerium. Niemand hat je einen Vertrag gesehen, und doch halten sich alle daran.\n\nFührt öfter Preiskämpfe und übernimmt gern. Mit ihm im Reich gibt es öfter Monopole, Dumping, Streiks, Umweltskandale und Industriespionage. Sozialleistungen zahlt es erst, wenn es richtig reich ist."
