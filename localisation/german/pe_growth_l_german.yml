l_german:
 pe.332.name:0 "Zwei Firmen wollen fusionieren"
 pe.332.desc:0 "Auf §Y[pe_mg_planet.GetName]§! wollen zwei Firmen derselben Branche fusionieren. Beide haben das Geld für den nächsten Ausbau, aber auf dem Planeten fehlen die Arbeitskräfte dafür.\n\nZusammen werden sie eine Firma eine Stufe größer, mit dem Geld beider. Die neue Firma hat weniger Stellen als die beiden alten zusammen, und ein Distriktplatz wird frei. Die frei werdenden Arbeiter können andere Firmen hier wachsen lassen."
 pe.332.a:0 "Zustimmen"
 pe.332.a.tt:0 "Die reichere der beiden Firmen übernimmt die andere und wächst um eine Stufe. Ein Distriktplatz wird frei."
 pe.332.b:0 "Einspruch erheben"
 pe.332.b.tt:0 "Die beiden Firmen bleiben getrennt und fragen fünf Jahre lang nicht wieder."
 pe.333.name:0 "Ein Konzern will bauen"
 pe.333.desc:0 "§Y[Root.GetPeCorpName333]§! will auf §Y[pe_spb_planet.GetName]§! das Gebäude §Y[Root.GetPeSpbBuilding]§! bauen, [Root.GetPeSpbPlace]. Die Privatfirmen dort erzeugen damit mehr, und alle Arbeiter des Typs profitieren.\n\nDer Konzern bezahlt alles selbst: §Y[Root.pe_spb_ccr]§! £trade£ Handel, die Mineralien zum Marktpreis. Wir pachten das Gebäude zehn Jahre lang für §Y[Root.pe_spb_rent]§! £trade£ Handel im Monat: die Kosten plus 50 % Gewinn für den Konzern. Danach gehört es uns. Über die Planetenentscheidung „Pacht ablösen“ können wir die Pacht früher zum Restwert beenden."
 pe.333.a:0 "Annehmen"
 pe.333.a.tt:0 "Der Konzern baut alles, was nötig ist. Wir zahlen die Pacht zehn Jahre lang als Budgetzeile „Pacht für Konzerngebäude“."
 pe.333.b:0 "Ablehnen"
 pe.333.b.tt:0 "Auf diesem Planeten fragt fünf Jahre lang kein Konzern wieder nach diesem Gebäude."
 pe_spb_b_1:0 "$building_mineral_purification_plant$"
 pe_spb_b_2:0 "$building_energy_grid$"
 pe_spb_b_3:0 "$building_food_processing_facility$"
 pe_spb_place_1:0 "in der vorhandenen Spezialisierung"
 pe_spb_place_2:0 "mit einer neuen Spezialisierung in unserem Distrikt"
 pe_spb_place_3:0 "mit einem neuen Distrikt und seiner Spezialisierung"
 pe.334.name:0 "Pacht ablösen"
 pe.334.desc:0 "Die Pacht der Konzerngebäude auf §Y[pe_spb_bb_planet.GetName]§! läuft noch. Ablösen kostet ihren Restwert, also den Anteil der Baukosten, den die Pacht noch nicht bezahlt hat, ohne den Gewinn des Konzerns: §Y[Root.pe_spb_bb]§! £trade£ Handel. Danach gehören die Gebäude uns, und die Pacht entfällt."
 pe.334.a:0 "Ablösen"
 pe.334.a.tt:0 "Wir zahlen den Restwert, die Konzerne bekommen ihn, und die Pacht endet."
 pe.334.b:0 "Nicht jetzt"
 decision_pe_spb_buyback:0 "Pacht ablösen"
 decision_pe_spb_buyback_desc:0 "Beendet die Pacht der Konzerngebäude auf diesem Planeten zum Restwert. Danach gehören sie uns."
 pe_msg_spb_built:0 "§Y$CORP$§! hat auf $PLANET$ ein Spezialisierungsgebäude gebaut. Wir pachten es zehn Jahre lang, danach gehört es uns."
 pe_msg_spb_end:0 "Die Pacht des Spezialisierungsgebäudes von §Y$CORP$§! auf $PLANET$ ist beendet: Der Konzern besteht nicht mehr, oder das Gebäude steht nicht mehr. Was steht, gehört uns."
 pe_msg_spb_paid:0 "Die Pacht des Spezialisierungsgebäudes von §Y$CORP$§! auf $PLANET$ ist abbezahlt. Das Gebäude gehört jetzt uns."
