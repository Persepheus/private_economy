 pe_reg_why_0:0 "Noch nicht ausgewertet (nächstes Quartal)."
 pe_reg_why_1:0 "Eine Baustelle läuft; die Investoren warten, bis sie fertig ist."
 pe_reg_why_2:0 "Ein Jahr Pause nach der letzten Gründung oder dem letzten Kauf hier."
 pe_reg_why_3:0 "Kriegsgebiet: Die Investoren warten ab."
 pe_reg_why_4:0 "Der Anteil, den unsere Wirtschaftsordnung hier privaten Firmen lässt, ist ausgeschöpft."
 pe_reg_why_5:0 "Kein freier Distriktplatz, also keine neue Firma. Ein Distriktkauf kam auch nicht in Frage: nur unter Freier Marktwirtschaft oder Laissez-faire, höchstens alle zwei Jahre und nur, wenn eine Firma klar mehr wert ist als der Distrikt."
 pe_reg_why_6:0 "Die privaten Stellen hier sind zu weniger als 80 % besetzt: Für eine weitere Firma fehlen Arbeiter."
 pe_reg_why_7:0 "Keine Arbeitslosen, also keine neue Firma. Ein Distriktkauf kam auch nicht in Frage: nur unter Freier Marktwirtschaft oder Laissez-faire, höchstens alle zwei Jahre und nur, wenn eine Firma klar mehr wert ist als der Distrikt."
 pe_reg_why_8:0 "Hier lohnt sich keine Firma: zu wenig Wert, oder sie würde knappe Rohstoffe verbrauchen."
 pe_reg_why_9:0 "Eine Firma würde sich lohnen, aber das Privatkapital reicht nicht für die Anzahlung."
 pe_reg_why_10:0 "Die Investoren haben hier eine neue Firma gegründet."
 pe_reg_why_11:0 "Die Investoren haben einen Staatsdistrikt gekauft oder einen Kauf angeboten."
 pe_reg_why_12:0 "Die Investoren wollen über der Quote gründen und warten auf unsere Entscheidung."
 pe_reg_why_13:0 "Wir haben Firmen über der Quote hier abgelehnt (fünf Jahre)."
 pe_reg_why_14:0 "Die gewählte Firma würde knappe Rohstoffe verbrauchen (Versorgungsprüfung)."
 pe_reg_why_17:0 "Über der Quote: Eine andere Anfrage ist noch offen."
 pe_reg_why_18:0 "Mehr Firmen, als unsere Wirtschaftsordnung erlaubt: Eine wird verstaatlicht."
 pe_reg_why_19:0 "Kein Kauf: Die Staatsjobs, die ein gekaufter Distrikt mitbrächte, sind zu weniger als 90 % besetzt, oder der Distrikt bringt zu wenige Arbeiter mit (Stadtdistrikt ohne Spezialisierung) und es fehlen freie Pops."
 pe_reg_why_20:0 "Kein Kauf: Hier steht ein Distrikt in der Bauliste (er könnte den Distrikt ersetzen, den sie kaufen würden)."
 pe_reg_why_21:0 "Kein Kauf: Die privaten Stellen hier sind zu weniger als 90 % besetzt; ein gekaufter Distrikt brächte nur weitere leere Stellen."
