l_german:
 pe_no_firm:0 "keine"
 pe_dist_city:0 "Stadtdistrikt"
 pe_dist_mining:0 "Bergbaudistrikt"
 pe_dist_generator:0 "Generatordistrikt"
 pe_dist_farming:0 "Landwirtschaftsdistrikt"
 pe_deposit_cat_sites:0 "Private Baustellen"
 d_pe_site_city:0 "Private Baustelle"
 d_pe_site_city_desc:0 "Investoren bauen hier ein Privatunternehmen oder bauen einen Distrikt um. Sie belegt einen Distriktplatz, bis es eröffnet."
 d_pe_site_mining:0 "Private Baustelle"
 d_pe_site_mining_desc:0 "Investoren bauen hier ein Privatunternehmen oder bauen einen Distrikt um. Sie belegt einen Distriktplatz und einen Bergbaudistrikt, bis es eröffnet."
 d_pe_site_generator:0 "Private Baustelle"
 d_pe_site_generator_desc:0 "Investoren bauen hier ein Privatunternehmen oder bauen einen Distrikt um. Sie belegt einen Distriktplatz und einen Generatordistrikt, bis es eröffnet."
 d_pe_site_farming:0 "Private Baustelle"
 d_pe_site_farming_desc:0 "Investoren bauen hier ein Privatunternehmen oder bauen einen Distrikt um. Sie belegt einen Distriktplatz und einen Landwirtschaftsdistrikt, bis es eröffnet."
 pe_msg_relocate:0 "§Y$FIRM$§! ist von $PLANET$ nach $DEST$ umgezogen, dessen Spezialisierung besser passt. Die Arbeiter sind mitgezogen."
 pe_msg_relocate_need:0 "§Y$FIRM$§! ist von $PLANET$, wo Wohnraum oder Annehmlichkeiten fehlen, nach $DEST$ umgezogen. Die Arbeiter sind mitgezogen."
 pe_deposit_cat_ledger:0 "Privatwirtschaft"
 pe_msg_site_cancel:0 "Investoren haben eine Baustelle auf $PLANET$ aufgegeben: Zwei Jahre lang fanden sich keine Arbeiter für die neue Firma. Sie haben ihre Anzahlung zurückbekommen."
 pe_private_dividends:0 "Dividenden"
 d_pe_ledger_dividend:0 "Staatliche Aktienbeteiligungen"
 d_pe_ledger_dividend_desc:0 "Aktien, die der Staat an Privatkonzernen hält; sie zahlen monatlich Dividende."
 pe_corp_lease:0 "Pacht für Konzerngebäude"
 d_pe_ledger_lease:0 "Pacht für Konzerngebäude"
 d_pe_ledger_lease_desc:0 "Ein Konzern hat hier ein Spezialisierungsgebäude gebaut (mit Spezialisierung und Distrikt, wenn sie fehlten). Wir pachten es zehn Jahre: die Kosten plus 50 % Gewinn für den Konzern, verteilt auf 120 Monate. Danach gehört es uns; die Planetenentscheidung Pacht ablösen beendet sie früher zum Restwert."
 pe_auto_refund:0 "Private Automatisierung (Erstattung der Firmen)"
 d_pe_ledger_auto:0 "Erstattung Private Automatisierung"
 d_pe_ledger_auto_desc:0 "Die Privatfirmen erstatten uns jeden Monat die Energie, die die Automatisierung ihrer Jobs uns kostet (Zeile Automatisierte Arbeitskraft), aus ihrem eigenen Kapital."
 pe_private_profits:0 "Gewinnauszahlung an Privatfirmen"
 pe_private_savings:0 "Private Ersparnisse"
 d_pe_ledger_profit:0 "Gewinnauszahlung an Privatfirmen"
 d_pe_ledger_profit_desc:0 "§HEine Ausgabe des Staates.§! Die Privatfirmen auf diesem Planeten liefern ihre ganze Produktion an das Reich, genau wie Staatsjobs. Dafür zahlt der Staat ihnen jeden Monat ihren Gewinnanteil in Handel: einen Teil des Werts, den ihre Jobs schaffen, je nach Wirtschaftsordnung (Gelenkt 10 %, Gemischt 15 %, Freie Marktwirtschaft 20 %, Laissez-faire 25 %), abzüglich ihrer laufenden Kosten. Davon wachsen die Firmen, und neue werden gegründet.\n\nGewinne und Ersparnisse zusammen kosten höchstens einen Anteil des Netto-Handels, den wir ohne sie hätten: 60 % der ersten 100 im Monat, 70 % der nächsten 200, 85 % von allem darüber. So drücken sie unsere Handelsbilanz nie ins Minus, und eine reiche Handelswirtschaft investiert mehr. Was der Staat nicht zahlt, bekommen die Firmen auch nicht."
 d_pe_ledger_savings:0 "Private Ersparnisse"
 d_pe_ledger_savings_desc:0 "§HEine Ausgabe des Staates.§! Jeden Monat fließt ein Teil unseres Handelseinkommens als private Ersparnisse in den Investorenpool, je nach Wirtschaftsordnung (Gelenkt 5 %, Gemischt 10 %, Freie Marktwirtschaft 15 %, Laissez-faire 20 %). Aus dem Pool gründen Investoren neue Firmen und kaufen Staatsdistrikte."
 pe_deposit_cat_automation:0 "Private Automatisierung"
 pe_msg_conq_hq_lost:0 "Mit $PLANET$ haben wir den Hauptsitz von §Y$CORP$§! verloren. Der Konzern verlässt unsere Wirtschaft; seine Firmen hier sind jetzt unabhängig, seine Stationen und Megastrukturen gehören uns."
 pe_msg_conq_hq_gained:0 "Mit $PLANET$ ist der Konzern §Y$CORP$§! unter unsere Herrschaft gekommen: Sein Hauptsitz und seine Firmen dort gehören jetzt zu unserer Wirtschaft."
 pe_msg_conq_corp_gone:0 "§Y$CORP$§! hat seinen Hauptsitz auf $PLANET$, das jetzt uns gehört, aber in unserer Wirtschaft ist kein Platz für ihn: Der Konzern wird aufgelöst, seine Firmen sind unabhängig."
 pe_msg_firm_ruined:0 "Eine Privatfirma auf $PLANET$ ist durch das Bombardement zerstört worden. Ihre Trümmer blockieren den Distriktplatz, bis sie geräumt oder wieder aufgebaut sind."
 d_pe_ruins:0 "Trümmer einer Privatfirma"
 d_pe_ruins_desc:0 "Was das Bombardement von einer Privatfirma übrig gelassen hat. Die Trümmer blockieren einen Distriktplatz. Sie lassen sich räumen oder wieder aufbauen: durch den Konzern der Firma aus seiner Kasse, sonst mit einem Zuschuss von uns."
 pe_deposit_cat_ruins:0 "Trümmer"
 pe_supply_deal:0 "Liefervertrag mit einer Privatfirma"
 d_pe_supply_deal:0 "Liefervertrag"
 d_pe_supply_deal_desc:0 "Eine Privatfirma liefert uns zwei Jahre lang jeden Monat diese Ware und nimmt dafür eine andere, von der wir reichlich hatten (Ereignis §YEin besonderes Angebot§!). Der Vertrag endet vorzeitig, wenn uns die Ware ausgeht, mit der wir bezahlen."
 d_pe_automation:0 "Private Automatisierung"
 d_pe_automation_desc:0 "Die Privatfirmen hier haben einen Teil ihrer Arbeiterjobs automatisiert, wie mit den Vanilla-Automatisierungsgebäuden (Stufe I 25 %, Stufe II 50 % der Jobs brauchen keine Pops). Die Firmen zahlen sie aus ihrem eigenen Kapital, auch den Energieunterhalt: Der Modifikator Private Automatisierung nimmt ihn aus unserem Haushalt."
 pe_auto_tt:0 "§HAutomatisiert§!\n[This.GetPeAuto_miner][This.GetPeAuto_technician][This.GetPeAuto_farmer]"
