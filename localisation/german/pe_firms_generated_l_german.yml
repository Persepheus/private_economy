 d_pe_hq_1:0 "Hauptsitz: Kessler-Orin Heavy Industries"
 d_pe_hq_1_desc:0 "Der Konzern Kessler-Orin Heavy Industries hat hier seinen Sitz.\n\n§HKonzernproduktion§!\nDer Konzern besitzt Orbitalstationen und Dyson-Schwärme, verwaltet von unseren Private Holdings. Die Stationen hat er auf Vorkommen gebaut, die wir nicht genutzt haben, oder uns abgekauft. Ihren Ertrag verarbeitet er effizienter als wir (140 %): Er bezahlt davon den Unterhalt seiner Megastrukturen, liefert uns hier jeden Monat 120 % ihres Werts (zu Grundpreisen) in seinem eigenen Produkt, die Ressource oben, und behält 20 % als Marge. Mehr Stationen oder ein größerer Schwarm bedeuten mehr Konzernproduktion.\n\n§HForschungsinstitut und Rüstungszentrum§!\nEin reicher Konzern betreibt hier ein Forschungsinstitut seines Fachs (100 Forscherstellen je Stufe). Ist er unser Rüstungskonzern, ist sein Hauptsitz ein Rüstungszentrum (+2 Stabilität, +10 % Arbeitskraft privater Metallurgen).\n\nStationen und Produktion jedes Konzerns zeigt die Planeten-Entscheidung §YFirmenregister§!."
