l_german:
 pe_building_corp_storage:0 "Firmenlager"
 pe_building_corp_storage_desc:0 "Eine Privatfirma lagert hier gegen eine Gebühr einen Teil unseres Überschusses (Lagervertrag)."
 pe_store_who_corp:0 "§Y[Root.GetPeCorpName324]§!"
 pe_store_who_inv:0 "Eine Privatfirma"
 pe_store_who_corp_r:0 "§Y[Root.GetPeCorpName325]§!"
 pe_store_who_inv_r:0 "Die Privatfirma"
 pe.324.name:0 "Ein Lagervertrag"
 pe.324.a:0 "Den Vertrag unterschreiben."
 pe.324.a.tt:0 "Fünf Jahre lang fasst unser Lager §G[Root.pe_sto_capn]§! mehr. Jeden Monat nimmt die Firma 20 % unserer Nettoproduktion davon als Gebühr. Ihr Firmenlager erscheint bei den Vorkommen von §Y[pe_sto_planet.GetName]§! (kein Bauplatz)."
 pe.324.b:0 "Unsere Lager sind groß genug."
 pe.325.name:0 "Der Lagervertrag läuft aus"
 pe.325.a:0 "Um fünf Jahre verlängern."
 pe.325.a.tt:0 "Zusätzliche Kapazität und Gebühr bleiben weitere fünf Jahre."
 pe.325.b:0 "Auslaufen lassen."
 pe.326.name:0 "Ein Rüstungsauftrag aus unseren Lagern"
 pe.326.desc:0 "§Y[Root.GetPeCorpName326]§! hat bemerkt, dass unsere Legierungslager überquellen. Der Konzern bietet an, auf seinen eigenen Werften §Y[Root.pe_ao_nn]§! Kriegsschiffe unseres neuesten Entwurfs zu bauen, aus §Y[Root.pe_ao_al]§! £alloys£ unserer Legierungen, etwa §Y[Root.pe_ao_cc]§! pro Schiff. Unsere eigenen Werften bleiben frei.\n\nFür Werften, Arbeiter und die Eile nennt der Vorstand seinen Preis: §Y[Root.pe_ao_fee]§! £trade£ obendrauf. Ein gutes Geschäft für den Konzern, sagt das Finanzministerium, und in einem Jahr eine Flotte, sagt die Admiralität."
 pe.326.a:0 "Den Auftrag erteilen."
 pe.326.a.tt:0 "Wir zahlen §Y[Root.pe_ao_al]§! £alloys£ und §Y[Root.pe_ao_fee]§! £trade£. In einem Jahr werden die Schiffe an unserer Hauptstadt geliefert; sie gehören uns (normaler Unterhalt und Flottenkapazität)."
 pe.326.a.fail:0 "Dafür fehlt uns der Handelswert."
 pe.326.b:0 "Unsere Schiffe bauen wir selbst."
 pe_ao_fleet_name:0 "Rüstungsauftrag"
 pe_msg_defence_order_done:0 "Die Kriegsschiffe unseres Rüstungsauftrags sind an $PLANET$ geliefert worden."
 pe.324.desc.mi:0 "Unsere Lager für £minerals£ Mineralien sind fast voll. [Root.GetPeStoreWho] bietet an, unseren Überschuss in einem eigenen Lagerhaus zu lagern: §G[Root.pe_sto_capn]§! mehr Kapazität für fünf Jahre.\n\nDie Gebühr sind jeden Monat 20 % unserer Nettoproduktion an Mineralien, derzeit etwa §Y[Root.pe_sto_feen]§! £minerals£, die die Firma auf eigene Rechnung verkauft. Dafür richtet die Firma auf ihrem Planeten ein §YFirmenlager§! ein; es steht bei den Vorkommen des Planeten und belegt keinen Bauplatz."
 pe.325.desc.mi:0 "In sechs Monaten läuft unser Lagervertrag für £minerals£ Mineralien aus. [Root.GetPeStoreWhoR] bietet an, ihn zu denselben Bedingungen um fünf Jahre zu verlängern. Was bei Ablauf nicht in unser eigenes Lager passt, geht verloren."
 pe_msg_supply_store_end_mi:0 "Unser Lagervertrag für Mineralien ist ausgelaufen; das Firmenlager hat geschlossen."
