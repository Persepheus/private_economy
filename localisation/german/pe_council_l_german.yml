 pe_corp_kdesc_2:0 "Handelshäuser und Unterhaltung. Seine Firmen bringen Handel und Annehmlichkeiten, seine Stationen verarbeiten Rohstoffe zu seinem Produkt."
 pe_corp_kdesc_3:0 "Labore und Medienhäuser: Forschung und Einheit. Wird er reich, betreibt er an seinem Hauptsitz ein Forschungsinstitut seines Fachs."
 pe_corp_kdesc_4:0 "Minen, Kraftwerke und Farmen. Er baut Orbitalstationen auf ungenutzten Vorkommen und automatisiert seine Firmen auf eigene Kosten, wenn Arbeiter fehlen."
