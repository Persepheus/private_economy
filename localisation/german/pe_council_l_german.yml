 pe.337.p:0 "Was für ein Unternehmen führen Sie?"
 pe.337.dc:0 "Über einen Rüstungsvertrag sprechen."
 pe.337.dc.tt:0 "Der Konzern legt uns sein Angebot vor: §Y[Root.pe_dlg_dcs] %§! unseres Flottenunterhalts, bezahlt aus seiner Kasse."
 pe.337.dc.busy:0 "Wir haben schon einen Rüstungsvertrag mit §Y[Root.GetPeCorpName308]§!."
 pe.337.dc.cash:0 "Der Konzern braucht mindestens 5000 £trade£ in der Kasse (jetzt [Root.pe_dlg_cashr])."
 pe.337.dc.cut:0 "Wir haben dem Konzern den Rüstungsvertrag gekündigt. Er verhandelt vorerst nicht wieder mit uns."
 pe.337.dx:0 "Den Rüstungsvertrag kündigen."
 pe.337.dx.tt:0 "Der Konzern trägt ab sofort nichts mehr zu unserem Flottenunterhalt bei. Rüstungsaufträge und Rüstungszentrum enden mit dem nächsten Quartal. Danach verhandelt er eine Weile nicht mit uns: ein Rüstungs- oder Familienkonzern zehn Jahre, ein solides Haus drei, jeder andere fünf."
 pe.337.wl:0 "Schiffe für den Krieg leasen."
 pe.337.wl.tt:0 "Der Konzern legt uns sein Leasingangebot vor."
 pe.337.wl.run:0 "Wir leasen schon eine Konzernflotte."
 pe.337.wl.cash:0 "Ein Industriekonzern braucht mindestens 600 £trade£ in der Kasse, jeder andere 1200 (jetzt [Root.pe_dlg_cashr])."
 pe.337.a:0 "Über eine Ausschreibung sprechen."
 pe.337.a.tt:0 "Staatliche Ausschreibungen kommen mit einer der nächsten Versionen."
 pe.337.b:0 "Zurück zum Konzernrat."
 pe.337.z:0 "Auf Wiedersehen."
 pe.338.desc.1:0 "§Y[Root.GetPeCorpCeo]§!: \"Stahl für Ihre Flotten, Waren für Ihre Bürger. Wir bauen, was dieses Reich zusammenhält.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: Hauptprodukt [Root.GetPeDlgProd], Hauptsitz [pe_dlg_hq.GetName]\n\nStahlwerke und Konsumgüterfabriken. Ein Industriekonzern mit mindestens 5000 £trade£ in der Kasse kann einen §YRüstungsvertrag§! schließen: Er trägt 10 % unseres Flottenunterhalts (20 % ab 15.000 £trade£), seine Stahlwerke bekommen Rüstungsaufträge, und sein Hauptsitz wird Rüstungszentrum. Im Krieg verleast er uns Flotten, schon ab 600 £trade£ Kasse.[Root.GetPeDlgProfText]\n\n§HFür alle Konzerne§!\nAb 3000 £trade£ Kasse zahlen sie ihren Beschäftigten Sozialleistungen. Reiche Konzerne bauen Zitadellen, Habitate, Stationen und Spezialisierungsgebäude, die sie uns verpachten."
 pe.338.desc.2:0 "§Y[Root.GetPeCorpCeo]§!: \"Handel ist Vertrauen. Und Vertrauen ist ein Geschäft, das sich lohnt.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: Hauptprodukt [Root.GetPeDlgProd], Hauptsitz [pe_dlg_hq.GetName]\n\nHandelshäuser und Unterhaltung. Seine Firmen bringen Handel und Annehmlichkeiten, seine Stationen verarbeiten Rohstoffe zu seinem Produkt. Im Krieg verleast er uns Flotten, sobald er 1200 £trade£ in der Kasse hat.[Root.GetPeDlgProfText]\n\n§HFür alle Konzerne§!\nAb 3000 £trade£ Kasse zahlen sie ihren Beschäftigten Sozialleistungen. Reiche Konzerne bauen Zitadellen, Habitate, Stationen und Spezialisierungsgebäude, die sie uns verpachten."
 pe.338.desc.3:0 "§Y[Root.GetPeCorpCeo]§!: \"Jede Entdeckung ist ein Markt, den es gestern noch nicht gab.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: Hauptprodukt [Root.GetPeDlgProd], Hauptsitz [pe_dlg_hq.GetName]\n\nLabore und Medienhäuser: Forschung und Einheit. Ein reicher Konzern betreibt an seinem Hauptsitz ein Forschungsinstitut seines Fachs. Im Krieg verleast er uns Flotten, sobald er 1200 £trade£ in der Kasse hat.[Root.GetPeDlgProfText]\n\n§HFür alle Konzerne§!\nAb 3000 £trade£ Kasse zahlen sie ihren Beschäftigten Sozialleistungen. Reiche Konzerne bauen Zitadellen, Habitate, Stationen und Spezialisierungsgebäude, die sie uns verpachten."
 pe.338.desc.4:0 "§Y[Root.GetPeCorpCeo]§!: \"Unter jedem Stein liegt ein Vertrag, den noch niemand unterschrieben hat.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: Hauptprodukt [Root.GetPeDlgProd], Hauptsitz [pe_dlg_hq.GetName]\n\nMinen, Kraftwerke und Farmen. Er baut Orbitalstationen auf ungenutzten Vorkommen und automatisiert seine Firmen auf eigene Kosten, wenn Arbeiter fehlen. Im Krieg verleast er uns Flotten, sobald er 1200 £trade£ in der Kasse hat.[Root.GetPeDlgProfText]\n\n§HFür alle Konzerne§!\nAb 3000 £trade£ Kasse zahlen sie ihren Beschäftigten Sozialleistungen. Reiche Konzerne bauen Zitadellen, Habitate, Stationen und Spezialisierungsgebäude, die sie uns verpachten."
 pe.338.a:0 "Zurück zum Gespräch."
 pe.339.desc:0 "§Y[Root.GetPeCorpCeo]§! nimmt die Kündigung schweigend entgegen und schiebt den Vertrag über den Tisch zurück. \"Wir haben geliefert, was wir versprochen haben. Unsere Werke werden andere Kunden finden.\"\n\nDer Rüstungsvertrag mit §Y[Root.GetPeCorpName]§! ist beendet."
