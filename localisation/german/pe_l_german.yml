l_german:
 policy_pe_economic_order:0 "Wirtschaftsordnung"
 policy_pe_economic_order_desc:0 "Wie viel unserer Wirtschaft überlassen wir privaten Unternehmen? Je freier der Markt, desto mehr Distrikt-Plätze bewirtschaften Privatfirmen nach eigenem Ermessen."
 pe_order_planned:0 "Planwirtschaft"
 pe_order_planned_name:0 "$pe_order_planned$"
 pe_order_planned_desc:0 "Der Staat plant und betreibt die gesamte Wirtschaft. Keine Privatfirmen."
 pe_order_guided:0 "Gelenkte Wirtschaft"
 pe_order_guided_name:0 "$pe_order_guided$"
 pe_order_guided_desc:0 "Der Staat lenkt, Privatfirmen dürfen bis zu §Y20 %§! der Distrikt-Plätze bewirtschaften."
 pe_order_mixed:0 "Gemischte Wirtschaft"
 pe_order_mixed_name:0 "$pe_order_mixed$"
 pe_order_mixed_desc:0 "Staat und Markt teilen sich die Wirtschaft. Privatfirmen dürfen bis zu §Y40 %§! der Distrikt-Plätze bewirtschaften."
 pe_order_free_market:0 "Freie Marktwirtschaft"
 pe_order_free_market_name:0 "$pe_order_free_market$"
 pe_order_free_market_desc:0 "Der Markt entscheidet. Privatfirmen dürfen bis zu §Y60 %§! der Distrikt-Plätze bewirtschaften."
 pe_order_laissez_faire:0 "Laissez-faire"
 pe_order_laissez_faire_name:0 "$pe_order_laissez_faire$"
 pe_order_laissez_faire_desc:0 "Der Staat hält sich heraus. Privatfirmen dürfen bis zu §Y80 %§! der Distrikt-Plätze bewirtschaften."
 pe_deposit_cat_firms:0 "Privatfirmen"
 d_pe_firm_steelworks:0 "Private Stahlwerke"
 d_pe_firm_steelworks_desc:0 "Ein privates Unternehmen betreibt hier Stahlwerke. Es belegt einen Distrikt-Platz und beschäftigt eigene Metallurgen, deren Einsatz wir nicht steuern können."
 d_pe_firm_conglomerate:0 "Privater Mischkonzern"
 d_pe_firm_conglomerate_desc:0 "Ein Konzern produziert auf derselben Fläche Legierungen, Konsumgüter und Handel. Er belegt einen Distrikt-Platz; seine Belegschaft können wir nicht steuern."
 job_pe_private_metallurgist:0 "Privater Metallurg"
 job_pe_private_metallurgist_plural:0 "Private Metallurgen"
 job_pe_private_metallurgist_desc:0 "Metallurgen in Diensten eines Privatunternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat steuerbar."
 mod_job_pe_private_metallurgist_add:0 "[pe_private_metallurgist.GetName]-Jobs"
 job_pe_private_artisan:0 "Privater Handwerker"
 job_pe_private_artisan_plural:0 "Private Handwerker"
 job_pe_private_artisan_desc:0 "Handwerker in Diensten eines Privatunternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat steuerbar."
 mod_job_pe_private_artisan_add:0 "[pe_private_artisan.GetName]-Jobs"
 job_pe_private_trader:0 "Privater Händler"
 job_pe_private_trader_plural:0 "Private Händler"
 job_pe_private_trader_desc:0 "Händler in Diensten eines Privatunternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat steuerbar."
 mod_job_pe_private_trader_add:0 "[pe_private_trader.GetName]-Jobs"
 pe_building_private_exchange:0 "Private Börse"
 pe_building_private_exchange_desc:0 "Eine von Privatfirmen betriebene Börse. Der Staat kann sie weder abreißen noch stilllegen; ihre Händler arbeiten auf eigene Rechnung."
