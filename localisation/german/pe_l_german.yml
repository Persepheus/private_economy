l_german:
 policy_pe_economic_order:0 "Wirtschaftsordnung"
 policy_pe_economic_order_desc:0 "Wie viel unserer Wirtschaft überlassen wir privaten Unternehmen? Je freier der Markt, desto mehr Distrikt-Plätze bewirtschaften Privatfirmen nach eigenem Ermessen."
 pe_order_planned:0 "Planwirtschaft"
 pe_order_planned_name:0 "$pe_order_planned$"
 pe_order_planned_desc:0 "Der Staat plant und betreibt die gesamte Wirtschaft. Keine Privatfirmen."
 pe_order_guided:0 "Gelenkte Wirtschaft"
 pe_order_guided_name:0 "$pe_order_guided$"
 pe_order_guided_desc:0 "Der Staat lenkt, Privatfirmen dürfen bis zu §Y20 %§! der Distrikt-Plätze bewirtschaften."
 pe_order_mixed:0 "Gemischte Wirtschaft"
 pe_order_mixed_name:0 "$pe_order_mixed$"
 pe_order_mixed_desc:0 "Staat und Markt teilen sich die Wirtschaft. Privatfirmen dürfen bis zu §Y40 %§! der Distrikt-Plätze bewirtschaften."
 pe_order_free_market:0 "Freie Marktwirtschaft"
