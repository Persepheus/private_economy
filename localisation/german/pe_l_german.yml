l_german:
 policy_pe_economic_order:0 "Wirtschaftsordnung"
 policy_pe_economic_order_desc:0 "Wie viel unserer Wirtschaft überlassen wir privaten Unternehmen? Privatfirmen übernehmen Distriktplätze, betreiben eigene Jobs (deren Priorität wir nicht setzen können) und entscheiden selbst, was sie herstellen, nach Preisen und Bedarf. Dafür zahlt ihnen der Staat einen Anteil ihrer Wertschöpfung in Handel, und ein Teil des Handelseinkommens fließt in private Ersparnisse: das Kapital, mit dem die Investoren neue Firmen gründen."
 pe_order_planned:0 "Planwirtschaft"
 pe_order_planned_name:0 "$pe_order_planned$"
 pe_order_planned_desc:0 "Der Staat plant und lenkt die gesamte Wirtschaft. Es gibt keine Privatfirmen, keine Investoren und keine Gewinne zu bezahlen."
 pe_order_guided:0 "Gelenkte Wirtschaft"
 pe_order_guided_name:0 "$pe_order_guided$"
 pe_order_guided_desc:0 "Der Staat lenkt, Privatfirmen füllen die Lücken: Sie dürfen bis zu §Y20 %§! der Distriktplätze betreiben. Sie verdienen wenig, und der Staat kann sie für Einfluss ohne Entschädigung schließen."
 pe_order_mixed:0 "Gemischte Wirtschaft"
 pe_order_mixed_name:0 "$pe_order_mixed$"
 pe_order_mixed_desc:0 "Staat und Markt teilen sich die Wirtschaft: Privatfirmen dürfen bis zu §Y40 %§! der Distriktplätze betreiben. Der Staat kann Firmen weiterhin für Einfluss schließen, muss die Eigentümer aber entschädigen."
 pe_order_free_market:0 "Freie Marktwirtschaft"
 pe_order_free_market_name:0 "$pe_order_free_market$"
 pe_order_free_market_desc:0 "Der Markt entscheidet: Privatfirmen dürfen bis zu §Y60 %§! der Distriktplätze betreiben. Investoren können anbieten, Staatsdistrikte zu kaufen."
 pe_order_laissez_faire:0 "Laissez-faire"
 pe_order_laissez_faire_name:0 "$pe_order_laissez_faire$"
 pe_order_laissez_faire_desc:0 "Der Staat hält sich heraus: Privatfirmen dürfen bis zu §Y80 %§! der Distriktplätze betreiben und kaufen Staatsdistrikte, ohne zu fragen. Ihre Gewinne sind hoch."
 pe_deposit_cat_firms:0 "Privatfirmen"
 job_pe_private_metallurgist:0 "Privater Metallurg"
 job_pe_private_metallurgist_plural:0 "Private Metallurgen"
 job_pe_private_metallurgist_desc:0 "Metallurgen in Diensten eines Privatunternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat steuerbar."
 mod_job_pe_private_metallurgist_add:0 "[pe_private_metallurgist.GetName]-Jobs"
 job_pe_private_artisan:0 "Privater Handwerker"
 job_pe_private_artisan_plural:0 "Private Handwerker"
 job_pe_private_artisan_desc:0 "Handwerker in Diensten eines Privatunternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat steuerbar."
 mod_job_pe_private_artisan_add:0 "[pe_private_artisan.GetName]-Jobs"
 job_pe_private_trader:0 "Privater Händler"
 job_pe_private_trader_plural:0 "Private Händler"
 job_pe_private_trader_desc:0 "Händler in Diensten eines Privatunternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat steuerbar."
 mod_job_pe_private_trader_add:0 "[pe_private_trader.GetName]-Jobs"
 pe_building_private_exchange:0 "Private Börse"
 pe_building_private_exchange_desc:0 "Eine von Privatfirmen betriebene Börse. Der Staat kann sie weder abreißen noch stilllegen; ihre Händler arbeiten auf eigene Rechnung."
 job_pe_private_miner:0 "Privater Bergmann"
 job_pe_private_miner_plural:0 "Private Bergleute"
 job_pe_private_miner_desc:0 "Bergleute im Dienst eines privaten Unternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat gesteuert."
 mod_job_pe_private_miner_add:0 "[pe_private_miner.GetName] Arbeitsplätze"
 job_pe_private_technician:0 "Privater Techniker"
 job_pe_private_technician_plural:0 "Private Techniker"
 job_pe_private_technician_desc:0 "Techniker im Dienst eines privaten Unternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat gesteuert."
 mod_job_pe_private_technician_add:0 "[pe_private_technician.GetName] Arbeitsplätze"
 job_pe_private_farmer:0 "Privater Bauer"
 job_pe_private_farmer_plural:0 "Private Bauern"
 job_pe_private_farmer_desc:0 "Bauern im Dienst eines privaten Unternehmens. Etwas produktiver als im Staatsdienst, aber nicht vom Staat gesteuert."
 mod_job_pe_private_farmer_add:0 "[pe_private_farmer.GetName] Arbeitsplätze"
 pe_private_economy_title:0 "Privatwirtschaft"
 pe_buyout_refused:0 "Übernahme abgelehnt"
 pe_buyout_refused_desc:0 "Die Regierung hat hier eine private Investition blockiert. Die Wirtschaft ist verstimmt."
 pe.110.name:0 "Ein Übernahmeangebot"
 pe.110.a:0 "Den Distrikt verkaufen."
 pe.110.b:0 "Der Distrikt bleibt in Staatshand."
 pe.6.name:0 "Privatwirtschaft: Diagnose"
 pe.6.a:0 "Verstanden."
 pe.110.desc.urban:0 "Investoren wollen einen staatlichen Stadtdistrikt auf §Y[pe_offer_planet.GetName]§! kaufen und daraus ein Unternehmen machen: §Y[Root.GetPeOfferFirm]§!. Sie bieten §G750§! £minerals£ und §G150§! £trade£ aus dem Privatkapital.\n\nIn der Freien Marktwirtschaft kommt eine Absage bei der Wirtschaft schlecht an."
 pe.110.desc.rural:0 "Investoren wollen einen staatlichen [Root.GetPeOfferDistrict] auf §Y[pe_offer_planet.GetName]§! kaufen und daraus ein Unternehmen machen: §Y[Root.GetPeOfferFirm]§!. Sie bieten §G450§! £minerals£ und §G90§! £trade£ aus dem Privatkapital.\n\nIn der Freien Marktwirtschaft kommt eine Absage bei der Wirtschaft schlecht an."
 pe.6.desc:0 "Privatanteil: §Y[Root.pe_private_share]%§!, Gewinnanteil: §Y[Root.pe_profit_pct]%§!\nInvestorenpool: §Y[Root.pe_capital]§! £trade£ (+[Root.pe_pool_income] letztes Quartal, davon [Root.pe_savings_last] private Ersparnisse)\nDu zahlst pro Monat: §Y[Root.pe_profit_month]§! £trade£ Gewinne, §Y[Root.pe_sav_month]§! £trade£ Ersparnisse (Budgetzeilen „Gewinne der Privatfirmen“ und „Private Ersparnisse“)\n\n§HSchattenpreise§! (£trade£ pro Einheit)\nLegierungen: [Root.pe_s_alloys]\nKonsumgüter: [Root.pe_s_consumer_goods]\nMineralien: [Root.pe_s_minerals]\nEnergie: [Root.pe_s_energy]\nNahrung: [Root.pe_s_food]\nHandel: [Root.pe_s_trade]\nEinheit: [Root.pe_s_unity], Forschung: [Root.pe_s_physics_research]\nNotfall (Ressource in unter einem Jahr leer): [Root.pe_emergency]\n\n§HInvestitionsmix§! (Anteil / Ziel / Wertfaktor)\nLegierungen: [Root.pe_tri_pct_a]% / [Root.pe_tgt_a]% / ×[Root.pe_tri_f_a]\nForschung: [Root.pe_tri_pct_r]% / [Root.pe_tgt_r]% / ×[Root.pe_tri_f_r]\nEinheit: [Root.pe_tri_pct_u]% / [Root.pe_tgt_u]% / ×[Root.pe_tri_f_u]\n\n§HWertschöpfung pro Job§! (£trade£ pro Monat)\nMetallurg: [Root.pe_vaj_pe_private_metallurgist]\nKunsthandwerker: [Root.pe_vaj_pe_private_artisan]\nHändler: [Root.pe_vaj_pe_private_trader]\nBergmann: [Root.pe_vaj_pe_private_miner]\nTechniker: [Root.pe_vaj_pe_private_technician]\nBauer: [Root.pe_vaj_pe_private_farmer]\nUnterhalter: [Root.pe_vaj_pe_private_entertainer] (+[Root.pe_ent_val] auf der Hauptstadt)\nPhysiker: [Root.pe_vaj_pe_private_physicist]\n\n§HHauptstadt§!\nDistrikte: [Root.pe_diag_districts], freie Plätze: [Root.pe_diag_free]\nFirmen: [Root.pe_diag_firms] von [Root.pe_diag_target] erlaubt\nPrivatjobs besetzt: [Root.pe_fill_cur]\nBeste neue Firma: §Y[Root.GetPeBestFirm]§! (Wert [Root.pe_best])"
 pe_clear_mixed_tt:0 "Die Investoren bekommen den Handel als Entschädigung. Der Planet nimmt die Enteignung übel, und fünf Jahre lang eröffnet hier keine neue Privatfirma."
 pe_clear_guided_tt:0 "Die Investoren verlieren die Firma ohne Entschädigung. Fünf Jahre lang eröffnet hier keine neue Privatfirma."
 pe_expropriation:0 "Enteignung"
 pe_expropriation_desc:0 "Der Staat hat hier eine Privatfirma geräumt. Unternehmer wie Arbeiter sind beunruhigt."
 pe_order_planned_tt:0 "§HKeine Privatwirtschaft§!\nAlle Privatfirmen werden sofort zu Staatsdistrikten ihres Typs, Baustellen neuer Firmen werden aufgegeben. Die Investoren verlieren alles: ihr Kapital, unsere Aktien und unsere Anleihen sind weg."
 pe_order_guided_tt:0 "§HPrivatfirmen:§! bis zu §Y20 %§! der Distriktplätze\n§HGewinnanteil:§! §Y7,5 %§! ihrer Wertschöpfung, gezahlt in £trade£ Handel\n§HPrivate Ersparnisse:§! §Y5 %§! des Handelseinkommens\n§HFirmen räumen:§! für £influence£ Einfluss, ohne Entschädigung"
 pe_order_mixed_tt:0 "§HPrivatfirmen:§! bis zu §Y40 %§! der Distriktplätze\n§HGewinnanteil:§! §Y10 %§! ihrer Wertschöpfung, gezahlt in £trade£ Handel\n§HPrivate Ersparnisse:§! §Y10 %§! des Handelseinkommens\n§HFirmen räumen:§! für mehr £influence£ Einfluss plus £trade£ Handel als Entschädigung; der Planet nimmt es übel"
 pe_order_free_market_tt:0 "§HPrivatfirmen:§! bis zu §Y60 %§! der Distriktplätze\n§HGewinnanteil:§! §Y12,5 %§! ihrer Wertschöpfung, gezahlt in £trade£ Handel\n§HPrivate Ersparnisse:§! §Y15 %§! des Handelseinkommens\n§HAufkäufe:§! Investoren bieten an, Staatsdistrikte zu kaufen; eine Ablehnung verärgert sie"
 pe_order_laissez_faire_tt:0 "§HPrivatfirmen:§! bis zu §Y80 %§! der Distriktplätze\n§HGewinnanteil:§! §Y17,5 %§! ihrer Wertschöpfung, gezahlt in £trade£ Handel\n§HPrivate Ersparnisse:§! §Y20 %§! des Handelseinkommens\n§HAufkäufe:§! Investoren kaufen Staatsdistrikte, ohne zu fragen"
 pe_holdings_name:0 "Private Holdings"
 pe_proto_fleet_name:0 "Geleaste Sicherheitsflotte"
 pe.19.name:0 "Private Holdings (Prototyp)"
 pe.19.desc:0 "§HLager§!\nMineralien: [Root.pe_ph_min] (+[Root.pe_ph_min_inc] im Monat)\nEnergie: [Root.pe_ph_en] (+[Root.pe_ph_en_inc] im Monat)\nLegierungen: [Root.pe_ph_al]\n\n§HBesitz§!\nOrbitalstationen: [Root.pe_ph_st]\nMegastrukturen: [Root.pe_ph_ms]\nGeleaste Flotten (in ihrem Besitz): [Root.pe_ph_fl]\nGeleaste Flotten (von uns gesteuert): [Root.pe_ph_ctl]"
 pe.19.a:0 "Schließen."
 pe.20.name:0 "Private Holdings: Verkauf"
 pe.20.desc:0 "Die Holdings haben uns §G[Root.pe_ph_min]§! £minerals£ Mineralien und §G[Root.pe_ph_en]§! £energy£ Energie für §Y[Root.pe_ph_pay]§! £trade£ verkauft (halber Grundpreis). Der Handel ging in den Investorenpool. Unser Lager: Mineralien [Root.pe_ph_min0] → [Root.pe_ph_min1], Energie [Root.pe_ph_en0] → [Root.pe_ph_en1]."
 pe.20.a:0 "Schließen."
 pe_leased_fleet:0 "Geleast von den Private Holdings"
 pe_leased_fleet_desc:0 "Die Holdings zahlen den Unterhalt dieser Flotte; sie belegt keine Flottenkapazität."
 pe_msg_supply_m:0 "Liefervertrag: Eine private Mine auf $FROM$ beliefert jetzt eine Firma auf $PLANET$ mit Mineralien. Beide Branchen produzieren mehr."
 pe_msg_supply_c:0 "Liefervertrag: Eine private Fabrik auf $FROM$ beliefert jetzt eine Firma auf $PLANET$ mit Konsumgütern. Beide Branchen produzieren mehr."
 pe_msg_supply_f:0 "Liefervertrag: Ein privater Agrarbetrieb auf $FROM$ beliefert jetzt eine Firma auf $PLANET$ mit Nahrung. Beide Branchen produzieren mehr."
 pe_msg_supply_broken:0 "Ein Liefervertrag einer Firma auf $PLANET$ ist beendet: Ihren Lieferanten gibt es nicht mehr. Die Firma sucht in einem Jahr einen neuen."
 pe.25.name:0 "Arc Furnace der Holdings (Prototyp)"
 pe.25.desc:0 "§HOfen§! bei [pe_paf_p.GetName]\nStufe: [Root.pe_paf_stage] (Ausbau läuft: [Root.pe_paf_upg])\nOverclock: [Root.pe_paf_oc] (0 keiner, 1 Mineralien, 2 ausgewogen, 3 Legierungen, 4 Konsumgüter)\nPlaneten im System mit Ofen-Vorkommen: [Root.pe_paf_dep]\n\n§HStationen im System§!\nUnsere: [Root.pe_paf_our] (auf Ofen-Vorkommen: [Root.pe_paf_ourdep])\nHoldings: [Root.pe_paf_hst]\nAndere: [Root.pe_paf_oth]\n\n§HPrivate Holdings§! (Lager, pro Monat, seit pe.22)\nMineralien: [Root.pe_paf_min] ([Root.pe_paf_min_inc]; [Root.pe_paf_min_d])\nLegierungen: [Root.pe_paf_al] ([Root.pe_paf_al_inc]; [Root.pe_paf_al_d])\nEnergie: [Root.pe_paf_en] ([Root.pe_paf_en_inc]; [Root.pe_paf_en_d])\nKonsumgüter: [Root.pe_paf_cg] ([Root.pe_paf_cg_inc]; [Root.pe_paf_cg_d])\n\n§HUnser Einkommen§!\nMineralien: [Root.pe_paf_our_min], Legierungen: [Root.pe_paf_our_al]"
 pe.25.a:0 "Schließen."
 pe_warzone:0 "Kriegsgebiet"
 pe_warzone_desc:0 "Dieser Planet wurde vor Kurzem bombardiert. Investoren halten sich fern: vorerst keine neuen Privatfirmen, keine Übernahmen, kein Umbau hier."
 pe_dbg_invaders_name:0 "Invasoren (Debug)"
 pe.110.desc.urban_hab:0 "Investoren wollen einen staatlichen Distrikt auf dem Habitat §Y[pe_offer_planet.GetName]§! kaufen und daraus ein Unternehmen machen: §Y[Root.GetPeOfferFirm]§!. Sie bieten §G225§! £alloys£ und §G150§! £trade£ aus dem Privatkapital.\n\nIn der Freien Marktwirtschaft kommt eine Absage bei der Wirtschaft schlecht an."
 pe.110.desc.rural_hab:0 "Investoren wollen einen staatlichen Distrikt auf dem Habitat §Y[pe_offer_planet.GetName]§! kaufen und daraus ein Unternehmen machen: §Y[Root.GetPeOfferFirm]§!. Sie bieten §G225§! £alloys£ und §G90§! £trade£ aus dem Privatkapital.\n\nIn der Freien Marktwirtschaft kommt eine Absage bei der Wirtschaft schlecht an."
 pe_proto_sprawl_districts:0 "Ausdehnungs-Test: Distrikte"
 pe_proto_sprawl_districts_desc:0 "Prototyp: keine Ausdehnung durch die Distrikte dieses Planeten."
 pe_proto_sprawl_pops:0 "Ausdehnungs-Test: Pops"
 pe_proto_sprawl_pops_desc:0 "Prototyp: keine Ausdehnung durch die Pops dieses Planeten?"
 pe_proto_sprawl_colonies:0 "Ausdehnungs-Test: Kolonie"
 pe_proto_sprawl_colonies_desc:0 "Prototyp: keine Ausdehnung für diese Kolonie?"
 pe_proto_sprawl_total:0 "Ausdehnungs-Test: Alles"
 pe_proto_sprawl_total_desc:0 "Prototyp: gar keine Ausdehnung durch diesen Planeten?"
 pe_sprawl_firms:0 "Privatfirmen (Distriktplätze)"
 pe_sprawl_firms_desc:0 "Privatfirmen belegen Distriktplätze und zählen wie Distrikte."
 pe_sprawl_corp_hab:0 "Konzern-Habitate"
 pe_sprawl_corp_hab_desc:0 "Habitate, die Konzerne betreiben, zählen nicht als unsere Kolonien."
 pe.300.name:0 "Ein Konzern-Habitat"
 pe.300.desc:0 "§Y[Root.GetPeCorpName300]§! will bei §Y[pe_chab_planet.GetName]§! im System §Y[pe_chab_sys.GetName]§! ein eigenes Habitat bauen. Die Legierungen zahlt der Konzern aus seiner Kasse; von uns braucht er die Genehmigung und §Y[Root.pe_chab_inf]§! £influence£ Einfluss.\n\nIst es fertig, besiedelt der Konzern es mit unseren Leuten. Es bleibt unsere Kolonie, aber der Konzern führt es: Er legt die Designation fest, alle Firmen dort gehören ihm, er bezahlt dort Gründung, Wachstum und Automatisierung (25 % günstiger) und verlegt seinen Hauptsitz dorthin. Verstaatlichen oder räumen können wir dort nichts. Dafür kostet uns das Habitat keine Ausdehnung für Kolonie, Distrikte und Firmen (nur für seine Pops). Eine Planwirtschaft beendet auch diese Rechte."
 pe.300.a:0 "Genehmigt."
 pe.300.a.tt:0 "Der Konzern zahlt 6000 £trade£ aus seiner Kasse, wir §Y[Root.pe_chab_inf]§! £influence£. Bauzeit wie bei einem Habitat (fünf Jahre, mit unserer Megastruktur-Baugeschwindigkeit), danach besiedelt der Konzern es (Kolonieschiff aus seiner Kasse)."
 pe.300.b:0 "Habitate baut der Staat."
 pe_msg_chab_start:0 "§Y$CORP$§! baut bei $PLANET$ ein Konzern-Habitat."
 pe_msg_chab_done:0 "Das Konzern-Habitat von §Y$CORP$§! ist fertig: $PLANET$. Der Konzern besiedelt es jetzt."
 pe_msg_chab_orphan:0 "Das Habitat $PLANET$ ist fertig, aber sein Konzern ist aufgelöst. Es gehört uns, wir können es selbst besiedeln."
 pe_msg_chab_end:0 "Das Konzern-Habitat $PLANET$ hat seine Konzernrechte verloren: Es bleibt unsere Kolonie, seine Firmen sind jetzt unabhängig."
 pe_msg_chab_hq:0 "§Y$CORP$§! hat seinen Hauptsitz in sein Konzern-Habitat $PLANET$ verlegt."
 pe_chab_reg_line:0 "§HKonzern-Habitat§! von §Y[Root.GetPeChabRegName]§!: Der Konzern legt die Designation fest, besitzt alle Firmen und trägt hier alle Kosten (25 % günstiger); keine Verstaatlichung, keine Räumung.\n\n"
 pe_sprawl_corp_hab_d:0 "Konzern-Habitate (Distrikte)"
 pe_sprawl_corp_hab_d_desc:0 "Die Distrikte der Habitate, die Konzerne betreiben, zählen nicht zu unserer Ausdehnung."
 pe_hold_mega_speed:0 "Megastruktur-Baugeschwindigkeit des Reichs"
 pe_hold_mega_speed_desc:0 "Die Private Holdings bauen Megastrukturen für ihre Konzerne so schnell wie ihr Reich."
 pe_corp_habitat_site:0 "Baustelle Konzern-Habitat"
 pe_corp_habitat_site_DESC:0 "Unsere Private Holdings bauen hier ein Habitat für einen unserer Konzerne."
 pe_corp_habitat_site_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_habitat_complex:0 "Zentralkomplex Konzern-Habitat"
 pe_corp_habitat_complex_DESC:0 "Unsere Private Holdings bauen hier ein Habitat für einen unserer Konzerne. Ist es fertig, besiedelt der Konzern es mit unseren Leuten."
 pe_corp_habitat_complex_MEGASTRUCTURE_DETAILS:0 ""
 pe_msg_chab_refund:0 "Die Habitat-Baustelle bei $PLANET$ ist fertig, aber im System steht schon ein Habitat. Der Konzern bekommt sein Geld zurück, wir unseren Einfluss."
 pe_msg_swarm_done:0 "Der Dyson-Schwarm eines Konzerns bei $PLANET$ ist fertig."
 pe_msg_corp_swarm_start:0 "§Y$CORP$§! baut bei $PLANET$ einen eigenen Dyson-Schwarm."
 pe_msg_corp_furnace_start:0 "§Y$CORP$§! baut über $PLANET$ einen eigenen Arc Furnace."
 pe_corp_welfare:0 "Betriebliche Sozialleistungen"
 pe_corp_welfare_desc:0 "Reiche Konzerne behandeln ihre Beschäftigten hier wie Beamte: beste Löhne, Betriebsrenten und Sozialleistungen, bezahlt aus der eigenen Kasse. Ihre Arbeiter leben auf dem Niveau des utopischen Überflusses."
 pe.306.name:0 "Ein Rüstungsvertrag"
 pe.306.desc:0 "§Y[Root.GetPeCorpName306]§! bietet uns einen Rüstungsvertrag an. Der Konzern übernähme §Y[Root.pe_dc_s] %§! des Unterhalts unserer Flotte, solange er es sich leisten kann (20 %, solange er sehr reich ist), und zahlte den Gegenwert jedes Quartal aus seiner Kasse.\n\nIm Gegenzug will er volle Auftragsbücher: Sonderschichten in seinen Stahlwerken, den ersten Zuschlag, wenn wir Kriegsschiffe leasen, und seinen Hauptsitz als Rüstungszentrum."
 pe.306.a:0 "Vertrag unterzeichnen."
 pe.306.a.tt:0 "Unser Flottenunterhalt §G-[Root.pe_dc_s] %§!, solange der Vertrag läuft. Der Konzern zahlt den eingesparten Wert (zu Grundpreisen) aus seiner Kasse. Seine Stahlwerke bekommen Rüstungsaufträge (+10 % Arbeitskraft der privaten Metallurgen dort), sein Hauptsitz wird Rüstungszentrum (+2 Stabilität, +10 % Metallurgen), und Kriegsleasing kommt zuerst von ihm. Der Vertrag endet, wenn seine Kasse unter 1000 fällt."
 pe.306.b:0 "Die Flotte ist Sache des Staates."
 pe_msg_dc_end:0 "Unser Rüstungsvertrag ist ausgelaufen: Der Konzern kann ihn sich nicht mehr leisten oder existiert nicht mehr."
 pe_dc_reg_line:0 "§HRüstungsvertrag§! mit §Y[Root.GetPeDcName]§!: [Root.pe_dc_s] % des Flottenunterhalts, letztes Quartal [Root.pe_dc_paid] £trade£\n"
 pe_defence_contract:0 "Rüstungsvertrag"
 pe_defence_contract_desc:0 "Ein Konzern übernimmt einen Teil des Unterhalts unserer Flotte und bezahlt ihn aus seiner eigenen Kasse."
 pe_arms_orders:0 "Rüstungsaufträge"
 pe_arms_orders_desc:0 "Die Stahlwerke unseres Rüstungskonzerns fahren Sonderschichten: volle Auftragsbücher."
 pe_arms_centre:0 "Rüstungszentrum"
 pe_arms_centre_desc:0 "Der Hauptsitz unseres Rüstungskonzerns: ein Zentrum der Rüstungsindustrie, angesehen und gut bezahlt."
 pe_auto_cover:0 "Private Automatisierung"
 pe_auto_cover_desc:0 "Die Privatfirmen bezahlen die Energie für ihre automatisierten Jobs selbst; dieser Anteil unseres Unterhalts für automatisierte Arbeitskraft entfällt."
 pe_corp_swarm_site:0 "Baustelle Konzern-Dyson-Schwarm"
 pe_corp_swarm_site_DESC:0 "Unsere Private Holdings bauen hier einen Dyson-Schwarm für einen unserer Konzerne."
 pe_corp_swarm_site_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_swarm_build:0 "Konzern-Dyson-Schwarm (im Bau)"
 pe_corp_swarm_build_DESC:0 "Unsere Private Holdings bauen hier einen Dyson-Schwarm für einen unserer Konzerne. Ist er fertig, erntet er den Stern für ihn."
 pe_corp_swarm_build_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_furnace_site:0 "Baustelle Konzern-Arc-Furnace"
 pe_corp_furnace_site_DESC:0 "Unsere Private Holdings bauen hier einen Arc Furnace für einen unserer Konzerne."
 pe_corp_furnace_site_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_furnace_build:0 "Konzern-Arc-Furnace (im Bau)"
 pe_corp_furnace_build_DESC:0 "Unsere Private Holdings bauen hier einen Arc Furnace für einen unserer Konzerne. Ist er fertig, bekommt jeder Himmelskörper des Systems sein Vorkommen."
 pe_corp_furnace_build_MEGASTRUCTURE_DETAILS:0 ""
