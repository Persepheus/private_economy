 pe.270.name:0 "Ein Konzern entsteht"
 pe.270.desc:0 "Eine Privatfirma auf §Y[pe_corp_planet.GetName]§! ist zu einem Konzern gewachsen: §Y[Root.GetPeCorpName]§!, Branche [Root.GetPeCorpGroup]. Vorstandsvorsitz: §Y[Root.GetPeCorpCeo]§!.\n\nVon nun an übernimmt er kleinere unabhängige Firmen seiner Branche, und die Hälfte dessen, was seine Firmen über ihren Bedarf hinaus verdienen, fließt in seine eigene Kasse. Sein Hauptsitz stärkt den Planeten."
 pe.270.a:0 "Möge er gedeihen."
 pe.271.name:0 "Preiskampf"
 pe.271.desc:0 "§Y[Root.GetPeCorpA]§! und §Y[Root.GetPeCorpB]§! kämpfen um dieselben Kunden: Rabatte, abgeworbene Manager, Werbung überall. Ihre Betriebe produzieren mehr denn je, aber die Gewinne schmelzen.\n\nEiner von beiden wird das nicht durchhalten."
 pe.271.a:0 "Konkurrenz belebt das Geschäft."
 pe.271.a.tt:0 "Drei Jahre lang machen ihre Firmen §R30 %§! weniger Gewinn; Planeten mit ihren Firmen produzieren §G3 %§! mehr."
 pe.271.b:0 "Sie an einen Tisch bringen."
 pe.271.b.tt:0 "Der Preiskampf endet nach einem Jahr."
 pe.272.name:0 "Eine Fusion"
 pe.272.desc:0 "§Y[Root.GetPeCorpA]§! hat den Preiskampf gewonnen. Jetzt will er den erschöpften Rivalen §Y[Root.GetPeCorpB]§! übernehmen: alle Firmen, die ganze Kasse. Die Wirtschaftspresse nennt es unvermeidlich; andere warnen vor einem Monopol."
 pe.272.a:0 "Die Fusion genehmigen."
 pe.272.a.tt:0 "Alle Firmen und die Kasse des schwächeren Konzerns gehen an den stärkeren. Der schwächere hört auf zu existieren."
 pe.272.b:0 "Sie untersagen."
 pe.272.b.tt:0 "Der schwächere Konzern bleibt eigenständig, verliert aber ein Viertel seiner Kasse."
 pe.273.name:0 "Konzernregister"
 pe.273.desc:0 "[Root.GetPeCorpLine1]\n[Root.GetPeCorpLine2]\n[Root.GetPeCorpLine3]\n[Root.GetPeCorpLine4]\n[Root.GetPeCorpLine5]\n[Root.GetPeCorpLine6]\n[Root.GetPeCorpLine7]\n[Root.GetPeCorpLine8]"
 pe.273.a:0 "Schließen."
 pe.280.name:0 "Eine Konzern-Station"
 pe.280.desc.build:0 "§Y[Root.GetPeCorpName]§! will über §Y[pe_st_planet.GetName]§! eine eigene Station bauen, auf einem Vorkommen, das wir noch nicht nutzen. Der Konzern zahlt den Bau selbst, dazu eine Konzessionsgebühr von §G[Root.pe_st_pay]§! £minerals£ Mineralien und jedes Jahr ein Fünftel des Stationswerts.\n\nDen Ertrag würde er selbst verarbeiten und dafür auf seinem Hauptsitz doppelt so viel Wert in seinem eigenen Produkt herstellen."
 pe.280.desc.buy:0 "§Y[Root.GetPeCorpName]§! will unsere Station über §Y[pe_st_planet.GetName]§! kaufen. Der Konzern bietet §G[Root.pe_st_pay]§! £minerals£ Mineralien, die doppelten Baukosten, und jedes Jahr ein Fünftel des Stationswerts.\n\nDen Ertrag würde er selbst verarbeiten und dafür auf seinem Hauptsitz doppelt so viel Wert in seinem eigenen Produkt herstellen."
 pe.280.a:0 "Einverstanden."
 pe.280.a.tt:0 "Die Station gehört dem Konzern (verwaltet von unseren Private Holdings). Wir verlieren ihren Ertrag und bekommen dafür das Doppelte ihres Werts als Konzernproduktion."
 pe.280.b:0 "Der Orbit bleibt unser."
 pe.281.name:0 "Lagerbestand zu verkaufen"
 pe.281.desc:0 "Unsere Private Holdings haben noch §Y[Root.pe_hs_amt]§! Einheiten eines Rohstoffs auf Lager, der uns fehlt. Sie bieten ihn uns für §Y[Root.pe_hs_cost]§! £trade£ an, 60 % des Marktpreises."
 pe.281.a:0 "Kaufen."
 pe.281.a.tt:0 "Wir bekommen den Bestand und zahlen den Handel in den Investorenpool."
 pe.281.b:0 "Sollen sie ihn exportieren."
 pe_corp_fleet_name:0 "Konzernflotte"
 pe.282.name:0 "Eine Flotte für den Krieg"
 pe.282.desc:0 "§Y[Root.GetPeCorpName]§! bietet an, Kriegsschiffe unseres neuesten Entwurfs auf eigene Kosten zu bauen und uns für den Krieg zu leasen: fünf Jahre, gegen eine Leasinggebühr (ein Zehntel des üblichen Unterhalts), ohne Flottenkapazität zu belegen.\n\nPatriotismus, sagt der Vorstand. Ein gutes Geschäft, sagen andere."
 pe.282.a:0 "Wir nehmen an."
 pe.282.a.tt:0 "Eine Flotte unserer größten Schiffsklasse, etwa ein Viertel unserer Flottenstärke, erscheint in der Hauptstadt. Wir befehligen sie; sie gehört dem Konzern."
 pe.282.b:0 "Unsere Kriege führen wir selbst."
 pe.283.name:0 "Das Leasing endet"
 pe.283.desc:0 "§Y[Root.GetPeCorpName]§! will seine Schiffe zurück. Stattdessen könnten wir sie kaufen: §Y[Root.pe_fl_price]§! £alloys£ Legierungen für die ganze Flotte."
 pe.283.a:0 "Die Flotte kaufen."
 pe.283.a.tt:0 "Die Flotte gehört uns (ab jetzt normaler Unterhalt und Flottenkapazität)."
 pe.283.b:0 "Die Schiffe zurückgeben."
 pe.284.name:0 "Jagdrechte"
 pe.284.desc:0 "Weltraumkreaturen in §Y[pe_cl_sys.GetName]§! blockieren unsere Ausdehnung. §Y[Root.GetPeCorpName]§! bietet eine Flotte an, um das System zu säubern, gegen die Beuterechte: Was sich von den Kreaturen verwerten lässt, gehört dem Konzern.\n\nWir würden die Flotte befehligen, bis das System frei ist, höchstens drei Jahre."
 pe.284.a:0 "Waidmannsheil."
 pe.284.a.tt:0 "Eine Flotte von etwa anderthalbfacher Stärke der Kreaturen erscheint an unserer Grenze. Ist das System frei, kehrt sie zurück; der Konzern behält die Beute, wir bekommen etwas Gesellschaftsforschung."
 pe.284.b:0 "Wir brauchen keine Söldner."
 pe.285.name:0 "Die Jagd"
 pe.285.desc.ok:0 "§Y[pe_cl_sys.GetName]§! ist frei. Die Konzernflotte ist mit ihrer Beute heimgekehrt, für §Y[Root.GetPeCorpName]§! §Y[Root.pe_cl_loot]§! £trade£ wert. Seine Forscher teilen §G[Root.pe_cl_res]§! £society£ Gesellschaftsforschung mit uns."
 pe.285.desc.no:0 "Der Vertrag für §Y[pe_cl_sys.GetName]§! ist ohne Erfolg zu Ende: Die Flotte ist verloren oder die Zeit ist um. Es gibt keine Beute."
 pe.285.a:0 "Zur Kenntnis genommen."
