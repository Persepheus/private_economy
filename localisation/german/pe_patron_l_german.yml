 pe.210.desc.miner:0 "Die privaten Minen auf §Y[pe_pat_planet.GetName]§! bekommen ihre Stellen nicht besetzt. Die Firmen um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) schlagen Sonderschichten vor: Mehrarbeit für die vorhandenen Bergleute, deutlich besser bezahlt, mit §Y[Root.pe_pat_spend]§! £trade£ aus privatem Kapital.\n\nDie Produktion stiege für Jahre. Die Arbeiter wären müde, und das würde man merken."
 pe.212.desc.miner:0 "Ohne genug Bergleute stehen die halben Minen auf §Y[pe_pat_planet.GetName]§! still. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat einen Leasinggeber gefunden: automatische Bohranlagen und Erntemaschinen samt Wartung, für fünf Jahre. Die Firmen zahlen §Y[Root.pe_pat_spend]§! £trade£; die Maschinen brauchen keine staatliche Energie."
 pe.210.desc.technician:0 "Die privaten Kraftwerke auf §Y[pe_pat_planet.GetName]§! bekommen ihre Stellen nicht besetzt. Die Firmen um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) schlagen Sonderschichten vor: Mehrarbeit für die vorhandenen Techniker, deutlich besser bezahlt, mit §Y[Root.pe_pat_spend]§! £trade£ aus privatem Kapital.\n\nDie Produktion stiege für Jahre. Die Arbeiter wären müde, und das würde man merken."
 pe.212.desc.technician:0 "Ohne genug Techniker stehen die halben Kraftwerke auf §Y[pe_pat_planet.GetName]§! still. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat einen Leasinggeber gefunden: automatische Bohranlagen und Erntemaschinen samt Wartung, für fünf Jahre. Die Firmen zahlen §Y[Root.pe_pat_spend]§! £trade£; die Maschinen brauchen keine staatliche Energie."
 pe.210.desc.farmer:0 "Die privaten Höfe auf §Y[pe_pat_planet.GetName]§! bekommen ihre Stellen nicht besetzt. Die Firmen um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) schlagen Sonderschichten vor: Mehrarbeit für die vorhandenen Bauern, deutlich besser bezahlt, mit §Y[Root.pe_pat_spend]§! £trade£ aus privatem Kapital.\n\nDie Produktion stiege für Jahre. Die Arbeiter wären müde, und das würde man merken."
 pe.212.desc.farmer:0 "Ohne genug Bauern stehen die halben Höfe auf §Y[pe_pat_planet.GetName]§! still. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat einen Leasinggeber gefunden: automatische Bohranlagen und Erntemaschinen samt Wartung, für fünf Jahre. Die Firmen zahlen §Y[Root.pe_pat_spend]§! £trade£; die Maschinen brauchen keine staatliche Energie."
 pe.210.name:0 "Sonderschichten für bessere Löhne"
 pe.210.a:0 "Den Sonderschichten zustimmen."
 pe.210.b:0 "Unsere Arbeiter sind kein Vieh."
 pe.211.name:0 "Gastarbeiter"
 pe.211.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat einen Handel abgeschlossen: §G[Root.pe_gw_pops]§! §Y[pe_gw_species.GetNamePlural]§! aus einem Nachbarreich wollen nach §Y[pe_pat_planet.GetName]§! kommen und die leeren Stellen besetzen. Die Firmen zahlen die Reise mit §Y[Root.pe_pat_spend]§! £trade£; der Staat müsste die Papiere ausstellen.\n\nNicht jeder wird Fremde in den Kantinen begrüßen."
 pe.211.a:0 "Die Papiere ausstellen. (100 £trade£)"
 pe.211.b:0 "Wir kommen mit unseren eigenen Leuten aus."
 pe.212.name:0 "Maschinen-Leasing"
 pe.212.a:0 "Die Maschinen leasen."
 pe.212.b:0 "Wir wollen keine fremden Maschinen auf unserem Boden."
 pe.213.name:0 "Streik!"
 pe.213.desc:0 "Die Arbeiter der Privatfirmen auf §Y[pe_pat_planet.GetName]§! haben die Arbeit niedergelegt. Zu viel Arbeit, zu wenig Hände, Löhne, die nicht mithalten. Die Firmen um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) bieten eine Lohnerhöhung aus privatem Kapital an (§Y[Root.pe_pat_spend]§! £trade£)."
 pe.213.a:0 "Die Firmen zahlen die Erhöhung."
 pe.213.b:0 "Es soll sich totlaufen."
 pe.213.c:0 "Sicherheitskräfte schicken."
 pe.214.name:0 "Ein Fund der Prospektoren"
 pe.214.desc:0 "Von §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) finanzierte Prospektoren haben auf §Y[pe_pat_planet.GetName]§! ein reiches Vorkommen entdeckt. Sie haben schon §Y[Root.pe_pat_spend]§! £trade£ ausgegeben und würden es gern selbst abbauen."
 pe.214.a:0 "Ihr Fund, ihr Abbau."
 pe.214.b:0 "Solche Vorkommen gehören dem Staat."
 pe.214.c:0 "Die Fundstelle unter Schutz stellen."
 pe.215.name:0 "Hydroponik-Startup"
 pe.215.desc:0 "Die Nahrung wird knapp. Ein Startup mit §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) im Rücken will in den Türmen von §Y[pe_pat_planet.GetName]§! vertikale Farmen bauen: Nahrung ohne Felder und ohne Bauern. Kosten für die Investoren: §Y[Root.pe_pat_spend]§! £trade£. Die Farmen lieferten zehn Jahre lang §G[Root.pe_hydro_food]§! £food£ Nahrung im Monat und bräuchten etwas Energie."
 pe.215.a:0 "Die Türme bauen."
 pe.215.b:0 "Nahrung wächst auf Feldern."
 pe.220.name:0 "Mäzen der Künste"
 pe.220.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) will nicht nur für Reichtum in Erinnerung bleiben: Museen, Theater und ein Monument in der Hauptstadt, bezahlt mit §Y[Root.pe_pat_spend]§! £trade£. Die Frage ist, ob die Kunst frei sein oder dem Staat dienen soll."
 pe.220.a:0 "Lasst die Kunst frei."
 pe.220.b:0 "Kunst soll unsere Nation feiern."
 pe.221.name:0 "Die Liga"
 pe.221.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) gründet eine interstellare Sportliga: Stadien auf mehreren Welten, Mannschaften, Übertragungen. §Y[Root.pe_pat_spend]§! £trade£ sind schon zugesagt. Der Staat könnte die Liga frei wachsen lassen oder die Übertragungsrechte versteigern."
 pe.221.a:0 "Die Spiele mögen beginnen!"
 pe.221.b:0 "Die Übertragungsrechte versteigern."
 pe.222.name:0 "Parteispenden"
 pe.222.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) bietet großzügige Spenden an „Parteien, die etwas von Wirtschaft verstehen“: §Y[Root.pe_pat_spend]§! £trade£, ganz ohne Bedingungen natürlich. Das Geld ginge an die Parteien, nicht in die Staatskasse. Der Staat entscheidet nur, wie er damit umgeht."
 pe.222.a:0 "Die Spenden annehmen."
 pe.222.b:0 "Solche Spenden verbieten."
 pe.222.c:0 "Das Angebot öffentlich machen."
 pe.223.name:0 "Private Kolonisten"
 pe.223.desc:0 "Ein Konsortium um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) will auf eigene Kosten eine Kolonie auf §Y[pe_pat_colony.GetName]§! gründen: Schiffe, Ausrüstung und §G[Root.pe_col_pops]§! Siedler, bezahlt mit §Y[Root.pe_pat_spend]§! £trade£. Die Kolonie wäre unsere."
 pe.223.a:0 "Mögen sie dort draußen gedeihen."
 pe.223.b:0 "Kolonisierung ist Sache des Staates."
 pe.224.name:0 "Eine Universität"
 pe.224.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) gründet eine Universität in der Hauptstadt und steckt §Y[Root.pe_pat_spend]§! £trade£ hinein. Offen für alle oder eine Akademie für die Besten?"
 pe.224.a:0 "Offen für alle."
 pe.224.b:0 "Eine Eliteakademie."
 pe.225.name:0 "Weltraumtourismus"
 pe.225.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat Kreuzfahrtschiffe gekauft: Reisen zu den Wundern unseres Reichs, Start auf §Y[pe_pat_planet.GetName]§!. §Y[Root.pe_pat_spend]§! £trade£ sind investiert; der Staat muss nur die Routen genehmigen."
 pe.225.a:0 "Die Routen freigeben."
 pe.225.b:0 "Keine Touristen an unserem Himmel."
 pe.226.name:0 "Katastrophenhilfe"
 pe.226.desc:0 "§Y[pe_pat_planet.GetName]§! steckt in der Krise. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) bietet sofortige Hilfe an: Vorräte, Unterkünfte, Wiederaufbau im Wert von §Y[Root.pe_pat_spend]§! £trade£. „In Zeiten wie diesen können Gewinne warten“, heißt es, und die Firmen würden zwei Jahre lang nur den halben Gewinnanteil nehmen."
 pe.226.a:0 "Die Hilfe dankbar annehmen."
 pe.226.b:0 "Der Staat regelt das selbst."
 pe.227.name:0 "Wettskandal"
 pe.227.desc:0 "Spiele der Liga waren abgesprochen, und die Spur führt ins Umfeld von §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]). Die Fans sind außer sich."
 pe.227.a:0 "Die Sache diskret regeln. (100 £trade£)"
 pe.227.b:0 "Den Skandal laufen lassen."
 pe.228.name:0 "Touristenunglück"
 pe.228.desc:0 "Ein Kreuzfahrtschiff von §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) ist einem Sternphänomen zu nahe gekommen. Nicht alle sind zurückgekehrt. Das Reich trauert."
 pe.228.a:0 "Ein schwarzer Tag."
 d_pe_hydroponics:0 "Hydroponik-Türme"
 d_pe_hydroponics_desc:0 "Private vertikale Farmen. Sie produzieren Nahrung ohne Bauern und brauchen etwas Energie."
 pe_overtime_miner:0 "Sonderschichten in den Minen"
 pe_overtime_miner_desc:0 "Mehrarbeit für bessere Löhne."
 pe_overtime_technician:0 "Sonderschichten in den Kraftwerken"
 pe_overtime_technician_desc:0 "Mehrarbeit für bessere Löhne."
 pe_overtime_farmer:0 "Sonderschichten auf den Höfen"
 pe_overtime_farmer_desc:0 "Mehrarbeit für bessere Löhne."
 pe_guest_unrest:0 "Groll gegen Gastarbeiter"
 pe_guest_unrest_desc:0 "Nicht jeder mag Fremde in den Kantinen."
 pe_leasing_miner:0 "Geleaste Bohranlagen"
 pe_leasing_miner_desc:0 "Von den Privatfirmen geleaste automatische Maschinen, samt Wartung."
 pe_leasing_technician:0 "Geleaste Kraftwerkstechnik"
 pe_leasing_technician_desc:0 "Von den Privatfirmen geleaste automatische Maschinen, samt Wartung."
 pe_leasing_farmer:0 "Geleaste Erntemaschinen"
 pe_leasing_farmer_desc:0 "Von den Privatfirmen geleaste automatische Maschinen, samt Wartung."
 pe_strike:0 "Streik"
 pe_strike_desc:0 "Die Arbeiter der Privatfirmen haben die Arbeit niedergelegt."
 pe_strike_crushed:0 "Streik niedergeschlagen"
 pe_strike_crushed_desc:0 "Sicherheitskräfte haben den Streik gebrochen. Das bleibt in Erinnerung."
 pe_strike_crushed_mild:0 "Streik beendet"
 pe_strike_crushed_mild_desc:0 "Sicherheitskräfte haben den Streik beendet."
 pe_business_upset:0 "Verstimmte Wirtschaft"
 pe_business_upset_desc:0 "Die Privatwirtschaft fühlt sich vom Staat schlecht behandelt."
 pe_art:0 "Blühende Künste"
 pe_art_desc:0 "Museen, Theater und ein neues Monument, bezahlt von einem Mäzen."
 pe_league:0 "Sportliga"
 pe_league_desc:0 "Ein Stadion der interstellaren Liga."
 pe_bet_scandal:0 "Wettskandal"
 pe_bet_scandal_desc:0 "Abgesprochene Spiele, wütende Fans."
 pe_corruption:0 "Parteispenden"
 pe_corruption_desc:0 "Privates Geld in der Politik."
 pe_university:0 "Private Universität"
 pe_university_desc:0 "Eine von einem Mäzen gegründete Universität, offen für alle."
 pe_elite_academy:0 "Eliteakademie"
 pe_elite_academy_desc:0 "Eine Akademie für die Besten. Nicht alle finden das gerecht."
 pe_tourism:0 "Weltraumtourismus"
 pe_tourism_desc:0 "Kreuzfahrtschiffe bringen Besucher und Geld."
 pe_tourism_accident:0 "Trauer"
 pe_tourism_accident_desc:0 "Das Reich trauert um die Opfer eines Touristenunglücks."
 pe_relief:0 "Katastrophenhilfe"
 pe_relief_desc:0 "Private Hilfe in der Krise."
 pe.200.desc.again:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) gibt schon wieder eine Gala über §Y[pe_pat_planet.GetName]§!, natürlich größer als die letzte. Die Rechnung: §Y[Root.pe_pat_spend]§! £trade£ aus privatem Kapital. Manche finden es prächtig, andere schamlos."
 pe.202.desc.again:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) gründet eine weitere Forschungsstiftung und steckt §Y[Root.pe_pat_spend]§! £trade£ hinein. Die Akademien haben sich fast daran gewöhnt."
 pe.221.desc.again:0 "Die Liga von §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wächst: neue Mannschaften, neue Stadien, §Y[Root.pe_pat_spend]§! £trade£ frisches Geld. Soll sie frei wachsen, oder verkauft der Staat diesmal die Übertragungsrechte?"
 pe.224.desc.again:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) gründet eine weitere Universität in der Hauptstadt und steckt §Y[Root.pe_pat_spend]§! £trade£ hinein. Offen für alle oder eine Akademie für die Besten?"
 pe.230.name:0 "Werkswohnungen"
 pe.230.desc:0 "Die Privatfirmen auf §Y[pe_pat_planet.GetName]§! können ihre Arbeiter nicht unterbringen. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) schlägt Werkswohnungen vor: Wohnblöcke direkt neben den Anlagen, gebaut mit §Y[Root.pe_pat_spend]§! £trade£ privatem Geld. §G+[Root.pe_house]§! Wohnraum auf §Y[pe_pat_planet.GetName]§!, dauerhaft."
 pe.230.a:0 "Die Wohnungen bauen."
 pe.230.b:0 "Wir wollen keine Werkssiedlungen."
 pe.231.name:0 "Roboter-Startup"
 pe.231.desc:0 "Ein Startup mit §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) im Rücken will auf §Y[pe_pat_planet.GetName]§!, wo Hände fehlen, Roboterarbeiter bauen. §Y[Root.pe_pat_spend]§! £trade£ privates Kapital, fünf Jahre Produktion."
 pe.231.a:0 "Die Fertigungsstraßen anlaufen lassen."
 pe.231.b:0 "Maschinen ersetzen keine Menschen."
 pe.232.name:0 "Landprämie"
 pe.232.desc:0 "Auf §Y[pe_pat_planet.GetName]§! wollen alle in Büros und Labore; Minen und Felder stehen leer. Die Privatfirmen um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) bieten eine Landprämie: deutlich höhere Löhne für Arbeiter in ihren Minen, Kraftwerken und Höfen, bezahlt mit §Y[Root.pe_pat_spend]§! £trade£. Fünf Jahre lang wären private Arbeiterjobs dort attraktiver als Spezialistenjobs."
 pe.232.a:0 "Die Prämie zahlen."
 pe.232.b:0 "Der Markt wird es richten."
 pe.233.name:0 "Familienförderung"
 pe.233.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) schlägt auf §Y[pe_pat_planet.GetName]§! ein Familienprogramm vor: Kinderbetreuung, Elternzeit, Familienwohnungen, finanziert mit §Y[Root.pe_pat_spend]§! £trade£. Mehr Kinder, mit der Zeit mehr Arbeiter. (Nur organische Pops wachsen schneller.)"
 pe.233.a:0 "Der Staat gibt seinen Teil dazu: zehn Jahre. (100 £trade£)"
 pe.233.b:0 "Die Firmen sollen es allein tragen: fünf Jahre."
 pe.233.c:0 "Familie ist Privatsache."
 pe.240.name:0 "Ein Abschied"
 pe.240.desc:0 "§Y[Root.GetPeMagnateOld]§! zieht sich zurück und ordnet den Nachlass. Ein Vermögen von §Y[Root.pe_fw_amt]§! £trade£ aus dem Privatkapital soll vererbt werden. Die Frage ist, an wen."
 pe.240.a:0 "An eine Forschungsstiftung, als Vermächtnis."
 pe.240.b:0 "Der Staat erhebt Erbschaftssteuer."
 pe.240.c:0 "An die Erben, die das Geschäft weiterführen."
 pe.241.name:0 "Börsengang"
 pe.241.desc:0 "Einer unserer größten Privatkonzerne geht an die Börse. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) lädt den Staat ein, Aktien zu kaufen: Jede Aktie kostet 500 £trade£ und zahlt 10 £trade£ Dividende im Monat, solange die Investoren es sich leisten können."
 pe.241.a:0 "Eine Aktie kaufen. (500 £trade£)"
 pe.241.b:0 "Drei Aktien kaufen. (1500 £trade£)"
 pe.241.c:0 "Der Staat spekuliert nicht."
 pe.242.name:0 "Staatsanleihen"
 pe.242.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) bietet dem Staat einen Kredit aus privatem Kapital an: §Y[Root.pe_pat_spend]§! £trade£ jetzt, mit 20 % Zinsen über fünf Jahre zurückzuzahlen (§Y[Root.pe_bond_new]§! £trade£ im Monat, sichtbar bei den privaten Ersparnissen)."
 pe.242.a:0 "Den Kredit annehmen."
 pe.242.b:0 "Wir machen keine Schulden."
 pe.243.name:0 "Feindliche Übernahme"
 pe.243.desc:0 "Auf §Y[pe_pat_planet.GetName]§! will ein Privatunternehmen einen Konkurrenten schlucken. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat das Geld bereit: §Y[Root.pe_pat_spend]§! £trade£. Die gekaufte Firma würde schließen, ihr Distriktplatz würde frei; die Käuferin würde stärker."
 pe.243.a:0 "Soll der Markt entscheiden."
 pe.243.b:0 "Die Übernahme untersagen."
 pe.244.name:0 "Monopol"
 pe.244.desc:0 "Zu viele unserer Privatfirmen stellen dasselbe her. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) und die anderen Eigner diktieren jetzt die Preise und wollen ein Viertel mehr Gewinnanteil."
 pe.244.a:0 "Hinnehmen: fünf Jahre höhere Gewinne."
 pe.244.b:0 "Kartellverfahren: die Investoren büßen."
 pe.244.c:0 "Das Monopol politisch zerschlagen. (50 £influence£)"
 pe.245.name:0 "Industriespionage"
 pe.245.desc:0 "Ingenieure von §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) sind an Baupläne aus §Y[pe_pat_country.GetName]§! gekommen. Niemand fragt, wie. Kommt es heraus, wird es peinlich."
 pe.245.a:0 "Die Pläne nutzen."
 pe.245.b:0 "Vernichten und die Verantwortlichen entlassen."
 pe.252.name:0 "Spionage aufgeflogen"
 pe.252.desc:0 "§Y[pe_pat_country.GetName]§! hat die Spionage aufgedeckt. Unsere Diplomaten haben alle Hände voll zu tun."
 pe.252.a:0 "Bedauerlich."
 pe.246.name:0 "Exportboom"
 pe.246.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat mit Händlern aus §Y[pe_pat_country.GetName]§! ein Handelsabkommen ausgehandelt. §Y[Root.pe_pat_spend]§! £trade£ stecken schon in Lagerhäusern und Frachtern. Der Staat muss nur die Lizenzen erteilen."
 pe.246.a:0 "Die Lizenzen erteilen."
 pe.246.b:0 "Keine Handelsabkommen mit Fremden."
 pe.247.name:0 "Umweltskandal"
 pe.247.desc:0 "Ein privates Werk auf §Y[pe_pat_planet.GetName]§! hat das Umland vergiftet. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) spricht von einem Unfall. Jemand muss die Sanierung bezahlen."
 pe.247.a:0 "Die Firmen zahlen die Sanierung."
 pe.247.b:0 "Der Staat zahlt, und zwar schnell. (150 £trade£)"
 pe.247.c:0 "Es soll bleiben, wie es ist."
 pe.248.name:0 "Börsencrash"
 pe.248.desc:0 "Die Märkte sind eingebrochen. Die Hälfte des Privatkapitals ist verdampft, die Firmen sind knapp bei Kasse, und unsere Aktien haben die Hälfte ihres Werts verloren. Ohne Hilfe droht eine Rezession."
 pe.248.a:0 "Ein Rettungspaket. (300 £trade£)"
 pe.248.b:0 "Der Markt muss sich selbst bereinigen."
 pe.249.name:0 "Börsenrally"
 pe.249.desc:0 "Die Kurse steigen und steigen: Das Privatkapital ist in wenigen Wochen um §Y[Root.pe_rally]§! £trade£ gewachsen. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) spricht von einem goldenen Zeitalter. Manche Ökonomen sprechen von einer Blase."
 pe.249.a:0 "Die Gewinne besteuern."
 pe.249.b:0 "Laufen lassen."
 pe.250.name:0 "Insiderhandel"
 pe.250.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat Aktien verkauft, Tage bevor schlechte Nachrichten öffentlich wurden. Zufall, natürlich."
 pe.250.a:0 "Anklage erheben."
 pe.250.b:0 "Auf sich beruhen lassen."
 pe.251.name:0 "Gentrifizierung"
 pe.251.desc:0 "Wohlhabende Käufer um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) kaufen auf §Y[pe_pat_planet.GetName]§! ganze Viertel auf und machen daraus elegante Quartiere, mit §Y[Root.pe_pat_spend]§! £trade£. Schönere Straßen, weniger Wohnungen für einfache Leute."
 pe.251.a:0 "Die Stadt wird schöner."
 pe.251.b:0 "Eine Mietpreisbremse einführen."
 d_pe_company_housing:0 "Werkswohnungen"
 d_pe_company_housing_desc:0 "Wohnblöcke, die die Privatfirmen für ihre Arbeiter gebaut haben."
 pe_robot_startup:0 "Roboter-Startup"
 pe_robot_startup_desc:0 "Ein privates Startup baut hier Roboterarbeiter."
 pe_rural_premium:0 "Landprämie"
 pe_rural_premium_desc:0 "Private Arbeiterjobs zahlen hier so gut, dass sie mit Spezialistenjobs mithalten."
 pe_family:0 "Familienförderung"
 pe_family_desc:0 "Kinderbetreuung, Elternzeit und Familienwohnungen."
 pe_export_boom:0 "Exportboom"
 pe_export_boom_desc:0 "Ein privates Handelsabkommen bringt Geschäft."
 pe_pollution:0 "Verschmutzung"
 pe_pollution_desc:0 "Ein privates Werk hat das Land vergiftet."
 pe_recession:0 "Rezession"
 pe_recession_desc:0 "Nach dem Börsencrash kämpft die Wirtschaft."
 pe_gentrification:0 "Gentrifizierung"
 pe_gentrification_desc:0 "Elegante Viertel, weniger Wohnungen für einfache Leute."
 pe_farewell:0 "Vermächtnis eines Mäzens"
 pe_farewell_desc:0 "Das Vermächtnis eines Magnaten bleibt in guter Erinnerung."
 pe.214.a.tt:0 "Der Planet bekommt §G[Root.pe_find_n]§! neue(s) Vorkommen (je +1 Platz für einen Bergbau-, Generator- oder Landwirtschaftsdistrikt). Sind ein Distriktplatz frei und mindestens 50 Pops ohne Arbeit, eröffnet auf einem davon sofort ein Privatunternehmen."
 pe.214.b.tt:0 "Der Planet bekommt die §G[Root.pe_find_n]§! neuen Vorkommen (je +1 Platz für einen Bergbau-, Generator- oder Landwirtschaftsdistrikt) für den Staat. Die Hälfte des Geldes der Prospektoren geht an die Investoren zurück."
 pe.243.a.tt:0 "Die kleinste Firma auf dem Planeten wird von einer mindestens gleich großen gekauft: Sie schließt, ihr Distriktplatz wird frei, und die Käuferin übernimmt ihr Kapital."
 pe.241.a.tt:0 "+1 Aktie: §G+10§! £trade£ Dividende im Monat, solange die Investoren zahlen können."
 pe.241.b.tt:0 "+3 Aktien: §G+30§! £trade£ Dividende im Monat, solange die Investoren zahlen können."
 pe.242.a.tt:0 "Rückzahlung: §R[Root.pe_bond_new]§! £trade£ im Monat, fünf Jahre lang."
 pe.244.a.tt:0 "Fünf Jahre lang nehmen die Firmen ein Viertel mehr Gewinnanteil."
 pe.244.b.tt:0 "Die Investoren verlieren ein Fünftel ihres Kapitals."
 pe.240.c.tt:0 "Das Vermögen bleibt bei den Investoren. Der Nachfolger erbt den halben Ruf."
 pe.249.b.tt:0 "Eine Blase wächst: Drei Jahre lang ist ein Crash dreimal so wahrscheinlich."
 pe.213.a.tt:0 "Die Firmen erhöhen die Löhne aus dem Investorenpool. Der Streik endet."
 pe.210.b.tt:0 "Die Arbeiter behalten ihre Arbeitszeit. Ein Streik bleibt möglich."
 d_pe_hydroponics_2:0 "Hydroponik-Türme"
 d_pe_hydroponics_2_desc:0 "Private vertikale Farmen. Sie produzieren Nahrung ohne Bauern und brauchen etwas Energie."
 d_pe_hydroponics_3:0 "Hydroponik-Türme"
 d_pe_hydroponics_3_desc:0 "Private vertikale Farmen. Sie produzieren Nahrung ohne Bauern und brauchen etwas Energie."
 pe_overtime_tired:0 "Erschöpfte Arbeiter"
 pe_overtime_tired_desc:0 "Die Sonderschichten fordern ihren Tribut."
 d_pe_company_housing_2:0 "Werkswohnungen"
 d_pe_company_housing_2_desc:0 "Wohnblöcke, die die Privatfirmen für ihre Arbeiter gebaut haben."
 d_pe_company_housing_3:0 "Werkswohnungen"
 d_pe_company_housing_3_desc:0 "Wohnblöcke, die die Privatfirmen für ihre Arbeiter gebaut haben."
 pe.215.a.tt:0 "§Y[pe_pat_planet.GetName]§! bekommt Hydroponik-Türme: zehn Jahre lang §G+[Root.pe_hydro_food]§! £food£ Nahrung im Monat, für etwas Energie."
 pe.226.a.tt:0 "Aus Dankbarkeit nehmen die Firmen zwei Jahre lang nur den halben Gewinn."
 pe.260.name:0 "Ein besonderes Angebot"
 pe.260.desc:0 "Uns fehlen [Root.GetPeDealX]. Die Leitung von [Root.GetPeDealFirm] macht ein Angebot: Sie liefert sofort §G[Root.pe_deal_xamt]§! [Root.GetPeDealX], ein Jahr Fehlmenge, und nimmt dafür §R[Root.pe_deal_yamt]§! [Root.GetPeDealY], von denen wir reichlich haben.\n\nAuf dem Markt käme uns das deutlich teurer. Die Firma verkauft unsere Waren natürlich zu ihrem eigenen Preis weiter; ihre Eigentümer rechnen mit etwa §Y[Root.pe_deal_profit]§! £trade£."
 pe.260.a:0 "Abgemacht."
 pe.260.a.tt:0 "Die Marge der Firma geht an die Investoren."
 pe.260.b:0 "Einen besseren Preis aushandeln."
 pe.260.b.tt:0 "Sie könnten nachgeben oder aufstehen und gehen."
 pe.260.c:0 "Wir kommen ohne sie zurecht."
 pe.261.name:0 "Verhandlungen"
 pe.261.desc.ok:0 "Nach einer langen Nacht geben die Manager nach: §G[Root.pe_deal_xamt]§! [Root.GetPeDealX] für nur §R[Root.pe_deal_yamt]§! [Root.GetPeDealY]. Ihre Marge schrumpft auf §Y[Root.pe_deal_profit]§! £trade£."
 pe.261.desc.no:0 "Die Manager packen ihre Unterlagen zusammen. „Wir sind ein Unternehmen, keine Wohltätigkeit.“ Das Angebot ist vom Tisch."
 pe.261.a:0 "Einverstanden."
 pe.261.b:0 "Ihr Verlust."
 pe.262.name:0 "Modernisierung"
 pe.262.desc:0 "Auf §Y[pe_pat_planet.GetName]§! finden sich keine Arbeiter mehr. Statt neuer Jobs wollen die privaten [Root.GetPeSector] um §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) §Y[Root.pe_pat_spend]§! £trade£ in bessere Maschinen, Software und Methoden stecken. Davon profitierte zehn Jahre lang jeder Arbeitsplatz der Branche auf dem Planeten, auch die staatlichen."
 pe.262.a:0 "Fortschritt ist willkommen."
 pe.262.b:0 "Wir sehen keinen Bedarf."
 pe.263.name:0 "Rationalisierung"
 pe.263.desc:0 "Die privaten [Root.GetPeRatSector] auf §Y[pe_pat_planet.GetName]§! können §Y[Root.pe_rat_free]§! Stellen nicht besetzen. Berater im Auftrag von §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) schlagen vor, §Y[Root.pe_rat_jobs]§! davon dauerhaft zu streichen und den Rest neu zu organisieren: weniger Schreibtische, mehr Ertrag pro Kopf, für die ganze Branche auf dem Planeten. Die Investoren zahlen dafür §Y[Root.pe_pat_spend]§! £trade£."
 pe.263.a:0 "Schlanker und besser."
 pe.263.b:0 "Arbeit ist Arbeit."
 pe.264.name:0 "Eine Vermögensabgabe?"
 pe.264.desc:0 "Die privaten Investoren sitzen auf §Y[Root.pe_capital]§! £trade£, weit mehr, als unsere Firmen sinnvoll einsetzen können. Das Finanzministerium schlägt eine einmalige Abgabe auf große Vermögen vor. Die Wirtschaft ist alarmiert; andere fragen, warum überhaupt so viel Geld brachliegt."
 pe.264.a:0 "Eine maßvolle Abgabe. (§G[Root.pe_levy_lo]§! £trade£)"
 pe.264.b:0 "Eine kräftige Abgabe. (§G[Root.pe_levy_hi]§! £trade£)"
 pe.264.c:0 "Privatvermögen ist unantastbar."
 pe.265.name:0 "Investitionen im Ausland"
 pe.265.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) will §Y[Root.pe_pat_spend]§! £trade£ privates Kapital in §Y[pe_pat_country.GetName]§! anlegen: Werften, Minen, eine Beteiligung an ihren Handelshäusern. Das Geld verließe unsere Wirtschaft, aber die Erträge kämen jahrelang zurück, und §Y[pe_pat_country.GetName]§! würde es begrüßen."
 pe.265.a:0 "Lasst das Geld im Ausland arbeiten."
 pe.265.a.tt:0 "Zehn Jahre lang: §G+[Root.pe_abroad_new_state]§! £trade£ im Monat für uns als Steuer auf die Erträge (Haushaltsposten „Dividenden“); die Investoren bekommen §G[Root.pe_abroad_new_pool]§! £trade£ im Monat."
 pe.265.b:0 "Unser Kapital bleibt im Land."
 pe.266.name:0 "Eine ausländische Filiale"
 pe.266.desc:0 "Ein Konzern aus §Y[pe_pat_country.GetName]§! will auf §Y[pe_pat_planet.GetName]§! eine Filiale eröffnen: Büros, ein Showroom, ein paar hundert gut bezahlte Stellen für Einheimische, alles auf eigene Kosten. Unsere eigenen Firmen sind von der Konkurrenz weniger begeistert."
 pe.266.a:0 "Willkommen."
 pe.266.a.tt:0 "Unsere Firmen verlieren Kunden: Die Investoren verlieren ein Zwanzigstel ihres Kapitals."
 pe.266.b:0 "Nur gegen eine Lizenzgebühr."
 pe.266.c:0 "Unser Markt gehört unseren Firmen."
 pe.266.c.tt:0 "Unsere Wirtschaft ist dankbar."
 pe.267.name:0 "Eine Technologielizenz"
 pe.267.desc:0 "Ein Konzern aus §Y[pe_pat_country.GetName]§! bietet uns eine Lizenz für seine Patente in [Root.GetPeLicField] an, für §Y[Root.pe_lic_cost]§! £trade£. Entweder kauft der Staat sie und öffnet die Patente allen unseren Wissenschaftlern, oder unsere Privatfirmen kaufen sie für ihre eigenen Labore."
 pe.267.a:0 "Der Staat kauft die Lizenz."
 pe.267.b:0 "Sollen unsere Firmen sie kaufen."
 pe.267.c:0 "Wir forschen selbst."
 pe.268.name:0 "Dumping"
 pe.268.desc:0 "Firmen aus §Y[pe_pat_country.GetName]§! überschwemmen unseren Markt mit billigen [Root.GetPeDumpGood], weit unter den Kosten. Unsere eigenen Hersteller kommen nicht mit und verlangen Schutz. Zölle würden uns politisches Kapital kosten, und §Y[pe_pat_country.GetName]§! nähme sie nicht leicht."
 pe.268.a:0 "Billige Waren sind gute Waren."
 pe.268.a.tt:0 "Unsere Privatfirmen, die sie herstellen, verlieren ein Viertel ihres Kapitals."
 pe.268.b:0 "Schutzzölle erheben. (§Y[Root.pe_tariff]§! £influence£)"
 pe_foreign_branch:0 "Ausländische Filiale"
 pe_foreign_branch_desc:0 "Büros eines ausländischen Konzerns: gute Stellen, neue Kunden."
