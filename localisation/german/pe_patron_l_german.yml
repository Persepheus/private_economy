 pe_mag_rep_high:0 "angesehen"
 pe_mag_rep_mixed:0 "umstritten"
 pe_mag_rep_low:0 "berüchtigt"
 pe.200.name:0 "Die Gala des Jahrhunderts"
 pe.200.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), eine der reichsten Persönlichkeiten des Reichs, hat den großen Orbitalballsaal über §Y[pe_pat_planet.GetName]§! gemietet. Drei Nächte lang wird die Elite aus Wirtschaft, Kunst und Politik tanzen, speisen und vor allem gesehen werden.\n\nDie Rechnung: §Y[Root.pe_pat_spend]§! £trade£ aus privatem Kapital. Die Nachrichtenkanäle streiten schon, ob das ein Fest unseres Wohlstands ist oder ein Hohn für alle, die morgen arbeiten müssen."
 pe.200.a:0 "Lasst sie feiern. Wohlstand darf man zeigen."
 pe.200.b:0 "Die Dekadenz öffentlich anprangern."
 pe.200.c:0 "Eine Luxussteuer auf solche Feste scheint nur gerecht."
 pe.201.name:0 "Skandal um die Gala"
 pe.201.desc:0 "Monate nach der Gala tauchen Aufnahmen auf: hohe Beamte, großzügige „Geschenke“ und ein Auftrag für das Verkehrsnetz der Hauptstadt. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) bestreitet alles, aber die Öffentlichkeit will Antworten."
 pe.201.a:0 "Die Sache diskret aus der Welt schaffen. (150 £trade£)"
 pe.201.b:0 "Die Ermittler ihre Arbeit machen lassen."
 pe.202.name:0 "Eine Stiftung für die Wissenschaft"
 pe.202.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) hat die größte private Forschungsstiftung unserer Geschichte angekündigt und steckt §Y[Root.pe_pat_spend]§! £trade£ hinein. Labore, Stipendien, Preise für kühne Ideen: Die Wissenschaft jubelt.\n\nBleibt nur die Frage, wer bestimmt, was erforscht wird."
 pe.202.a:0 "Freie Forschung: Die Stiftung folgt ihrer eigenen Neugier."
 pe.202.b:0 "Leitlinien: Physik."
 pe.202.c:0 "Leitlinien: Gesellschaft."
 pe.202.d:0 "Leitlinien: Ingenieurwesen."
 pe.203.name:0 "Der Prototyp"
 pe.203.desc:0 "In einem Hangar auf §Y[pe_pat_planet.GetName]§! haben Ingenieure im Auftrag von §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) etwas gebaut, das niemand bestellt hat: einen Prototyp, der die staatlichen Labore alt aussehen lassen soll, wenn er funktioniert. §Y[Root.pe_pat_spend]§! £trade£ privates Kapital stehen auf dem Spiel.\n\nDer Test ist angesetzt. Unsere Sicherheitsinspektoren sind nervös."
 pe.203.a:0 "Ihr Geld, ihr Risiko."
 pe.203.b:0 "Mit staatlichen Ingenieuren und Material absichern. (250 £alloys£)"
 pe.206.name:0 "Der Prototyp-Test"
 pe.206.desc.success:0 "Der Test war ein voller Erfolg. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wird als Visionär gefeiert, und unsere Ingenieure studieren die Ergebnisse mit kaum verhohlenem Neid."
 pe.206.desc.partial:0 "Der Prototyp hat funktioniert, mehr oder weniger. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) spricht von „wertvollen Erkenntnissen“; einige davon finden unsere Ingenieure tatsächlich brauchbar."
 pe.206.desc.failure:0 "Ein Blitz, eine Druckwelle, dann Stille. Der Hangar ist verschwunden, und das Viertel drumherum braucht Monate, um sich zu erholen. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) spricht von einem „bedauerlichen Rückschlag“."
 pe.206.a:0 "So ist das mit dem Fortschritt."
 pe.204.name:0 "Eine helfende Hand"
 pe.204.desc:0 "§Y[pe_pat_planet.GetName]§! kämpft: zu wenig Wohnraum, zu wenig Orte zum Durchatmen. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) bietet Hilfe mit §Y[Root.pe_pat_spend]§! £trade£ privatem Geld an: Notunterkünfte, Parks, Gemeindezentren.\n\nManche nennen es Großzügigkeit. Andere sagen, hier kauft sich jemand die Herzen des Volkes."
 pe.204.a:0 "Die Hilfe dankend annehmen."
 pe.204.b:0 "Der Staat kümmert sich selbst um seine Bürger."
 pe.205.name:0 "Anwerbekampagne"
 pe.205.desc:0 "Die Privatfirmen auf §Y[pe_pat_planet.GetName]§! finden nicht genug Arbeitskräfte. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) schlägt eine Kampagne im ganzen Reich vor: Plakate, Umzugsprämien, das Versprechen eines besseren Lebens auf §Y[pe_pat_planet.GetName]§!.\n\nSie wird freie Bürger von anderen Welten anziehen. Mit staatlicher Unterstützung deutlich mehr."
 pe.205.a:0 "Der Staat finanziert die Kampagne mit. (150 £trade£)"
 pe.205.b:0 "Die Firmen sollen sie allein durchführen."
 pe.205.c:0 "Wir lassen uns die Bürger nicht abwerben."
 pe_gala:0 "Nachglanz der Gala"
 pe_gala_desc:0 "Der ganze Planet spricht noch von der Gala."
 pe_gala_scandal:0 "Gala-Skandal"
 pe_gala_scandal_desc:0 "Die Ermittlungen um die Gala halten den Planeten in Atem."
 pe_prototype_accident:0 "Prototyp-Unfall"
 pe_prototype_accident_desc:0 "Hier ist ein privater Prototyp explodiert."
 pe_charity:0 "Private Wohltätigkeit"
 pe_charity_desc:0 "Notunterkünfte und Gemeindezentren, bezahlt von einem privaten Mäzen."
 pe_charity_mistrust:0 "Misstrauen gegen den Mäzen"
 pe_charity_mistrust_desc:0 "Wer steckt hinter dieser Wohltat, und was wird dafür erwartet?"
 pe_recruit_strong:0 "Anwerbekampagne"
 pe_recruit_strong_desc:0 "Staat und Firmen werben Arbeitskräfte von anderen Welten an."
 pe_recruit_weak:0 "Private Anwerbung"
 pe_recruit_weak_desc:0 "Die Privatfirmen hier werben Arbeitskräfte von anderen Welten an."
 pe_recruit_refused:0 "Anwerbung verboten"
 pe_recruit_refused_desc:0 "Die Firmen nehmen es übel, dass der Staat ihre Anwerbung verboten hat."
