 pe.110.name:0 "A Buyout Offer"
 pe.110.desc.1:0 "Investors want to turn one of the state's city districts on §Y[pe_offer_planet.GetName]§! into a §Y$d_pe_firm_steelworks$§!. They offer §G500§! £minerals£ and §G100§! £trade£.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.2:0 "Investors want to turn one of the state's city districts on §Y[pe_offer_planet.GetName]§! into a §Y$d_pe_firm_factory$§!. They offer §G500§! £minerals£ and §G100§! £trade£.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.3:0 "Investors want to turn one of the state's city districts on §Y[pe_offer_planet.GetName]§! into a §Y$d_pe_firm_trading_house$§!. They offer §G500§! £minerals£ and §G100§! £trade£.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.4:0 "Investors want to turn one of the state's mining districts on §Y[pe_offer_planet.GetName]§! into a §Y$d_pe_firm_mine$§!. They offer §G300§! £minerals£ and §G60§! £trade£.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.5:0 "Investors want to turn one of the state's generator districts on §Y[pe_offer_planet.GetName]§! into a §Y$d_pe_firm_power_plant$§!. They offer §G300§! £minerals£ and §G60§! £trade£.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.6:0 "Investors want to turn one of the state's farming districts on §Y[pe_offer_planet.GetName]§! into a §Y$d_pe_firm_farm$§!. They offer §G300§! £minerals£ and §G60§! £trade£.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.7:0 "Investors want to turn one of the state's city districts on §Y[pe_offer_planet.GetName]§! into a §Y$d_pe_firm_conglomerate$§!. They offer §G500§! £minerals£ and §G100§! £trade£.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.a:0 "Sell the district."
 pe.110.b:0 "The district stays in state hands."
 pe.6.name:0 "Private Economy: Diagnosis"
 pe.6.desc:0 "Private share: §Y[Root.pe_private_share]%§!\n\n§HScores§! (above 25 beats the conglomerate)\nAlloys: [Root.pe_score_alloys]\nConsumer goods: [Root.pe_score_consumer_goods]\nTrade: [Root.pe_score_trade]\nMinerals: [Root.pe_score_minerals]\nEnergy: [Root.pe_score_energy]\nFood: [Root.pe_score_food]\n\n§HCapital§!\nDistricts: [Root.pe_diag_districts]\nFree slots: [Root.pe_diag_free]\nFirms: [Root.pe_diag_firms]\nAllowed firms: [Root.pe_diag_target]\nBest sector: [Root.pe_best_sector] (1 alloys, 2 consumer goods, 3 trade, 4 minerals, 5 energy, 6 food, 7 conglomerate, 0 none)"
 pe.6.a:0 "Understood."
