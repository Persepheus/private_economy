l_english:
 policy_pe_economic_order:0 "Economic Order"
 policy_pe_economic_order_desc:0 "How much of our economy do we leave to private enterprise? The freer the market, the more district slots private firms run as they see fit."
 pe_order_planned:0 "Command Economy"
 pe_order_planned_name:0 "$pe_order_planned$"
 pe_order_planned_desc:0 "The state plans and runs the entire economy. No private firms."
 pe_order_guided:0 "Guided Economy"
 pe_order_guided_name:0 "$pe_order_guided$"
 pe_order_guided_desc:0 "The state steers; private firms may run up to §Y20%§! of the district slots."
 pe_order_mixed:0 "Mixed Economy"
 pe_order_mixed_name:0 "$pe_order_mixed$"
 pe_order_mixed_desc:0 "State and market share the economy. Private firms may run up to §Y40%§! of the district slots."
 pe_order_free_market:0 "Free Market"
 pe_order_free_market_name:0 "$pe_order_free_market$"
 pe_order_free_market_desc:0 "The market decides. Private firms may run up to §Y60%§! of the district slots."
 pe_order_laissez_faire:0 "Laissez-faire"
 pe_order_laissez_faire_name:0 "$pe_order_laissez_faire$"
 pe_order_laissez_faire_desc:0 "The state stays out. Private firms may run up to §Y80%§! of the district slots."
 pe_deposit_cat_firms:0 "Private Firms"
 job_pe_private_metallurgist:0 "Private Metallurgist"
 job_pe_private_metallurgist_plural:0 "Private Metallurgists"
 job_pe_private_metallurgist_desc:0 "Metallurgists employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_metallurgist_add:0 "[pe_private_metallurgist.GetName] Jobs"
 job_pe_private_artisan:0 "Private Artisan"
 job_pe_private_artisan_plural:0 "Private Artisans"
 job_pe_private_artisan_desc:0 "Artisans employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_artisan_add:0 "[pe_private_artisan.GetName] Jobs"
 job_pe_private_trader:0 "Private Trader"
 job_pe_private_trader_plural:0 "Private Traders"
 job_pe_private_trader_desc:0 "Traders employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_trader_add:0 "[pe_private_trader.GetName] Jobs"
 pe_building_private_exchange:0 "Private Exchange"
 pe_building_private_exchange_desc:0 "An exchange run by private firms. The state can neither demolish nor disable it; its traders work on their own account."
 job_pe_private_miner:0 "Private Miner"
 job_pe_private_miner_plural:0 "Private Miners"
 job_pe_private_miner_desc:0 "Miners employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_miner_add:0 "[pe_private_miner.GetName] Jobs"
 job_pe_private_technician:0 "Private Technician"
 job_pe_private_technician_plural:0 "Private Technicians"
 job_pe_private_technician_desc:0 "Technicians employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_technician_add:0 "[pe_private_technician.GetName] Jobs"
 job_pe_private_farmer:0 "Private Farmer"
 job_pe_private_farmer_plural:0 "Private Farmers"
 job_pe_private_farmer_desc:0 "Farmers employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_farmer_add:0 "[pe_private_farmer.GetName] Jobs"
 pe_private_economy_title:0 "Private Economy"
 pe_buyout_refused:0 "Buyout Refused"
 pe_buyout_refused_desc:0 "The government blocked a private investment here. Business circles are unhappy."
 pe.110.name:0 "A Buyout Offer"
 pe.110.a:0 "Sell the district."
 pe.110.b:0 "The district stays in state hands."
 pe.6.name:0 "Private Economy: Diagnosis"
 pe.6.a:0 "Understood."
 pe.110.desc.urban:0 "Investors want to buy one of the state's city districts on §Y[pe_offer_planet.GetName]§! and turn it into a §Y[Root.GetPeOfferFirm]§!. They offer §G500§! £minerals£ and §G100§! £trade£ from the private capital.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.rural:0 "Investors want to buy one of the state's [Root.GetPeOfferDistrict]s on §Y[pe_offer_planet.GetName]§! and turn it into a §Y[Root.GetPeOfferFirm]§!. They offer §G300§! £minerals£ and §G60§! £trade£ from the private capital.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.6.desc:0 "Private share: §Y[Root.pe_private_share]%§!, profit share: §Y[Root.pe_profit_pct]%§!\nInvestor pool: §Y[Root.pe_capital]§! £trade£ (+[Root.pe_pool_income] last quarter, [Root.pe_savings_last] of it private savings)\n\n§HShadow prices§! (£trade£ per unit)\nAlloys: [Root.pe_s_alloys]\nConsumer goods: [Root.pe_s_consumer_goods]\nMinerals: [Root.pe_s_minerals]\nEnergy: [Root.pe_s_energy]\nFood: [Root.pe_s_food]\nTrade: [Root.pe_s_trade]\nUnity: [Root.pe_s_unity], research: [Root.pe_s_physics_research]\nEmergency (resource runs out within a year): [Root.pe_emergency]\n\n§HValue added per job§! (£trade£ per month)\nMetallurgist: [Root.pe_vaj_pe_private_metallurgist]\nArtisan: [Root.pe_vaj_pe_private_artisan]\nTrader: [Root.pe_vaj_pe_private_trader]\nMiner: [Root.pe_vaj_pe_private_miner]\nTechnician: [Root.pe_vaj_pe_private_technician]\nFarmer: [Root.pe_vaj_pe_private_farmer]\nEntertainer: [Root.pe_vaj_pe_private_entertainer] (+[Root.pe_ent_val] on the capital)\nPhysicist: [Root.pe_vaj_pe_private_physicist]\n\n§HCapital planet§!\nDistricts: [Root.pe_diag_districts], free slots: [Root.pe_diag_free]\nFirms: [Root.pe_diag_firms] of [Root.pe_diag_target] allowed\nPrivate jobs filled: [Root.pe_fill_cur]\nBest new firm: §Y[Root.GetPeBestFirm]§! (value [Root.pe_best])"
