l_english:
 policy_pe_economic_order:0 "Economic Order"
 policy_pe_economic_order_desc:0 "How much of our economy do we leave to private enterprise? Private firms take over district slots, run their own jobs (which we cannot prioritise) and decide for themselves what to produce, guided by prices and needs. In return the state pays them a share of their value added in trade, and part of the trade income flows into private savings, the capital the investors build new firms with."
 pe_order_planned:0 "Command Economy"
 pe_order_planned_name:0 "$pe_order_planned$"
 pe_order_planned_desc:0 "The state plans and runs the entire economy. There are no private firms, no investors and no profits to pay."
 pe_order_guided:0 "Guided Economy"
 pe_order_guided_name:0 "$pe_order_guided$"
 pe_order_guided_desc:0 "The state steers, private firms fill the gaps: they may run up to §Y20%§! of the district slots. They earn little, and the state can close them for influence without compensation."
 pe_order_mixed:0 "Mixed Economy"
 pe_order_mixed_name:0 "$pe_order_mixed$"
 pe_order_mixed_desc:0 "State and market share the economy: private firms may run up to §Y40%§! of the district slots. The state can still close firms for influence, but has to compensate the owners."
 pe_order_free_market:0 "Free Market"
 pe_order_free_market_name:0 "$pe_order_free_market$"
 pe_order_free_market_desc:0 "The market decides: private firms may run up to §Y60%§! of the district slots. Investors may offer to buy state districts."
 pe_order_laissez_faire:0 "Laissez-faire"
 pe_order_laissez_faire_name:0 "$pe_order_laissez_faire$"
 pe_order_laissez_faire_desc:0 "The state stays out of the way: private firms may run up to §Y80%§! of the district slots and buy state districts without asking. Their profits are high."
 pe_deposit_cat_firms:0 "Private Firms"
 job_pe_private_metallurgist:0 "Private Metallurgist"
 job_pe_private_metallurgist_plural:0 "Private Metallurgists"
 job_pe_private_metallurgist_desc:0 "Metallurgists employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_metallurgist_add:0 "[pe_private_metallurgist.GetName] Jobs"
 job_pe_private_artisan:0 "Private Artisan"
 job_pe_private_artisan_plural:0 "Private Artisans"
 job_pe_private_artisan_desc:0 "Artisans employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_artisan_add:0 "[pe_private_artisan.GetName] Jobs"
 job_pe_private_trader:0 "Private Trader"
 job_pe_private_trader_plural:0 "Private Traders"
 job_pe_private_trader_desc:0 "Traders employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_trader_add:0 "[pe_private_trader.GetName] Jobs"
 pe_building_private_exchange:0 "Private Exchange"
 pe_building_private_exchange_desc:0 "An exchange run by private firms. The state can neither demolish nor disable it; its traders work on their own account."
 job_pe_private_miner:0 "Private Miner"
 job_pe_private_miner_plural:0 "Private Miners"
 job_pe_private_miner_desc:0 "Miners employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_miner_add:0 "[pe_private_miner.GetName] Jobs"
 job_pe_private_technician:0 "Private Technician"
 job_pe_private_technician_plural:0 "Private Technicians"
 job_pe_private_technician_desc:0 "Technicians employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_technician_add:0 "[pe_private_technician.GetName] Jobs"
 job_pe_private_farmer:0 "Private Farmer"
 job_pe_private_farmer_plural:0 "Private Farmers"
 job_pe_private_farmer_desc:0 "Farmers employed by a private company. Somewhat more productive than in state service, but not directed by the state."
 mod_job_pe_private_farmer_add:0 "[pe_private_farmer.GetName] Jobs"
 pe_private_economy_title:0 "Private Economy"
 pe_buyout_refused:0 "Buyout Refused"
 pe_buyout_refused_desc:0 "The government blocked a private investment here. Business circles are unhappy."
 pe.110.name:0 "A Buyout Offer"
 pe.110.a:0 "Sell the district."
 pe.110.b:0 "The district stays in state hands."
 pe.6.name:0 "Private Economy: Diagnosis"
 pe.6.a:0 "Understood."
 pe.110.desc.urban:0 "Investors want to buy one of the state's city districts on §Y[pe_offer_planet.GetName]§! and turn it into a §Y[Root.GetPeOfferFirm]§!. They offer §G750§! £minerals£ and §G150§! £trade£ from the private capital.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.rural:0 "Investors want to buy one of the state's [Root.GetPeOfferDistrict]s on §Y[pe_offer_planet.GetName]§! and turn it into a §Y[Root.GetPeOfferFirm]§!. They offer §G450§! £minerals£ and §G90§! £trade£ from the private capital.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.6.desc:0 "Private share: §Y[Root.pe_private_share]%§!, profit share: §Y[Root.pe_profit_pct]%§!\nInvestor pool: §Y[Root.pe_capital]§! £trade£ (+[Root.pe_pool_income] last quarter, [Root.pe_savings_last] of it private savings)\nYou pay per month: §Y[Root.pe_profit_month]§! £trade£ profits, §Y[Root.pe_sav_month]§! £trade£ savings (budget lines "Private Firms' Profits" and "Private Savings")\n\n§HShadow prices§! (£trade£ per unit)\nAlloys: [Root.pe_s_alloys]\nConsumer goods: [Root.pe_s_consumer_goods]\nMinerals: [Root.pe_s_minerals]\nEnergy: [Root.pe_s_energy]\nFood: [Root.pe_s_food]\nTrade: [Root.pe_s_trade]\nUnity: [Root.pe_s_unity], research: [Root.pe_s_physics_research]\nEmergency (resource runs out within a year): [Root.pe_emergency]\n\n§HInvestment mix§! (share / target / value factor)\nAlloys: [Root.pe_tri_pct_a]% / [Root.pe_tgt_a]% / ×[Root.pe_tri_f_a]\nResearch: [Root.pe_tri_pct_r]% / [Root.pe_tgt_r]% / ×[Root.pe_tri_f_r]\nUnity: [Root.pe_tri_pct_u]% / [Root.pe_tgt_u]% / ×[Root.pe_tri_f_u]\n\n§HValue added per job§! (£trade£ per month)\nMetallurgist: [Root.pe_vaj_pe_private_metallurgist]\nArtisan: [Root.pe_vaj_pe_private_artisan]\nTrader: [Root.pe_vaj_pe_private_trader]\nMiner: [Root.pe_vaj_pe_private_miner]\nTechnician: [Root.pe_vaj_pe_private_technician]\nFarmer: [Root.pe_vaj_pe_private_farmer]\nEntertainer: [Root.pe_vaj_pe_private_entertainer] (+[Root.pe_ent_val] on the capital)\nPhysicist: [Root.pe_vaj_pe_private_physicist]\n\n§HCapital planet§!\nDistricts: [Root.pe_diag_districts], free slots: [Root.pe_diag_free]\nFirms: [Root.pe_diag_firms] of [Root.pe_diag_target] allowed\nPrivate jobs filled: [Root.pe_fill_cur]\nBest new firm: §Y[Root.GetPeBestFirm]§! (value [Root.pe_best])"
 pe_clear_mixed_tt:0 "The investors get the trade as compensation. The planet resents the expropriation, and no new private firm opens here for five years."
 pe_clear_guided_tt:0 "The investors lose the firm without compensation. No new private firm opens here for five years."
 pe_expropriation:0 "Expropriation"
 pe_expropriation_desc:0 "The state has cleared a private firm here. Business people and workers alike are uneasy."
 pe_order_planned_tt:0 "§HNo private economy§!\nAll private firms become state districts of their type at once, construction sites of new firms are given up. The investors lose everything: their capital, our shares and our bonds are gone."
 pe_order_guided_tt:0 "§HPrivate firms:§! up to §Y20%§! of the district slots\n§HProfit share:§! §Y7.5%§! of their value added, paid in £trade£ trade\n§HPrivate savings:§! §Y5%§! of the trade income\n§HClearing firms:§! for £influence£ influence, without compensation"
 pe_order_mixed_tt:0 "§HPrivate firms:§! up to §Y40%§! of the district slots\n§HProfit share:§! §Y10%§! of their value added, paid in £trade£ trade\n§HPrivate savings:§! §Y10%§! of the trade income\n§HClearing firms:§! for more £influence£ influence plus £trade£ trade as compensation; the planet resents it"
 pe_order_free_market_tt:0 "§HPrivate firms:§! up to §Y60%§! of the district slots\n§HProfit share:§! §Y12.5%§! of their value added, paid in £trade£ trade\n§HPrivate savings:§! §Y15%§! of the trade income\n§HBuyouts:§! investors offer to buy state districts; refusing upsets them"
 pe_order_laissez_faire_tt:0 "§HPrivate firms:§! up to §Y80%§! of the district slots\n§HProfit share:§! §Y17.5%§! of their value added, paid in £trade£ trade\n§HPrivate savings:§! §Y20%§! of the trade income\n§HBuyouts:§! investors buy state districts without asking"
 pe_holdings_name:0 "Private Holdings"
 pe_proto_fleet_name:0 "Leased Security Fleet"
 pe.19.name:0 "Private Holdings (prototype)"
 pe.19.desc:0 "§HStock§!\nMinerals: [Root.pe_ph_min] (+[Root.pe_ph_min_inc] a month)\nEnergy: [Root.pe_ph_en] (+[Root.pe_ph_en_inc] a month)\nAlloys: [Root.pe_ph_al]\n\n§HOwned§!\nOrbital stations: [Root.pe_ph_st]\nMegastructures: [Root.pe_ph_ms]\nLeased fleets (owned by them): [Root.pe_ph_fl]\nLeased fleets (controlled by us): [Root.pe_ph_ctl]"
 pe.19.a:0 "Close."
 pe.20.name:0 "Private Holdings: Sale"
 pe.20.desc:0 "The holdings sold us §G[Root.pe_ph_min]§! £minerals£ minerals and §G[Root.pe_ph_en]§! £energy£ energy for §Y[Root.pe_ph_pay]§! £trade£ (half the base price). The trade went to the investor pool. Our stock: minerals [Root.pe_ph_min0] → [Root.pe_ph_min1], energy [Root.pe_ph_en0] → [Root.pe_ph_en1]."
 pe.20.a:0 "Close."
 pe_leased_fleet:0 "Leased from the Private Holdings"
 pe_leased_fleet_desc:0 "The holdings pay this fleet's upkeep; it takes no naval capacity."
 pe_msg_supply_m:0 "Supply contract: a private mine on $FROM$ now supplies a firm on $PLANET$ with minerals. Both sectors produce more."
 pe_msg_supply_c:0 "Supply contract: a private factory on $FROM$ now supplies a firm on $PLANET$ with consumer goods. Both sectors produce more."
 pe_msg_supply_f:0 "Supply contract: a private farm on $FROM$ now supplies a firm on $PLANET$ with food. Both sectors produce more."
 pe_msg_supply_broken:0 "A supply contract of a firm on $PLANET$ has ended: its supplier is gone. The firm looks for a new one in a year."
 pe.25.name:0 "Arc Furnace of the Holdings (Prototype)"
 pe.25.desc:0 "§HFurnace§! at [pe_paf_p.GetName]\nStage: [Root.pe_paf_stage] (upgrading: [Root.pe_paf_upg])\nOverclock: [Root.pe_paf_oc] (0 none, 1 minerals, 2 balanced, 3 alloys, 4 consumer goods)\nPlanets in the system with a furnace deposit: [Root.pe_paf_dep]\n\n§HStations in the system§!\nOurs: [Root.pe_paf_our] (on a furnace deposit: [Root.pe_paf_ourdep])\nHoldings: [Root.pe_paf_hst]\nOthers: [Root.pe_paf_oth]\n\n§HPrivate Holdings§! (stock, per month, since pe.22)\nMinerals: [Root.pe_paf_min] ([Root.pe_paf_min_inc]; [Root.pe_paf_min_d])\nAlloys: [Root.pe_paf_al] ([Root.pe_paf_al_inc]; [Root.pe_paf_al_d])\nEnergy: [Root.pe_paf_en] ([Root.pe_paf_en_inc]; [Root.pe_paf_en_d])\nConsumer goods: [Root.pe_paf_cg] ([Root.pe_paf_cg_inc]; [Root.pe_paf_cg_d])\n\n§HOur income§!\nMinerals: [Root.pe_paf_our_min], alloys: [Root.pe_paf_our_al]"
 pe.25.a:0 "Close."
 pe_warzone:0 "War Zone"
 pe_warzone_desc:0 "This planet was bombarded recently. Investors stay away: no new private firms, no buyouts, no restructuring here for now."
 pe_dbg_invaders_name:0 "Invaders (Debug)"
 pe.110.desc.urban_hab:0 "Investors want to buy one of the state's districts on the habitat §Y[pe_offer_planet.GetName]§! and turn it into a §Y[Root.GetPeOfferFirm]§!. They offer §G225§! £alloys£ and §G150§! £trade£ from the private capital.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe.110.desc.rural_hab:0 "Investors want to buy one of the state's districts on the habitat §Y[pe_offer_planet.GetName]§! and turn it into a §Y[Root.GetPeOfferFirm]§!. They offer §G225§! £alloys£ and §G90§! £trade£ from the private capital.\n\nUnder the Free Market, refusing them will not go down well with the business community."
 pe_proto_sprawl_districts:0 "Sprawl Test: Districts"
 pe_proto_sprawl_districts_desc:0 "Prototype: no empire size from this planet's districts."
 pe_proto_sprawl_pops:0 "Sprawl Test: Pops"
 pe_proto_sprawl_pops_desc:0 "Prototype: no empire size from this planet's pops?"
 pe_proto_sprawl_colonies:0 "Sprawl Test: Colony"
 pe_proto_sprawl_colonies_desc:0 "Prototype: no empire size for this colony?"
 pe_proto_sprawl_total:0 "Sprawl Test: All"
 pe_proto_sprawl_total_desc:0 "Prototype: no empire size at all from this planet?"
 pe_sprawl_firms:0 "Private Firms (District Slots)"
 pe_sprawl_firms_desc:0 "Private firms hold district slots and count like districts."
 pe_sprawl_corp_hab:0 "Corporate Habitats"
 pe_sprawl_corp_hab_desc:0 "Habitats run by corporations do not count as colonies of ours."
 pe.300.name:0 "A Corporate Habitat"
 pe.300.desc:0 "§Y[Root.GetPeCorpName300]§! wants to build a habitat of its own at §Y[pe_chab_planet.GetName]§! in the §Y[pe_chab_sys.GetName]§! system. It pays the alloys from its own cash; from us it needs our approval and §Y[Root.pe_chab_inf]§! £influence£ influence.\n\nOnce built, the corporation settles it with our people. It stays our colony, but the corporation runs it: it sets the designation, every firm there is its own, it pays for founding, growth and automation there (25% cheaper) and moves its headquarters there. We cannot nationalise or clear anything there. In return the habitat costs us no empire size for the colony, its districts and firms (only for its pops). A Command Economy ends these rights too."
 pe.300.a:0 "Approved."
 pe.300.a.tt:0 "The corporation pays 6000 £trade£ from its cash, we pay §Y[Root.pe_chab_inf]§! £influence£. Build time like a habitat (five years, at our megastructure build speed), then the corporation colonizes it (colony ship from its cash)."
 pe.300.b:0 "Habitats are the business of the state."
 pe_msg_chab_start:0 "§Y$CORP$§! is building a corporate habitat at $PLANET$."
 pe_msg_chab_done:0 "The corporate habitat of §Y$CORP$§! is done: $PLANET$. The corporation is settling it now."
 pe_msg_chab_orphan:0 "The habitat $PLANET$ is done, but its corporation is gone. It is ours to colonize."
 pe_msg_chab_end:0 "The corporate habitat $PLANET$ has lost its corporate rights: it stays our colony, its firms are independent now."
 pe_msg_chab_hq:0 "§Y$CORP$§! has moved its headquarters to its corporate habitat $PLANET$."
 pe_chab_reg_line:0 "§HCorporate Habitat§! of §Y[Root.GetPeChabRegName]§!: the corporation sets the designation, owns every firm and pays all costs here (25% cheaper); no nationalisation, no clearing.\n\n"
 pe_sprawl_corp_hab_d:0 "Corporate Habitats (Districts)"
 pe_sprawl_corp_hab_d_desc:0 "The districts of habitats run by corporations do not count towards our empire size."
 pe_hold_mega_speed:0 "Megastructure Build Speed of the Empire"
 pe_hold_mega_speed_desc:0 "The Private Holdings build megastructures for their corporations as fast as their empire."
 pe_corp_habitat_site:0 "Corporate Habitat Site"
 pe_corp_habitat_site_DESC:0 "Our Private Holdings are building a habitat here for one of our corporations."
 pe_corp_habitat_site_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_habitat_complex:0 "Corporate Habitat Central Complex"
 pe_corp_habitat_complex_DESC:0 "Our Private Holdings are building a habitat here for one of our corporations. When it is done, the corporation settles it with our people."
 pe_corp_habitat_complex_MEGASTRUCTURE_DETAILS:0 ""
 pe_msg_chab_refund:0 "The habitat site at $PLANET$ is done, but the system has a habitat already. The corporation gets its money back, we our influence."
 pe_msg_swarm_done:0 "The Dyson swarm of a corporation at $PLANET$ is done."
 pe_msg_corp_swarm_start:0 "§Y$CORP$§! is building a Dyson swarm of its own at $PLANET$."
 pe_msg_corp_furnace_start:0 "§Y$CORP$§! is building an arc furnace of its own over $PLANET$."
 pe_corp_welfare:0 "Corporate Benefits"
 pe_corp_welfare_desc:0 "Rich corporations treat their staff here like civil servants: top pay, pensions and benefits, paid from their own cash. Their workers live at the standard of Utopian Abundance."
 pe.306.name:0 "A Defence Contract"
 pe.306.desc:0 "§Y[Root.GetPeCorpName306]§! offers us a defence contract. The corporation would carry §Y[Root.pe_dc_s]%§! of the upkeep of our fleet for as long as it can afford it (20% while it is very rich), paying the value from its own cash every quarter.\n\nWhat it wants in return are full order books: extra shifts in its steelworks, the first call when we need leased warships, and its headquarters as an arms centre."
 pe.306.a:0 "Sign the contract."
 pe.306.a.tt:0 "Our fleet upkeep §G-[Root.pe_dc_s]%§! while the contract runs. The corporation pays the value saved (base prices) from its cash. Its steelworks get arms orders (+10% workforce of private metallurgists there), its headquarters become an arms centre (+2 stability, +10% metallurgists), and war leases come from it first. The contract ends when its cash falls below 1000."
 pe.306.b:0 "The navy is the business of the state."
 pe_msg_dc_end:0 "Our defence contract has ended: the corporation can no longer afford it, or is gone."
 pe_dc_reg_line:0 "§HDefence contract§! with §Y[Root.GetPeDcName]§!: [Root.pe_dc_s]% of the fleet upkeep, last quarter [Root.pe_dc_paid] £trade£\n"
 pe_defence_contract:0 "Defence Contract"
 pe_defence_contract_desc:0 "A corporation carries part of the upkeep of our fleet and pays for it from its own cash."
 pe_arms_orders:0 "Arms Orders"
 pe_arms_orders_desc:0 "The steelworks of our defence contractor work extra shifts: full order books."
 pe_arms_centre:0 "Arms Centre"
 pe_arms_centre_desc:0 "The headquarters of our defence contractor: a centre of the arms industry, prestigious and well paid."
 pe_auto_cover:0 "Private Automation"
 pe_auto_cover_desc:0 "The private firms pay the energy for their automated jobs themselves; this share of our upkeep for automated workforce falls away."
 pe_corp_swarm_site:0 "Corporate Dyson Swarm Site"
 pe_corp_swarm_site_DESC:0 "Our Private Holdings are building a Dyson swarm here for one of our corporations."
 pe_corp_swarm_site_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_swarm_build:0 "Corporate Dyson Swarm (under construction)"
 pe_corp_swarm_build_DESC:0 "Our Private Holdings are building a Dyson swarm here for one of our corporations. When it is done, the swarm harvests the star for it."
 pe_corp_swarm_build_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_furnace_site:0 "Corporate Arc Furnace Site"
 pe_corp_furnace_site_DESC:0 "Our Private Holdings are building an arc furnace here for one of our corporations."
 pe_corp_furnace_site_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_furnace_build:0 "Corporate Arc Furnace (under construction)"
 pe_corp_furnace_build_DESC:0 "Our Private Holdings are building an arc furnace here for one of our corporations. When it is done, every body of the system gets its deposit."
 pe_corp_furnace_build_MEGASTRUCTURE_DETAILS:0 ""
 mod_pop_pe_private_metallurgist_bonus_workforce_mult:0 "Private Metallurgist Workforce"
 mod_pop_pe_private_physicist_bonus_workforce_mult:0 "Private Physicist Workforce"
 mod_pop_pe_private_biologist_bonus_workforce_mult:0 "Private Biologist Workforce"
 mod_pop_pe_private_engineer_bonus_workforce_mult:0 "Private Engineer Workforce"
 pe.308.name:0 "Defence Contract Ended"
 pe.308.desc:0 "Our defence contract with §Y[Root.GetPeCorpName308]§! has ended: the corporation has run into a crisis (its cash is used up) or no longer exists. Our fleet upkeep is ours alone again. A new corporation may offer a contract in a few years."
 pe.308.a:0 "Understood."
 pe_pat_foundation:0 "The Foundation of [Root.GetPeCorpNamePat]"
 pe_pat_foundation_rep:0 "a corporate foundation"
 PE_CORP_CITADEL_1:0 "Corporate Citadel"
 pe_proto_citadel_upkeep:0 "Prototype: Citadel Upkeep"
 pe_proto_citadel_upkeep_desc:0 "Test of the corporate citadel: the corporation carries its upkeep."
 pe_corp_citadel_site:0 "Corporate Citadel Site"
 pe_corp_citadel_site_DESC:0 "Our Private Holdings are building a deep space citadel here for one of our corporations."
 pe_corp_citadel_site_MEGASTRUCTURE_DETAILS:0 ""
 pe_corp_citadel_build:0 "Corporate Deep Space Citadel (under construction)"
 pe_corp_citadel_build_DESC:0 "Our Private Holdings are building a deep space citadel here for one of our corporations. It will belong to the corporation and fight in our wars."
 pe_corp_citadel_build_MEGASTRUCTURE_DETAILS:0 ""
 pe.315.name:0 "A Corporate Citadel"
 pe.315.desc:0 "§Y[Root.GetPeCorpName315]§! wants to protect its assets in the §Y[pe_cit_sys.GetName]§! system with a deep space citadel of its own. It pays for building, upgrading and running it from its own cash, and adds defence platforms while it can afford them.\n\nThe citadel will belong to the corporation (held by our Private Holdings): we cannot upgrade or dismantle it, but the holdings join our wars, so it fights for us."
 pe.315.a:0 "Approved."
 pe.315.a.tt:0 "Built with the vanilla build time (3 years), then upgraded to level II and III when the corporation can afford it. Costs and upkeep from its cash. At most one corporate citadel per system."
 pe.315.b:0 "Fortresses are the business of the state."
 pe_msg_cit_done:0 "The deep space citadel of §Y$CORP$§! in the $PLANET$ system is done. It fights in our wars."
 pe_msg_cit_up:0 "The deep space citadel of §Y$CORP$§! in the $PLANET$ system has been upgraded."
 pe_msg_cit_heir:0 "§Y$CORP$§! has taken over the corporate deep space citadel in the $PLANET$ system."
 pe_msg_cit_lost:0 "The corporate deep space citadel in the $PLANET$ system has been decommissioned: no corporation can keep it."
 pe_msg_cit_start:0 "§Y$CORP$§! is building a deep space citadel of its own in the $PLANET$ system (vanilla build time)."
