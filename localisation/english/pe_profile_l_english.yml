l_english:
 pe_prof_1:0 "venture corporation"
 pe_prof_c_1:0 ", venture corporation"
 pe_prof_text_1:0 "\n\n§HProfile: venture corporation§!\n\"Whoever waits for the market to be ready comes too late.\"\nYoung partners, high debts, big plans. The offices are converted warehouses, the meetings run deep into the night, and every quarter is meant to be the biggest yet.\n\nTakes over independent firms more often, starts price wars sooner and reaches for stations, habitats and megastructures earlier. It lends freely, deep into the red, and so slips into crisis more easily. It pays benefits only once it is truly rich."
 pe_prof_2:0 "solid house"
 pe_prof_c_2:0 ", solid house"
 pe_prof_text_2:0 "\n\n§HProfile: solid house§!\n\"We count in centuries, not in quarters.\"\nMarble counting houses, cautious accountants and a reserve nobody talks about. A solid house survives the crises that break the others.\n\nIt lends only what it has and so rarely falls into crisis. With it in the empire the investors offer state bonds more readily. It seldom dares price wars, takeovers or big construction projects. It takes a cancellation with composure."
 pe_prof_3:0 "family corporation"
 pe_prof_c_3:0 ", family corporation"
 pe_prof_text_3:0 "\n\n§HProfile: family corporation§!\n\"My grandfather founded these works. My grandchildren will run them.\"\nThe name above the gate is the family's name. They know their workers by name, celebrate their weddings and expect loyalty in return, for generations.\n\nPays benefits with half as much cash, likes to endow foundations and holds on to its headquarters rather than moving to a habitat or another city. With it in the empire there is more family support and help in need. It does not forget a slight: whoever ends a contract with it waits ten years for the next."
 pe_prof_4:0 "technology corporation"
 pe_prof_c_4:0 ", technology corporation"
 pe_prof_text_4:0 "\n\n§HProfile: technology corporation§!\n\"Tomorrow's product is the only one that matters.\"\nLaboratories instead of warehouses, patents instead of smokestacks. The engineers sit at the board table, and the canteen never closes.\n\nExpands its research institute faster and reaches for Dyson swarms more readily. With it in the empire there are more technology licences, prototypes, science foundations and robot start-ups. Because there is much to steal, industrial espionage happens more often."
 pe_prof_5:0 "defence corporation"
 pe_prof_c_5:0 ", defence corporation"
 pe_prof_text_5:0 "\n\n§HProfile: defence corporation§!\n\"Peace is a phase. We plan for what comes after.\"\nWorkshops full of armour plate, generals on the supervisory board, contracts with long terms. People speak quietly here, and they speak about calibres.\n\nAs an industrial corporation it is asked for a defence contract before all others and offers one much more often. It leases war fleets more readily, is first to provide factory guards and protective fleets and likes to build citadels. It takes a cancellation badly: ten years without new negotiations."
 pe_prof_6:0 "finance house"
 pe_prof_c_6:0 ", finance house"
 pe_prof_text_6:0 "\n\n§HProfile: finance house§!\n\"We make nothing. We make sure others can.\"\nPrice boards in every corridor, bonds instead of factories, traders who never sleep. A finance house earns on every move of the market, up or down.\n\nWith a finance house in the empire the exchange moves more: listings, takeovers and rallies, but also crashes and insider trading. It takes over firms more often and offers state bonds more readily."
 pe_prof_7:0 "cooperative"
 pe_prof_c_7:0 ", cooperative"
 pe_prof_text_7:0 "\n\n§HProfile: cooperative§!\n\"Everyone here owns a piece of the works, and everyone works like it.\"\nThe board is elected, the profits are shared, the assemblies are long and loud. Whoever works here stays.\n\nPays benefits with half as much cash, rarely fights price wars and rarely takes over. It has little interest in arms, all the more in family support and company housing. With it in the empire there are fewer strikes and fewer environmental scandals."
 pe_prof_8:0 "pioneer corporation"
 pe_prof_c_8:0 ", pioneer corporation"
 pe_prof_text_8:0 "\n\n§HProfile: pioneer corporation§!\n\"The best deposits lie where no map reaches yet.\"\nProspectors, surveyors, fortune hunters. Headquarters is a ship, and the board is rarely at home.\n\nBuilds stations and habitats more readily and offers exploration charters, salvage, hunting rights and convoy protection more often. With it in the empire prospectors report a find more often."
 pe_prof_9:0 "cartel"
 pe_prof_c_9:0 ", cartel"
 pe_prof_text_9:0 "\n\n§HProfile: cartel§!\n\"Competition is for people who can afford to lose.\"\nBack-room agreements, prices that only rise, and friends in every ministry. Nobody has ever seen a contract, and yet everyone keeps to it.\n\nFights price wars more often and likes to take over. With it in the empire there are more monopolies, dumping, strikes, environmental scandals and industrial espionage. It pays benefits only once it is truly rich."
