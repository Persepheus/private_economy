l_english:
 pe_building_corp_storage:0 "Corporate Warehouse"
 pe_building_corp_storage_desc:0 "A private firm stores part of our surplus here, for a fee (storage contract)."
 pe_store_who_corp:0 "§Y[Root.GetPeCorpName324]§!"
 pe_store_who_inv:0 "A private firm"
 pe_store_who_corp_r:0 "§Y[Root.GetPeCorpName325]§!"
 pe_store_who_inv_r:0 "The private firm"
 pe.324.name:0 "A Storage Contract"
 pe.324.a:0 "Sign the contract."
 pe.324.a.tt:0 "For five years our store holds §G[Root.pe_sto_capn]§! more. Every month the firm takes 20% of our net production of it as its fee. Its Corporate Warehouse appears among the deposits of §Y[pe_sto_planet.GetName]§! (no building slot)."
 pe.324.b:0 "Our stores are big enough."
 pe.325.name:0 "The Storage Contract Ends"
 pe.325.a:0 "Extend it by five years."
 pe.325.a.tt:0 "The extra capacity and the fee stay for another five years."
 pe.325.b:0 "Let it end."
 pe.326.name:0 "An Arms Order from Our Stores"
 pe.326.desc:0 "§Y[Root.GetPeCorpName326]§! has noticed that our alloy stores are overflowing. It offers to build §Y[Root.pe_ao_nn]§! warships of our newest design at its own yards, from §Y[Root.pe_ao_al]§! £alloys£ of our alloys, about §Y[Root.pe_ao_cc]§! a ship. Our own shipyards stay free.\n\nThe board names its price for the yards, the workers and the hurry: §Y[Root.pe_ao_fee]§! £trade£ on top. A good deal for the corporation, says the finance ministry, and a fleet in a year, says the admiralty."
 pe.326.a:0 "Place the order."
 pe.326.a.tt:0 "We pay §Y[Root.pe_ao_al]§! £alloys£ and §Y[Root.pe_ao_fee]§! £trade£. In a year the ships are delivered at our capital; they are ours (normal upkeep and naval capacity)."
 pe.326.a.fail:0 "We do not have the trade for it."
 pe.326.b:0 "We build our own ships."
 pe_ao_fleet_name:0 "Arms Order"
 pe_msg_defence_order_done:0 "The warships of our arms order have been delivered at $PLANET$."
 pe.324.desc.mi:0 "Our £minerals£ minerals stores are nearly full. [Root.GetPeStoreWho] offers to store our surplus in its own warehouse: §G[Root.pe_sto_capn]§! more capacity for five years.\n\nIts fee is 20% of our net production of minerals every month, about §Y[Root.pe_sto_feen]§! £minerals£ at the moment, which it sells on its own account. For it the firm sets up a §YCorporate Warehouse§! on its planet; it shows among the planet's deposits and takes no building slot."
 pe.325.desc.mi:0 "In six months our storage contract for £minerals£ minerals ends. [Root.GetPeStoreWhoR] offers to extend it by five years on the same terms. Whatever does not fit into our own store when it ends is lost."
 pe_msg_supply_store_end_mi:0 "Our storage contract for minerals has ended; the corporate warehouse has closed."
