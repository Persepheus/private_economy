l_english:
 pe_mag_rep_high:0 "well regarded"
 pe_mag_rep_mixed:0 "divisive"
 pe_mag_rep_low:0 "notorious"
 pe.200.name:0 "A Glittering Gala"
 pe.200.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), one of the richest people in the empire, has rented the grand orbital ballroom above §Y[pe_pat_planet.GetName]§!. For three nights the elite of business, art and politics will dance, dine and, above all, be seen.\n\nThe bill: §Y[Root.pe_pat_spend]§! £trade£ from private capital. The newsfeeds are already debating whether this is a celebration of our prosperity or an insult to everyone who has to work tomorrow."
 pe.200.a:0 "Let them celebrate. Prosperity is something to show."
 pe.200.b:0 "Denounce the decadence publicly."
 pe.200.c:0 "A luxury tax on such festivities seems only fair."
 pe.201.name:0 "Scandal at the Gala"
 pe.201.desc:0 "Months after the gala, recordings have surfaced: senior officials, generous "gifts" and a contract for the capital's transit network. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) denies everything, but the public wants answers."
 pe.201.a:0 "Make it go away quietly. (150 £trade£)"
 pe.201.b:0 "Let the investigators do their work."
 pe.202.name:0 "A Foundation for Science"
 pe.202.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has announced the largest private research foundation in our history and is putting §Y[Root.pe_pat_spend]§! £trade£ into it. Laboratories, grants, prizes for daring ideas: the scientific community is jubilant.\n\nThe only question is who decides what gets researched."
 pe.202.a:0 "Free research: the foundation follows its own curiosity."
 pe.202.b:0 "Guidelines: physics."
 pe.202.c:0 "Guidelines: society."
 pe.202.d:0 "Guidelines: engineering."
 pe.203.name:0 "The Prototype"
 pe.203.desc:0 "In a hangar on §Y[pe_pat_planet.GetName]§!, engineers backed by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) have built something nobody asked them to build: a prototype that, if it works, will leave the state laboratories looking old. §Y[Root.pe_pat_spend]§! £trade£ of private capital is riding on it.\n\nThe test is scheduled. Our safety inspectors are nervous."
 pe.203.a:0 "It is their money and their risk."
 pe.203.b:0 "Back it with state engineers and materials. (250 £alloys£)"
 pe.206.name:0 "The Prototype Test"
 pe.206.desc.success:0 "The test was a complete success. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is celebrated as a visionary, and our engineers gain §G+[Root.pe_pat_proto_full]§! £engineering£ engineering research from the results."
 pe.206.desc.partial:0 "The prototype worked, more or less. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) speaks of "valuable insights"; our engineers gain §G+[Root.pe_pat_proto_part]§! £engineering£ engineering research from them."
 pe.206.desc.failure:0 "A flash, a pressure wave, then silence. The hangar is gone, and the district around it needs months to recover: §R-5 stability§! and fewer amenities on the capital for two years. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) speaks of a "regrettable setback"."
 pe.206.a:0 "So it goes with progress."
 pe.204.name:0 "A Helping Hand"
 pe.204.desc:0 "§Y[pe_pat_planet.GetName]§! is struggling: too little housing, too few places to unwind. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has offered to help with §Y[Root.pe_pat_spend]§! £trade£ of private money: emergency housing, parks, community centres.\n\nSome call it generosity. Others say the magnate is buying the hearts of the people."
 pe.204.a:0 "Accept the help with thanks."
 pe.204.b:0 "The state looks after its own citizens."
 pe.205.name:0 "Recruitment Campaign"
 pe.205.desc:0 "The private firms on §Y[pe_pat_planet.GetName]§! cannot find enough workers. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) proposes a campaign across the empire: posters, relocation bonuses, promises of a better life on §Y[pe_pat_planet.GetName]§!.\n\nIt will draw idle citizens from other worlds. With state support, it would draw many more."
 pe.205.a:0 "The state co-finances the campaign. (150 £trade£)"
 pe.205.b:0 "Let the firms run it themselves."
 pe.205.c:0 "We will not have our citizens lured away."
 pe_gala:0 "Afterglow of the Gala"
 pe_gala_desc:0 "The whole planet is still talking about the gala."
 pe_gala_scandal:0 "Gala Scandal"
 pe_gala_scandal_desc:0 "Investigations into the gala keep the planet in suspense."
 pe_prototype_accident:0 "Prototype Accident"
 pe_prototype_accident_desc:0 "A private prototype exploded here."
 pe_charity:0 "Private Charity"
 pe_charity_desc:0 "Emergency housing and community centres paid for by a private patron."
 pe_charity_mistrust:0 "Mistrust of the Patron"
 pe_charity_mistrust_desc:0 "Who is this patron, and what do they want in return?"
 pe_recruit_strong:0 "Recruitment Campaign"
 pe_recruit_strong_desc:0 "State and firms are luring workers from other worlds."
 pe_recruit_weak:0 "Private Recruitment"
 pe_recruit_weak_desc:0 "The private firms here are recruiting workers from other worlds."
 pe_recruit_refused:0 "Recruitment Forbidden"
 pe_recruit_refused_desc:0 "The firms resent that the state forbade their recruitment campaign."
 pe_magnate_1:0 "Aurelio Vance"
 pe_magnate_2:0 "Selene Okoro-Thal"
 pe_magnate_3:0 "Darius Venn"
 pe_magnate_4:0 "Mira Castellane"
 pe_magnate_5:0 "Oren Halvorsen"
 pe_magnate_6:0 "Ysolde Kade"
 pe_magnate_7:0 "Tarek Ibarra"
 pe_magnate_8:0 "Lyra Whitcombe"
 pe_magnate_9:0 "Cassian Moreau"
 pe_magnate_10:0 "Nadia Prax"
 pe_magnate_11:0 "Halden Sterling"
 pe_magnate_12:0 "Imara Quell"
 pe_magnate_13:0 "Rafe Dunmore"
 pe_magnate_14:0 "Vesna Arkwright"
 pe_magnate_15:0 "Jorin Tal"
 pe_magnate_16:0 "Elodie Marchetti"
 pe.210.desc.miner:0 "The private mines on §Y[pe_pat_planet.GetName]§! cannot fill their jobs. The firms, led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), propose overtime: extra shifts for the miners who are there, for considerably better wages, paid with §Y[Root.pe_pat_spend]§! £trade£ from private capital.\n\nProduction would rise for years. The workers would be tired, and it would show."
 pe.212.desc.miner:0 "Without enough miners, half the mines on §Y[pe_pat_planet.GetName]§! stand idle. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has found a lessor: automated rigs and harvesters, maintenance included, for eight years. The firms pay §Y[Root.pe_pat_spend]§! £trade£; the machines need no state energy."
 pe.210.desc.technician:0 "The private power plants on §Y[pe_pat_planet.GetName]§! cannot fill their jobs. The firms, led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), propose overtime: extra shifts for the technicians who are there, for considerably better wages, paid with §Y[Root.pe_pat_spend]§! £trade£ from private capital.\n\nProduction would rise for years. The workers would be tired, and it would show."
 pe.212.desc.technician:0 "Without enough technicians, half the power plants on §Y[pe_pat_planet.GetName]§! stand idle. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has found a lessor: automated rigs and harvesters, maintenance included, for eight years. The firms pay §Y[Root.pe_pat_spend]§! £trade£; the machines need no state energy."
 pe.210.desc.farmer:0 "The private farms on §Y[pe_pat_planet.GetName]§! cannot fill their jobs. The firms, led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), propose overtime: extra shifts for the farmers who are there, for considerably better wages, paid with §Y[Root.pe_pat_spend]§! £trade£ from private capital.\n\nProduction would rise for years. The workers would be tired, and it would show."
 pe.212.desc.farmer:0 "Without enough farmers, half the farms on §Y[pe_pat_planet.GetName]§! stand idle. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has found a lessor: automated rigs and harvesters, maintenance included, for eight years. The firms pay §Y[Root.pe_pat_spend]§! £trade£; the machines need no state energy."
 pe.210.name:0 "Overtime for Better Wages"
 pe.210.a:0 "Agree to the extra shifts."
 pe.210.b:0 "Our workers are not cattle."
 pe.211.name:0 "Guest Workers"
 pe.211.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has struck a deal: §G[Root.pe_gw_pops]§! §Y[pe_gw_species.GetNamePlural]§! from a neighbouring empire are willing to come to §Y[pe_pat_planet.GetName]§! and take the empty jobs. The firms pay the journey with §Y[Root.pe_pat_spend]§! £trade£; the state would have to issue the papers.\n\nNot everyone will welcome strangers in the canteens."
 pe.211.a:0 "Issue the papers. (100 £trade£)"
 pe.211.b:0 "We will manage with our own people."
 pe.212.name:0 "Machine Leasing"
 pe.212.a:0 "Lease the machines."
 pe.212.b:0 "We do not want foreign machines on our soil."
 pe.213.name:0 "Strike!"
 pe.213.desc:0 "The workers of the private firms on §Y[pe_pat_planet.GetName]§! have laid down their tools. Too much work, too few hands, wages that do not keep up. The firms around §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offer a raise from private capital (§Y[Root.pe_pat_spend]§! £trade£)."
 pe.213.a:0 "The firms pay the raise."
 pe.213.b:0 "Let it run its course."
 pe.213.c:0 "Send in security forces."
 pe.214.name:0 "A Prospecting Find"
 pe.214.desc:0 "Prospectors financed by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) have found a rich deposit on §Y[pe_pat_planet.GetName]§!. They have already spent §Y[Root.pe_pat_spend]§! £trade£ and would like to mine it themselves."
 pe.214.a:0 "It is their find: let them mine it."
 pe.214.b:0 "Such deposits belong to the state."
 pe.214.c:0 "Place the site under protection."
 pe.215.name:0 "Hydroponics Start-up"
 pe.215.desc:0 "Food is running short. A start-up backed by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to build vertical farms in the towers of §Y[pe_pat_planet.GetName]§!: food without fields and without farmers. Cost to the investors: §Y[Root.pe_pat_spend]§! £trade£. The farms would produce §G[Root.pe_hydro_food]§! £food£ food a month for ten years and need some energy."
 pe.215.a:0 "Build the towers."
 pe.215.b:0 "Food comes from fields."
 pe.220.name:0 "Patron of the Arts"
 pe.220.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to be remembered not only for wealth: museums, theatres and a monument on the capital, paid with §Y[Root.pe_pat_spend]§! £trade£. The question is whether art should be free or serve the state."
 pe.220.a:0 "Let the arts be free."
 pe.220.b:0 "Art should celebrate our nation."
 pe.221.name:0 "The League"
 pe.221.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is founding an interstellar sports league: stadiums on several worlds, teams, broadcasts. §Y[Root.pe_pat_spend]§! £trade£ are already committed. The state could let the league grow freely or auction the broadcasting rights."
 pe.221.a:0 "Let the games begin!"
 pe.221.b:0 "Auction the broadcasting rights."
 pe.222.name:0 "Party Donations"
 pe.222.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offers generous donations to "parties that understand the economy": §Y[Root.pe_pat_spend]§! £trade£, no strings attached, of course. The money would go to the parties, not to the treasury. The state only decides how to deal with it."
 pe.222.a:0 "Accept the donations."
 pe.222.b:0 "Ban such donations."
 pe.222.c:0 "Make the offer public."
 pe.223.name:0 "Private Colonists"
 pe.223.desc:0 "A consortium led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to found a colony on §Y[pe_pat_colony.GetName]§! at its own expense: ships, equipment and §G[Root.pe_col_pops]§! settlers, paid with §Y[Root.pe_pat_spend]§! £trade£. The colony would be ours."
 pe.223.a:0 "May they prosper out there."
 pe.223.b:0 "Colonisation is a matter for the state."
 pe.224.name:0 "A University"
 pe.224.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is founding a university on the capital and puts §Y[Root.pe_pat_spend]§! £trade£ into it. Open to everyone, or an academy for the very best?"
 pe.224.a:0 "Open to everyone."
 pe.224.b:0 "An elite academy."
 pe.225.name:0 "Space Tourism"
 pe.225.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has bought cruise liners: tours to the wonders of our empire, starting on §Y[pe_pat_planet.GetName]§!. §Y[Root.pe_pat_spend]§! £trade£ have been invested; the state only has to permit the routes."
 pe.225.a:0 "Open the routes."
 pe.225.b:0 "No tourists in our skies."
 pe.226.name:0 "Disaster Relief"
 pe.226.desc:0 "§Y[pe_pat_planet.GetName]§! is in crisis. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offers immediate help: supplies, shelters, rebuilding, worth §Y[Root.pe_pat_spend]§! £trade£. "In times like these, profits can wait," the magnate says, and the firms would take only half their profit share for two years."
 pe.226.a:0 "Accept the help gratefully."
 pe.226.b:0 "The state will handle it."
 pe.227.name:0 "Betting Scandal"
 pe.227.desc:0 "Matches of the league were fixed, and the trail leads to people close to §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]). The fans are furious."
 pe.227.a:0 "Settle it quietly. (100 £trade£)"
 pe.227.b:0 "Let the scandal play out."
 pe.228.name:0 "Tourist Accident"
 pe.228.desc:0 "A cruise liner of §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) got too close to a stellar phenomenon. Not everyone came back. The empire mourns."
 pe.228.a:0 "A dark day."
 d_pe_hydroponics:0 "Hydroponic Towers"
 d_pe_hydroponics_desc:0 "Private vertical farms. They produce food without farmers and need some energy."
 pe_overtime_miner:0 "Overtime in the Mines"
 pe_overtime_miner_desc:0 "Extra shifts for better wages."
 pe_overtime_technician:0 "Overtime in the Power Plants"
 pe_overtime_technician_desc:0 "Extra shifts for better wages."
 pe_overtime_farmer:0 "Overtime on the Farms"
 pe_overtime_farmer_desc:0 "Extra shifts for better wages."
 pe_guest_unrest:0 "Resentment of Guest Workers"
 pe_guest_unrest_desc:0 "Not everyone likes strangers in the canteens."
 pe_leasing_miner:0 "Leased Mining Rigs"
 pe_leasing_miner_desc:0 "Automated machines leased by the private firms, maintenance included."
 pe_leasing_technician:0 "Leased Power Equipment"
 pe_leasing_technician_desc:0 "Automated machines leased by the private firms, maintenance included."
 pe_leasing_farmer:0 "Leased Harvesters"
 pe_leasing_farmer_desc:0 "Automated machines leased by the private firms, maintenance included."
 pe_strike:0 "Strike"
 pe_strike_desc:0 "The workers of the private firms have laid down their tools."
 pe_strike_crushed:0 "Strike Crushed"
 pe_strike_crushed_desc:0 "Security forces broke the strike. People remember."
 pe_strike_crushed_mild:0 "Strike Ended by Force"
 pe_strike_crushed_mild_desc:0 "Security forces ended the strike."
 pe_business_upset:0 "Business Upset"
 pe_business_upset_desc:0 "The private economy feels mistreated by the state."
 pe_art:0 "Flourishing Arts"
 pe_art_desc:0 "Museums, theatres and a new monument, paid by a patron."
 pe_league:0 "Sports League"
 pe_league_desc:0 "A stadium of the interstellar league."
 pe_bet_scandal:0 "Betting Scandal"
 pe_bet_scandal_desc:0 "Fixed matches, furious fans."
 pe_corruption:0 "Party Donations"
 pe_corruption_desc:0 "Private money in politics."
 pe_university:0 "Private University"
 pe_university_desc:0 "A university founded by a patron, open to everyone."
 pe_elite_academy:0 "Elite Academy"
 pe_elite_academy_desc:0 "An academy for the very best. Not everyone thinks it is fair."
 pe_tourism:0 "Space Tourism"
 pe_tourism_desc:0 "Cruise liners bring visitors and money."
 pe_tourism_accident:0 "Mourning"
 pe_tourism_accident_desc:0 "The empire mourns the victims of a tourist accident."
 pe_relief:0 "Disaster Relief"
 pe_relief_desc:0 "Private help in a time of crisis."
 pe.200.desc.again:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is throwing another gala above §Y[pe_pat_planet.GetName]§!, bigger than the last one, of course. The bill: §Y[Root.pe_pat_spend]§! £trade£ from private capital. Some find it splendid, others shameless."
 pe.202.desc.again:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is founding another research foundation and puts §Y[Root.pe_pat_spend]§! £trade£ into it. The academies have almost got used to it."
 pe.221.desc.again:0 "The league of §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is expanding: new teams, new stadiums, §Y[Root.pe_pat_spend]§! £trade£ of fresh money. Shall it grow freely, or does the state sell the broadcasting rights this time?"
 pe.224.desc.again:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is founding another university on the capital and puts §Y[Root.pe_pat_spend]§! £trade£ into it. Open to everyone, or an academy for the very best?"
 pe.230.name:0 "Company Housing"
 pe.230.desc:0 "The private firms on §Y[pe_pat_planet.GetName]§! cannot house their workers. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) proposes company housing: apartment blocks next to the plants, built with §Y[Root.pe_pat_spend]§! £trade£ of private money. §G+[Root.pe_house]§! housing on §Y[pe_pat_planet.GetName]§!, for good."
 pe.230.a:0 "Build the housing."
 pe.230.b:0 "We do not want company towns."
 pe.231.name:0 "Robot Start-up"
 pe.231.desc:0 "A start-up backed by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to build robot workers on §Y[pe_pat_planet.GetName]§!, where hands are short. §Y[Root.pe_pat_spend]§! £trade£ of private capital, five years of production."
 pe.231.a:0 "Let the assembly lines run."
 pe.231.b:0 "Machines do not replace people."
 pe.232.name:0 "Rural Premium"
 pe.232.desc:0 "Everybody on §Y[pe_pat_planet.GetName]§! wants to work in offices and laboratories; the mines and fields stand empty. The private firms around §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offer a rural premium: considerably higher wages for workers in their mines, power plants and farms, paid with §Y[Root.pe_pat_spend]§! £trade£. For five years, private worker jobs there would be more attractive than specialist jobs."
 pe.232.a:0 "Pay the premium."
 pe.232.b:0 "The market will sort it out."
 pe.233.name:0 "Family Support"
 pe.233.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) proposes a family programme on §Y[pe_pat_planet.GetName]§!: childcare, parental leave, family flats, financed with §Y[Root.pe_pat_spend]§! £trade£. More children, more workers, in time. (Only organic pops grow faster.)"
 pe.233.a:0 "The state adds its share: ten years. (100 £trade£)"
 pe.233.b:0 "Let the firms run it: five years."
 pe.233.c:0 "Families are a private matter."
 pe.240.name:0 "A Farewell"
 pe.240.desc:0 "§Y[Root.GetPeMagnateOld]§! is retiring and settling their affairs. A fortune of §Y[Root.pe_fw_amt]§! £trade£ from the private capital is to be bequeathed. The question is to whom."
 pe.240.a:0 "To a research foundation, as a legacy."
 pe.240.b:0 "The state levies inheritance tax."
 pe.240.c:0 "To the heirs, who will carry on the business."
 pe.241.name:0 "Going Public"
 pe.241.desc:0 "One of our largest private corporations is going public. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) invites the state to buy shares: each share costs 500 £trade£ and pays 10 £trade£ a month in dividends, as long as the investors can afford it."
 pe.241.a:0 "Buy one share. (500 £trade£)"
 pe.241.b:0 "Buy three shares. (1500 £trade£)"
 pe.241.c:0 "The state does not speculate."
 pe.242.name:0 "State Bonds"
 pe.242.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offers the state a loan from private capital: §Y[Root.pe_pat_spend]§! £trade£ now, repaid with 20% interest over five years (§Y[Root.pe_bond_new]§! £trade£ a month, shown with the private savings)."
 pe.242.a:0 "Take the loan."
 pe.242.b:0 "We do not take on debt."
 pe.243.name:0 "Hostile Takeover"
 pe.243.desc:0 "On §Y[pe_pat_planet.GetName]§!, a private firm wants to swallow a competitor. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has the money ready: §Y[Root.pe_pat_spend]§! £trade£. The bought firm would close and its district slot would be free; the buyer would grow stronger."
 pe.243.a:0 "Let the market decide."
 pe.243.b:0 "Block the takeover."
 pe.244.name:0 "Monopoly"
 pe.244.desc:0 "Too many of our private firms produce the same thing. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) and the other owners now dictate prices and want a quarter more profit share."
 pe.244.a:0 "Accept it: five years of higher profits."
 pe.244.b:0 "Antitrust proceedings: fine the investors."
 pe.244.c:0 "Break up the monopoly politically. (50 £influence£)"
 pe.245.name:0 "Industrial Espionage"
 pe.245.desc:0 "Engineers of §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) have obtained blueprints from §Y[pe_pat_country.GetName]§!. Nobody asks how. If it comes out, it will be embarrassing."
 pe.245.a:0 "Use the blueprints."
 pe.245.b:0 "Destroy them and dismiss those responsible."
 pe.252.name:0 "Espionage Exposed"
 pe.252.desc:0 "§Y[pe_pat_country.GetName]§! has uncovered the espionage. Our diplomats have their hands full."
 pe.252.a:0 "Unfortunate."
 pe.246.name:0 "Export Boom"
 pe.246.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has negotiated a trade agreement with merchants of §Y[pe_pat_country.GetName]§!. §Y[Root.pe_pat_spend]§! £trade£ are already invested in warehouses and freighters. The state only has to grant the licences."
 pe.246.a:0 "Grant the licences."
 pe.246.b:0 "No foreign trade deals."
 pe.247.name:0 "Environmental Scandal"
 pe.247.desc:0 "A private plant on §Y[pe_pat_planet.GetName]§! has poisoned the land around it. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) speaks of an accident. Someone has to pay for the clean-up."
 pe.247.a:0 "The firms pay the clean-up."
 pe.247.b:0 "The state pays, quickly. (150 £trade£)"
 pe.247.c:0 "Let it be."
 pe.248.name:0 "Stock Market Crash"
 pe.248.desc:0 "The markets have collapsed. Half of the private capital has evaporated, firms are short of money, and our shares have lost half their value. Without help, a recession threatens."
 pe.248.a:0 "A rescue package. (300 £trade£)"
 pe.248.b:0 "The market must cleanse itself."
 pe.249.name:0 "Stock Market Rally"
 pe.249.desc:0 "Prices are soaring: the private capital has grown by §Y[Root.pe_rally]§! £trade£ in a few weeks. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) speaks of a golden age. Some economists speak of a bubble."
 pe.249.a:0 "Tax the gains."
 pe.249.b:0 "Let it run."
 pe.250.name:0 "Insider Trading"
 pe.250.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) sold shares days before bad news became public. Coincidence, of course."
 pe.250.a:0 "Prosecute."
 pe.250.b:0 "Let it go."
 pe.251.name:0 "Gentrification"
 pe.251.desc:0 "Wealthy buyers around §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) are buying up whole neighbourhoods on §Y[pe_pat_planet.GetName]§! and turning them into elegant quarters with §Y[Root.pe_pat_spend]§! £trade£. Nicer streets, fewer flats for ordinary people."
 pe.251.a:0 "The city is getting more beautiful."
 pe.251.b:0 "Introduce rent control."
 d_pe_company_housing:0 "Company Housing"
 d_pe_company_housing_desc:0 "Apartment blocks the private firms built for their workers."
 pe_robot_startup:0 "Robot Start-up"
 pe_robot_startup_desc:0 "A private start-up builds robot workers here."
 pe_rural_premium:0 "Rural Premium"
 pe_rural_premium_desc:0 "Private worker jobs here pay well enough to compete with specialist jobs."
 pe_family:0 "Family Support"
 pe_family_desc:0 "Childcare, parental leave and family flats."
 pe_export_boom:0 "Export Boom"
 pe_export_boom_desc:0 "A private trade agreement brings business."
 pe_pollution:0 "Pollution"
 pe_pollution_desc:0 "A private plant poisoned the land."
 pe_recession:0 "Recession"
 pe_recession_desc:0 "After the stock market crash, the economy is struggling."
 pe_gentrification:0 "Gentrification"
 pe_gentrification_desc:0 "Elegant quarters, fewer flats for ordinary people."
 pe_farewell:0 "A Patron's Legacy"
 pe_farewell_desc:0 "A retired magnate's bequest is remembered fondly."
 pe.214.a.tt:0 "The planet gets §G[Root.pe_find_n]§! new deposit(s) (+1 slot each for a mining, generator or farming district). If a district slot is free and at least 50 pops are idle, a private firm opens on one of them at once."
 pe.214.b.tt:0 "The planet gets the §G[Root.pe_find_n]§! new deposit(s) (+1 slot each for a mining, generator or farming district) for the state. Half of the prospectors' money goes back to the investors."
 pe.243.a.tt:0 "The smallest firm on the planet is bought by one at least as big: it closes and its district slot is free; the buyer takes over its capital."
 pe.241.a.tt:0 "+1 share: §G+10§! £trade£ a month in dividends, as long as the investors can pay."
 pe.241.b.tt:0 "+3 shares: §G+30§! £trade£ a month in dividends, as long as the investors can pay."
 pe.242.a.tt:0 "Repayment: §R[Root.pe_bond_new]§! £trade£ a month for eight years."
 pe.244.a.tt:0 "For five years the firms take a quarter more profit share."
 pe.244.b.tt:0 "The investors lose a fifth of their capital."
 pe.240.c.tt:0 "The fortune stays with the investors. The successor inherits half of the reputation."
 pe.249.b.tt:0 "A bubble grows: a crash becomes three times as likely for three years."
 pe.213.a.tt:0 "The firms raise the wages from the investor pool. The strike ends."
 pe.210.b.tt:0 "The workers keep their hours. They might still go on strike."
 d_pe_hydroponics_2:0 "Hydroponic Towers"
 d_pe_hydroponics_2_desc:0 "Private vertical farms. They produce food without farmers and need some energy."
 d_pe_hydroponics_3:0 "Hydroponic Towers"
 d_pe_hydroponics_3_desc:0 "Private vertical farms. They produce food without farmers and need some energy."
 pe_overtime_tired:0 "Tired Workers"
 pe_overtime_tired_desc:0 "Extra shifts take their toll."
 d_pe_company_housing_2:0 "Company Housing"
 d_pe_company_housing_2_desc:0 "Apartment blocks the private firms built for their workers."
 d_pe_company_housing_3:0 "Company Housing"
 d_pe_company_housing_3_desc:0 "Apartment blocks the private firms built for their workers."
 pe.215.a.tt:0 "§Y[pe_pat_planet.GetName]§! gets hydroponic towers: §G+[Root.pe_hydro_food]§! £food£ food a month for ten years, for a little energy."
 pe.226.a.tt:0 "Out of gratitude the firms take only half their profit for two years."
 pe.260.name:0 "A Special Deal"
 pe.260.desc:0 "We are short of [Root.GetPeDealX], and our stores are less than half full. The management of [Root.GetPeDealFirm] has an offer: for two years they deliver §G[Root.pe_deal_xamt]§! [Root.GetPeDealX] every month (§G[Root.pe_deal_xtot]§! in all), and take §R[Root.pe_deal_yamt]§! [Root.GetPeDealY] a month in return (§R[Root.pe_deal_ytot]§! in all), of which we have plenty.\n\nOn the market this would cost us noticeably more. The firm will sell our goods on at its own price, of course; its owners expect to make about §Y[Root.pe_deal_profit]§! £trade£ a month from it."
 pe.260.a:0 "Deal."
 pe.260.a.tt:0 "For 24 months a budget line §YSupply Deal§! on the capital: the delivery as income, our payment as upkeep. It ends early if we run out of the good we pay with. The firm's margin goes to the investors every month."
 pe.260.b:0 "Haggle for a better price."
 pe.260.b.tt:0 "They might give way, or walk out."
 pe.260.c:0 "We will manage without them."
 pe.261.name:0 "Haggling"
 pe.261.desc.ok:0 "After a long night the managers give way: §G[Root.pe_deal_xamt]§! [Root.GetPeDealX] a month for only §R[Root.pe_deal_yamt]§! [Root.GetPeDealY], for two years. Their margin shrinks to §Y[Root.pe_deal_profit]§! £trade£ a month."
 pe.261.desc.no:0 "The managers gather their papers. "We are a business, not a charity." The offer is off the table."
 pe.261.a:0 "Agreed."
 pe.261.b:0 "Their loss."
 pe.262.name:0 "Modernisation"
 pe.262.desc:0 "There are no more workers to be found on §Y[pe_pat_planet.GetName]§!. Instead of new jobs, the private [Root.GetPeSector] around §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) want to invest §Y[Root.pe_pat_spend]§! £trade£ in better machines, software and methods. The improvements would benefit every workplace of the sector on the planet, the state's as well, for ten years."
 pe.262.a:0 "Progress is welcome."
 pe.262.b:0 "We see no need."
 pe.263.name:0 "Rationalisation"
 pe.263.desc:0 "The private [Root.GetPeRatSector] on §Y[pe_pat_planet.GetName]§! cannot fill §Y[Root.pe_rat_free]§! jobs. Consultants hired by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) propose to cut §Y[Root.pe_rat_jobs]§! of them for good and reorganise the rest: fewer desks, more output per head, the whole sector on the planet included. The investors pay §Y[Root.pe_pat_spend]§! £trade£ for it."
 pe.263.a:0 "Leaner and better."
 pe.263.b:0 "Jobs are jobs."
 pe.264.name:0 "A Capital Levy?"
 pe.264.desc:0 "The private investors sit on §Y[Root.pe_capital]§! £trade£, far more than our firms can put to use. The finance ministry proposes a one-off levy on large fortunes. The business community is alarmed; others ask why so much money lies idle in the first place."
 pe.264.a:0 "A moderate levy. (§G[Root.pe_levy_lo]§! £trade£)"
 pe.264.b:0 "A heavy levy. (§G[Root.pe_levy_hi]§! £trade£)"
 pe.264.c:0 "Private wealth is untouchable."
 pe.265.name:0 "Investment Abroad"
 pe.265.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to invest §Y[Root.pe_pat_spend]§! £trade£ of private capital in §Y[pe_pat_country.GetName]§!: shipyards, mines, a stake in their trade houses. The money would leave our economy, but the returns would come back for years, and §Y[pe_pat_country.GetName]§! would welcome it."
 pe.265.a:0 "Let the money work abroad."
 pe.265.a.tt:0 "For ten years: §G+[Root.pe_abroad_new_state]§! £trade£ a month for us as taxes on the returns (budget line "Dividends"); the investors get §G[Root.pe_abroad_new_pool]§! £trade£ a month."
 pe.265.b:0 "Our capital stays at home."
 pe.266.name:0 "A Foreign Branch"
 pe.266.desc:0 "A corporation from §Y[pe_pat_country.GetName]§! wants to open a branch on §Y[pe_pat_planet.GetName]§!: offices, a showroom, a few hundred well-paid jobs for locals, all at its own expense. Our own firms are less enthusiastic about the competition."
 pe.266.a:0 "Welcome them."
 pe.266.a.tt:0 "Our firms lose customers: the investors lose a twentieth of their capital."
 pe.266.b:0 "Only against a licence fee."
 pe.266.c:0 "Our market is for our firms."
 pe.266.c.tt:0 "Our business community is grateful."
 pe.267.name:0 "A Technology Licence"
 pe.267.desc:0 "A corporation from §Y[pe_pat_country.GetName]§! offers us a licence for its [Root.GetPeLicField] patents, for §Y[Root.pe_lic_cost]§! £trade£. Either the state buys it and opens the patents to all our scientists, or our private firms buy it for their own labs."
 pe.267.a:0 "The state buys the licence."
 pe.267.b:0 "Let our firms buy it."
 pe.267.c:0 "We do our own research."
 pe.268.name:0 "Dumping"
 pe.268.desc:0 "Firms from §Y[pe_pat_country.GetName]§! are flooding our market with cheap [Root.GetPeDumpGood], far below cost. Our own producers cannot keep up and demand protection. Tariffs would cost us political capital, and §Y[pe_pat_country.GetName]§! would not take them lightly."
 pe.268.a:0 "Cheap goods are good goods."
 pe.268.a.tt:0 "Our private firms that make them lose a quarter of their capital."
 pe.268.b:0 "Raise protective tariffs. (§Y[Root.pe_tariff]§! £influence£)"
 pe_foreign_branch:0 "Foreign Branch"
 pe_foreign_branch_desc:0 "Offices of a foreign corporation: good jobs, new customers."
 pe_opinion_investment:0 "Investments"
 pe_opinion_tariffs:0 "Protective Tariffs"
 pe_good_1:0 "£alloys£ alloys"
 pe_deal_firm_1:0 "a private steelworks"
 pe_good_2:0 "£consumer_goods£ consumer goods"
 pe_deal_firm_2:0 "a private factory"
 pe_good_3:0 "£minerals£ minerals"
 pe_deal_firm_3:0 "a private mine"
 pe_good_4:0 "£energy£ energy"
 pe_deal_firm_4:0 "a private power plant"
 pe_good_5:0 "£food£ food"
 pe_deal_firm_5:0 "a private farm"
 pe_sector_1:0 "steelworks"
 pe_modern_metallurgist:0 "Modernised Steelworks"
 pe_modern_metallurgist_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_2:0 "factories"
 pe_modern_artisan:0 "Modernised Factories"
 pe_modern_artisan_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_3:0 "trading houses"
 pe_modern_trader:0 "Modernised Trading Houses"
 pe_modern_trader_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_4:0 "physics labs"
 pe_modern_physicist:0 "Modernised Physics Labs"
 pe_modern_physicist_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_5:0 "biology labs"
 pe_modern_biologist:0 "Modernised Biology Labs"
 pe_modern_biologist_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_6:0 "engineering labs"
 pe_modern_engineer:0 "Modernised Engineering Labs"
 pe_modern_engineer_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_7:0 "media houses"
 pe_modern_bureaucrat:0 "Modernised Media Houses"
 pe_modern_bureaucrat_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_8:0 "mines"
 pe_modern_miner:0 "Modernised Mines"
 pe_modern_miner_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_9:0 "power plants"
 pe_modern_technician:0 "Modernised Power Plants"
 pe_modern_technician_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_sector_10:0 "farms"
 pe_modern_farmer:0 "Modernised Farms"
 pe_modern_farmer_desc:0 "Private firms have invested in better machines and methods; the whole sector here benefits."
 pe_rational_metallurgist:0 "Lean Steelworks"
 pe_rational_metallurgist_desc:0 "Fewer private jobs that could not be filled anyway, more output per head."
 pe_rational_artisan:0 "Lean Factories"
 pe_rational_artisan_desc:0 "Fewer private jobs that could not be filled anyway, more output per head."
 pe_rational_trader:0 "Lean Trading Houses"
 pe_rational_trader_desc:0 "Fewer private jobs that could not be filled anyway, more output per head."
 pe_rational_physicist:0 "Lean Physics Labs"
 pe_rational_physicist_desc:0 "Fewer private jobs that could not be filled anyway, more output per head."
 pe_rational_biologist:0 "Lean Biology Labs"
 pe_rational_biologist_desc:0 "Fewer private jobs that could not be filled anyway, more output per head."
 pe_rational_engineer:0 "Lean Engineering Labs"
 pe_rational_engineer_desc:0 "Fewer private jobs that could not be filled anyway, more output per head."
 pe_rational_bureaucrat:0 "Lean Media Houses"
 pe_rational_bureaucrat_desc:0 "Fewer private jobs that could not be filled anyway, more output per head."
 pe_field_1:0 "£physics£ physics"
 pe_field_2:0 "£society£ society"
 pe_field_3:0 "£engineering£ engineering"
 pe.270.name:0 "A Corporation Is Born"
 pe.270.desc:0 "A private firm on §Y[pe_corp_planet.GetName]§! has grown into a corporation: §Y[Root.GetPeCorpName270]§!, in [Root.GetPeCorpGroup270]. Its chief executive is §Y[Root.GetPeCorpCeo270]§!.\n\nFrom now on it will take over smaller independent firms of its sector, and half of what its firms earn beyond their needs goes into its own cash. Its headquarters strengthens the planet."
 pe.270.a:0 "May it prosper."
 pe.271.name:0 "Price War"
 pe.271.desc:0 "§Y[Root.GetPeCorpA]§! and §Y[Root.GetPeCorpB]§! are fighting for the same customers: discounts, poached managers, advertising everywhere. Their workplaces produce more than ever, but their profits are melting away.\n\nOne of them will not last."
 pe.271.a:0 "Competition is healthy."
 pe.271.a.tt:0 "For three years their firms make §R30%§! less profit; planets with their firms produce §G3%§! more."
 pe.271.b:0 "Bring them to the table."
 pe.271.b.tt:0 "The price war ends after one year."
 pe.272.name:0 "A Merger"
 pe.272.desc:0 "§Y[Root.GetPeCorpA]§! has won the price war. Now it wants to take over its exhausted rival §Y[Root.GetPeCorpB]§!: all firms, all cash. The business press calls it inevitable; others warn of a monopoly."
 pe.272.a:0 "Approve the merger."
 pe.272.a.tt:0 "All firms and the cash of the weaker corporation go to the stronger one. The weaker one ceases to exist."
 pe.272.b:0 "Forbid it."
 pe.272.b.tt:0 "The weaker corporation stays independent but loses a quarter of its cash."
 pe.273.name:0 "Register of Corporations"
 pe.273.desc:0 "[Root.GetPeCorpLine1][Root.GetPeCorpLine2][Root.GetPeCorpLine3][Root.GetPeCorpLine4][Root.GetPeCorpLine5][Root.GetPeCorpLine6][Root.GetPeCorpLine7][Root.GetPeCorpLine8]"
 pe.273.a:0 "Close."
 pe.280.name:0 "A Corporate Station"
 pe.280.desc.build:0 "§Y[Root.GetPeCorpName280]§! wants to build a station of its own above §Y[pe_st_planet.GetName]§!, on a deposit we have not used yet. It pays the building itself and a concession fee of §G[Root.pe_st_pay]§! £minerals£ minerals, and every year a fifth of the value of the station.\n\nThe corporation would process the output itself and produce twice its value in its own product, on its headquarters."
 pe.280.desc.buy:0 "§Y[Root.GetPeCorpName280]§! wants to buy our station above §Y[pe_st_planet.GetName]§!. It offers §G[Root.pe_st_pay]§! £minerals£ minerals, twice the building cost, and every year a fifth of the value of the station.\n\nThe corporation would process the output itself and produce twice its value in its own product, on its headquarters."
 pe.280.a:0 "Agreed."
 pe.280.a.tt:0 "The station belongs to the corporation (held by our Private Holdings). We lose its output and get one and a half times its value as corporate production instead."
 pe.280.b:0 "The orbitals stay ours."
 pe.281.name:0 "Stock for Sale"
 pe.281.desc:0 "Our Private Holdings still have §Y[Root.pe_hs_amt]§! units of a resource we are short of in store. They offer them to us for §Y[Root.pe_hs_cost]§! £trade£, 60% of the market price."
 pe.281.a:0 "Buy."
 pe.281.a.tt:0 "We get the stock and pay the trade into the investor pool."
 pe.281.b:0 "Let them export it."
 pe_corp_fleet_name:0 "Corporate Fleet"
 pe.282.name:0 "A Fleet for the War"
 pe.282.desc:0 "§Y[Root.GetPeCorpName282]§! offers to build warships of our newest design at its own cost and lease them to us for the war: five years, for a leasing fee (a tenth of the usual upkeep), without taking naval capacity.\n\nPatriotism, says the board. Good business, say others."
 pe.282.a:0 "We accept."
 pe.282.a.tt:0 "A fleet of our biggest ship class, about a quarter of our fleet power, appears at the capital. We command it; it belongs to the corporation."
 pe.282.b:0 "We fight our own wars."
 pe.283.name:0 "The Lease Ends"
 pe.283.desc:0 "§Y[Root.GetPeCorpName283]§! wants its ships back. Instead, we could buy them: §Y[Root.pe_fl_price]§! £alloys£ alloys for the whole fleet."
 pe.283.a:0 "Buy the fleet."
 pe.283.a.tt:0 "The fleet becomes ours (normal upkeep and naval capacity from now on)."
 pe.283.b:0 "Return the ships."
 pe.284.name:0 "Hunting Rights"
 pe.284.desc:0 "Space creatures in §Y[pe_cl_sys.GetName]§! block our expansion. §Y[Root.GetPeCorpName284]§! offers a fleet to clear the system, in exchange for the loot rights: whatever can be salvaged from the creatures belongs to the corporation.\n\nWe would command the fleet until the system is clear, for three years at most."
 pe.284.a:0 "Happy hunting."
 pe.284.a.tt:0 "A fleet of about one and a half times the strength of the creatures appears at our border. Once the system is clear it returns; the corporation keeps the loot, we get some society research."
 pe.284.b:0 "We do not need mercenaries."
 pe.285.name:0 "The Hunt"
 pe.285.desc.ok:0 "§Y[pe_cl_sys.GetName]§! is clear. The corporate fleet has returned home with its loot, worth §Y[Root.pe_cl_loot]§! £trade£ to §Y[Root.GetPeCorpName285]§!. Their researchers share §G[Root.pe_cl_res]§! £society£ society research with us."
 pe.285.desc.no:0 "The contract for §Y[pe_cl_sys.GetName]§! has ended without success: the fleet is lost or its time is up. There is no loot."
 pe.285.a:0 "Noted."
 pe_charter_fleet_name:0 "Charter Survey"
 pe.286.name:0 "An Exploration Charter"
 pe.286.desc:0 "§Y[Root.GetPeCorpName286]§! wants to know what lies beyond our borders. It offers us a science ship with one of its scientists for eight years, at its own cost (we pay the usual tenth of the upkeep). In return it wants the mining rights to what it finds."
 pe.286.a:0 "Go and find something."
 pe.286.a.tt:0 "A science ship with a scientist of the corporation appears at the capital; we command it. When the charter ends, the corporation may take a station beyond the usual limit."
 pe.286.b:0 "We explore ourselves."
 pe.287.name:0 "Convoy Protection"
 pe.287.desc:0 "Pirates in §Y[pe_cv_sys.GetName]§! are attacking our trade. §Y[Root.GetPeCorpName287]§! offers a patrol fleet to clear them out, for three years at most. The corporation pays; it keeps whatever the pirates leave behind."
 pe.287.a:0 "Clear the lanes."
 pe.287.a.tt:0 "A patrol of about one and a half times the pirates’ strength appears in the system; we command it until it is free."
 pe.287.b:0 "Our navy will handle it."
 pe.288.name:0 "Convoy Protection"
 pe.288.desc.ok:0 "§Y[pe_cv_sys.GetName]§! is free of pirates. The patrol has returned; §Y[Root.GetPeCorpName288]§! counts §Y[Root.pe_cv_loot]§! £trade£ in loot and saved trade."
 pe.288.desc.no:0 "The patrol contract for §Y[pe_cv_sys.GetName]§! has ended without success."
 pe.288.a:0 "Noted."
 pe.289.name:0 "Salvage Rights"
 pe.289.desc:0 "Wrecks from our battles are drifting in space: §Y[Root.pe_db_n]§! fields. §Y[Root.GetPeCorpName289]§! offers to salvage them all at once. We would get §G[Root.pe_db_alloys]§! £alloys£ alloys and §G[Root.pe_db_res]§! £engineering£ engineering research now; the corporation keeps the rest.\n\nOur own science ships could study the wrecks instead, slowly."
 pe.289.a:0 "Sell the salvage rights."
 pe.289.a.tt:0 "The debris projects go to the corporation (our Private Holdings)."
 pe.289.b:0 "We study them ourselves."
 pe.291.name:0 "A Gift from Private Hands"
 pe.291.desc.sci:0 "We have lost a science ship, or have hardly any left. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has a new one built and donates it to the state: §Y[Root.pe_pat_spend]§! £trade£ well spent, says the magnate, for the knowledge of us all."
 pe.291.desc.con:0 "We have lost a construction ship, or have hardly any left. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has a new one built and donates it to the state: §Y[Root.pe_pat_spend]§! £trade£, so that our space keeps growing."
 pe.291.a:0 "A generous gift."
 pe.291.a.tt:0 "A new ship of our design appears at the capital; it is ours."
 pe.291.b:0 "We do not need charity."
 pe.292.name:0 "A Corporate Dyson Swarm"
 pe.292.desc:0 "§Y[Root.GetPeCorpName292]§! wants to build a Dyson swarm of its own around §Y[pe_sw_star.GetName]§!, paid entirely from its own cash. The swarm would belong to the corporation and harvest the star itself, and the corporation would turn its output into more of its own product."
 pe.292.a:0 "Let them build."
 pe.292.a.tt:0 "A Dyson swarm (stage I) of the corporation at the star. Like any swarm it replaces the station at the star (ours is dismantled and paid for) and yields six times the star's deposit; the corporation produces one and a half times that value in its own product. It pays the upkeep (alloys) and upgrades the swarm when it can pay (up to stage III, never a Dyson sphere)."
 pe.292.b:0 "Megastructures are the state’s business."
 pe_msg_charter_end:0 "The exploration charter of §Y$CORP$§! has ended; its ship has returned. The corporation now holds the mining rights to what it found."
 pe_msg_corp_swarm:0 "§Y$CORP$§! has built a Dyson swarm of its own at $PLANET$. The swarm harvests the star for the corporation."
 pe_msg_charter_end_anon:0 "An exploration charter has ended; the leased science ship has returned to its corporation."
 pe_msg_corp_swarm_up:0 "§Y$CORP$§! is upgrading its Dyson swarm at $PLANET$, from its own cash."
 pe.293.name:0 "A Corporate Arc Furnace"
 pe.293.desc:0 "§Y[Root.GetPeCorpName293]§! wants to build an arc furnace of its own over §Y[pe_af_p.GetName]§!, paid entirely from its own cash. Every body of the system would get a furnace deposit. Where there was no deposit before, the corporation would put up stations of its own; the bodies with deposits remain ours, and our stations there would profit from the furnace as well."
 pe.293.a:0 "Let them build."
 pe.293.a.tt:0 "An arc furnace (stage I) of the corporation over the planet; a station of ours there is dismantled and paid for. Every body of the system gets the furnace deposit and the station bonus. Bodies without a deposit before get a station of the corporation (held by our Private Holdings); the corporation produces one and a half times their value in its own product. It chooses the smelting process (industry alloys, raw materials minerals), pays the upkeep (energy) and upgrades the furnace when it can pay."
 pe.293.b:0 "Megastructures are the business of the state."
 pe_msg_corp_furnace:0 "§Y$CORP$§! has built an arc furnace of its own over $PLANET$. Its stations work the bodies of the system that had no deposit; ours profit from the furnace too."
 pe_msg_corp_furnace_up:0 "§Y$CORP$§! is upgrading its arc furnace over $PLANET$, from its own cash."
 pe_msg_deal_end:0 "The supply deal with a private firm has run its two years and ended."
 pe_msg_deal_broken:0 "The supply deal with a private firm has ended early: we no longer have enough of the good we pay with."
 pe.294.name:0 "Help from Above"
 pe.294.desc:0 "§Y[pe_df_planet.GetName]§! is being bombarded from orbit. §Y[Root.GetPeCorpName294]§! offers to send a fleet of its own at once: built at its own expense, crewed by its own people, under our command until the danger is over.\n\nThe board does not do this out of patriotism. It wants something big in return."
 pe.294.a:0 "The independent firms on the planet join you."
 pe.294.a.tt:0 "The §Y[Root.pe_df_ind]§! independent private firms on [pe_df_planet.GetName] become part of the corporation: their profits go to it instead of the investors. The fleet comes at once."
 pe.294.b:0 "We pay [Root.pe_df_alloys] alloys."
 pe.294.b.tt:0 "We pay §R[Root.pe_df_alloys]§! £alloys£ alloys; the fleet comes at once."
 pe.294.c:0 "We grant concessions."
 pe.294.c.tt:0 "Licences, contracts, a word in the right ear: §R150§! £influence£ influence. The fleet comes at once."
 pe.294.d:0 "Haggle."
 pe.294.d.tt:0 "They might settle for half the alloys, or leave us to it."
 pe.294.e:0 "We will defend ourselves."
 pe.295.name:0 "Hard Bargaining"
 pe.295.desc.ok:0 "The board grumbles, but a bombarded planet is bad for business too: §Y[Root.GetPeCorpName295]§! sends its fleet for §R[Root.pe_df_half]§! £alloys£ alloys."
 pe.295.desc.no:0 ""We are offering to save your planet, and you want a discount?" The delegation of §Y[Root.GetPeCorpName295]§! leaves. The planet is on its own."
 pe.295.a:0 "Agreed."
 pe.295.a.tt:0 "We pay §R[Root.pe_df_half]§! £alloys£ alloys; the fleet comes at once."
 pe.295.b:0 "So be it."
 pe_msg_defence_start:0 "A fleet of §Y$CORP$§! has arrived at $PLANET$ to end the bombardment. It is under our command until the danger is over."
 pe_msg_defence_end:0 "The fleet of §Y$CORP$§! has secured $PLANET$ and withdrawn."
 pe_msg_defence_lost:0 "The fleet of §Y$CORP$§! at $PLANET$ has been destroyed."
 pe_msg_defence_hq:0 "§Y$CORP$§! defends its headquarters: a fleet of the corporation has arrived at $PLANET$, free of charge, under our command until the danger is over."
 pe.296.name:0 "Rebuilding"
 pe.296.desc:0 "The bombardment of §Y[pe_rb_planet.GetName]§! is over. Among the ruins lies what is left of a private firm; its owners want to rebuild, but their capital went up in flames. They ask for a subsidy of §Y[Root.pe_rb_sub]§! £trade£; the investors would lend the rest."
 pe.296.a:0 "Help them rebuild."
 pe.296.a.tt:0 "We pay §R[Root.pe_rb_sub]§! £trade£. The ruins become a construction site of the old firm."
 pe.296.b:0 "The ruins can wait."
 pe_msg_corp_rebuild:0 "§Y$CORP$§! is rebuilding its destroyed firm on $PLANET$ from its own cash."
