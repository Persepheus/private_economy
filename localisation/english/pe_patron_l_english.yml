l_english:
 pe_mag_rep_high:0 "well regarded"
 pe_mag_rep_mixed:0 "divisive"
 pe_mag_rep_low:0 "notorious"
 pe.200.name:0 "The Gala of the Century"
 pe.200.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), one of the richest people in the empire, has rented the grand orbital ballroom above §Y[pe_pat_planet.GetName]§!. For three nights the elite of business, art and politics will dance, dine and, above all, be seen.\n\nThe bill: §Y[Root.pe_pat_spend]§! £trade£ from private capital. The newsfeeds are already debating whether this is a celebration of our prosperity or an insult to everyone who has to work tomorrow."
 pe.200.a:0 "Let them celebrate. Prosperity is something to show."
 pe.200.b:0 "Denounce the decadence publicly."
 pe.200.c:0 "A luxury tax on such festivities seems only fair."
 pe.201.name:0 "Scandal at the Gala"
 pe.201.desc:0 "Months after the gala, recordings have surfaced: senior officials, generous "gifts" and a contract for the capital's transit network. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) denies everything, but the public wants answers."
 pe.201.a:0 "Make it go away quietly. (150 £trade£)"
 pe.201.b:0 "Let the investigators do their work."
 pe.202.name:0 "A Foundation for Science"
 pe.202.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has announced the largest private research foundation in our history and is putting §Y[Root.pe_pat_spend]§! £trade£ into it. Laboratories, grants, prizes for daring ideas: the scientific community is jubilant.\n\nThe only question is who decides what gets researched."
 pe.202.a:0 "Free research: the foundation follows its own curiosity."
 pe.202.b:0 "Guidelines: physics."
 pe.202.c:0 "Guidelines: society."
 pe.202.d:0 "Guidelines: engineering."
 pe.203.name:0 "The Prototype"
 pe.203.desc:0 "In a hangar on §Y[pe_pat_planet.GetName]§!, engineers backed by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) have built something nobody asked them to build: a prototype that, if it works, will leave the state laboratories looking old. §Y[Root.pe_pat_spend]§! £trade£ of private capital is riding on it.\n\nThe test is scheduled. Our safety inspectors are nervous."
 pe.203.a:0 "It is their money and their risk."
 pe.203.b:0 "Back it with state engineers and materials. (250 £alloys£)"
 pe.206.name:0 "The Prototype Test"
 pe.206.desc.success:0 "The test was a complete success. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is celebrated as a visionary, and our engineers are studying the results with barely concealed envy."
 pe.206.desc.partial:0 "The prototype worked, more or less. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) speaks of "valuable insights"; our engineers find a few of them actually useful."
 pe.206.desc.failure:0 "A flash, a pressure wave, then silence. The hangar is gone, and the district around it needs months to recover. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) speaks of a "regrettable setback"."
 pe.206.a:0 "So it goes with progress."
 pe.204.name:0 "A Helping Hand"
 pe.204.desc:0 "§Y[pe_pat_planet.GetName]§! is struggling: too little housing, too few places to unwind. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has offered to help with §Y[Root.pe_pat_spend]§! £trade£ of private money: emergency housing, parks, community centres.\n\nSome call it generosity. Others say the magnate is buying the hearts of the people."
 pe.204.a:0 "Accept the help with thanks."
 pe.204.b:0 "The state looks after its own citizens."
 pe.205.name:0 "Recruitment Campaign"
 pe.205.desc:0 "The private firms on §Y[pe_pat_planet.GetName]§! cannot find enough workers. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) proposes a campaign across the empire: posters, relocation bonuses, promises of a better life on §Y[pe_pat_planet.GetName]§!.\n\nIt will draw idle citizens from other worlds. With state support, it would draw many more."
 pe.205.a:0 "The state co-finances the campaign. (150 £trade£)"
 pe.205.b:0 "Let the firms run it themselves."
 pe.205.c:0 "We will not have our citizens lured away."
 pe_gala:0 "Afterglow of the Gala"
 pe_gala_desc:0 "The whole planet is still talking about the gala."
 pe_gala_scandal:0 "Gala Scandal"
 pe_gala_scandal_desc:0 "Investigations into the gala keep the planet in suspense."
 pe_prototype_accident:0 "Prototype Accident"
 pe_prototype_accident_desc:0 "A private prototype exploded here."
 pe_charity:0 "Private Charity"
 pe_charity_desc:0 "Emergency housing and community centres paid for by a private patron."
 pe_charity_mistrust:0 "Mistrust of the Patron"
 pe_charity_mistrust_desc:0 "Who is this patron, and what do they want in return?"
 pe_recruit_strong:0 "Recruitment Campaign"
 pe_recruit_strong_desc:0 "State and firms are luring workers from other worlds."
 pe_recruit_weak:0 "Private Recruitment"
 pe_recruit_weak_desc:0 "The private firms here are recruiting workers from other worlds."
 pe_recruit_refused:0 "Recruitment Forbidden"
 pe_recruit_refused_desc:0 "The firms resent that the state forbade their recruitment campaign."
 pe_magnate_1:0 "Aurelio Vance"
 pe_magnate_2:0 "Selene Okoro-Thal"
 pe_magnate_3:0 "Darius Venn"
 pe_magnate_4:0 "Mira Castellane"
 pe_magnate_5:0 "Oren Halvorsen"
 pe_magnate_6:0 "Ysolde Kade"
 pe_magnate_7:0 "Tarek Ibarra"
 pe_magnate_8:0 "Lyra Whitcombe"
 pe_magnate_9:0 "Cassian Moreau"
 pe_magnate_10:0 "Nadia Prax"
 pe_magnate_11:0 "Halden Sterling"
 pe_magnate_12:0 "Imara Quell"
 pe_magnate_13:0 "Rafe Dunmore"
 pe_magnate_14:0 "Vesna Arkwright"
 pe_magnate_15:0 "Jorin Tal"
 pe_magnate_16:0 "Elodie Marchetti"
 pe.210.desc.miner:0 "The private mines on §Y[pe_pat_planet.GetName]§! cannot fill their jobs. The firms, led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), propose overtime: extra shifts for the miners who are there, for considerably better wages, paid with §Y[Root.pe_pat_spend]§! £trade£ from private capital.\n\nProduction would rise for years. The workers would be tired, and it would show."
 pe.212.desc.miner:0 "Without enough miners, half the mines on §Y[pe_pat_planet.GetName]§! stand idle. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has found a lessor: automated rigs and harvesters, maintenance included, for five years. The firms pay §Y[Root.pe_pat_spend]§! £trade£; the machines need no state energy."
 pe.210.desc.technician:0 "The private power plants on §Y[pe_pat_planet.GetName]§! cannot fill their jobs. The firms, led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), propose overtime: extra shifts for the technicians who are there, for considerably better wages, paid with §Y[Root.pe_pat_spend]§! £trade£ from private capital.\n\nProduction would rise for years. The workers would be tired, and it would show."
 pe.212.desc.technician:0 "Without enough technicians, half the power plants on §Y[pe_pat_planet.GetName]§! stand idle. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has found a lessor: automated rigs and harvesters, maintenance included, for five years. The firms pay §Y[Root.pe_pat_spend]§! £trade£; the machines need no state energy."
 pe.210.desc.farmer:0 "The private farms on §Y[pe_pat_planet.GetName]§! cannot fill their jobs. The firms, led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]), propose overtime: extra shifts for the farmers who are there, for considerably better wages, paid with §Y[Root.pe_pat_spend]§! £trade£ from private capital.\n\nProduction would rise for years. The workers would be tired, and it would show."
 pe.212.desc.farmer:0 "Without enough farmers, half the farms on §Y[pe_pat_planet.GetName]§! stand idle. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has found a lessor: automated rigs and harvesters, maintenance included, for five years. The firms pay §Y[Root.pe_pat_spend]§! £trade£; the machines need no state energy."
 pe.210.name:0 "Overtime for Better Wages"
 pe.210.a:0 "Agree to the extra shifts."
 pe.210.b:0 "Our workers are not cattle."
 pe.211.name:0 "Guest Workers"
 pe.211.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has struck a deal: several hundred §Y[pe_gw_species.GetNamePlural]§! from a neighbouring empire are willing to come to §Y[pe_pat_planet.GetName]§! and take the empty jobs. The firms pay the journey with §Y[Root.pe_pat_spend]§! £trade£; the state would have to issue the papers.\n\nNot everyone will welcome strangers in the canteens."
 pe.211.a:0 "Issue the papers. (100 £trade£)"
 pe.211.b:0 "We will manage with our own people."
 pe.212.name:0 "Machine Leasing"
 pe.212.a:0 "Lease the machines."
 pe.212.b:0 "We do not want foreign machines on our soil."
 pe.213.name:0 "Strike!"
 pe.213.desc:0 "The workers of the private firms on §Y[pe_pat_planet.GetName]§! have laid down their tools. Too much work, too few hands, wages that do not keep up. The firms around §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offer a raise from private capital (§Y[Root.pe_pat_spend]§! £trade£)."
 pe.213.a:0 "The firms pay the raise."
 pe.213.b:0 "Let it run its course."
 pe.213.c:0 "Send in security forces."
 pe.214.name:0 "A Prospecting Find"
 pe.214.desc:0 "Prospectors financed by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) have found a rich deposit on §Y[pe_pat_planet.GetName]§!. They have already spent §Y[Root.pe_pat_spend]§! £trade£ and would like to mine it themselves."
 pe.214.a:0 "It is their find: let them mine it."
 pe.214.b:0 "Such deposits belong to the state."
 pe.214.c:0 "Place the site under protection."
 pe.215.name:0 "Hydroponics Start-up"
 pe.215.desc:0 "Food is running short. A start-up backed by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to build vertical farms in the towers of §Y[pe_pat_planet.GetName]§!: food without fields and without farmers. Cost to the investors: §Y[Root.pe_pat_spend]§! £trade£. The farms would run for ten years and need some energy."
 pe.215.a:0 "Build the towers."
 pe.215.b:0 "Food comes from fields."
 pe.220.name:0 "Patron of the Arts"
 pe.220.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to be remembered not only for wealth: museums, theatres and a monument on the capital, paid with §Y[Root.pe_pat_spend]§! £trade£. The question is whether art should be free or serve the state."
 pe.220.a:0 "Let the artists be free."
 pe.220.b:0 "Art should celebrate our nation."
 pe.221.name:0 "The League"
 pe.221.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is founding an interstellar sports league: stadiums on several worlds, teams, broadcasts. §Y[Root.pe_pat_spend]§! £trade£ are already committed. The state could let the league grow freely or auction the broadcasting rights."
 pe.221.a:0 "Let the games begin!"
 pe.221.b:0 "Auction the broadcasting rights."
 pe.222.name:0 "Party Donations"
 pe.222.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offers generous donations to "parties that understand the economy". §Y[Root.pe_pat_spend]§! £trade£, no strings attached, of course."
 pe.222.a:0 "Accept the donations."
 pe.222.b:0 "Ban such donations."
 pe.222.c:0 "Make the offer public."
 pe.223.name:0 "Private Colonists"
 pe.223.desc:0 "A consortium led by §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) wants to found a colony on §Y[pe_pat_colony.GetName]§! at its own expense: ships, equipment and settlers paid with §Y[Root.pe_pat_spend]§! £trade£. The colony would be ours."
 pe.223.a:0 "May they prosper out there."
 pe.223.b:0 "Colonisation is a matter for the state."
 pe.224.name:0 "A University"
 pe.224.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) is founding a university on the capital and puts §Y[Root.pe_pat_spend]§! £trade£ into it. Open to everyone, or an academy for the very best?"
 pe.224.a:0 "Open to everyone."
 pe.224.b:0 "An elite academy."
 pe.225.name:0 "Space Tourism"
 pe.225.desc:0 "§Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) has bought cruise liners: tours to the wonders of our empire, starting on §Y[pe_pat_planet.GetName]§!. §Y[Root.pe_pat_spend]§! £trade£ have been invested; the state only has to permit the routes."
 pe.225.a:0 "Open the routes."
 pe.225.b:0 "No tourists in our skies."
 pe.226.name:0 "Disaster Relief"
 pe.226.desc:0 "§Y[pe_pat_planet.GetName]§! is in crisis. §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) offers immediate help: supplies, shelters, rebuilding, worth §Y[Root.pe_pat_spend]§! £trade£. "In times like these, profits can wait," the magnate says, and the firms would take only half their profit share for two years."
 pe.226.a:0 "Accept the help gratefully."
 pe.226.b:0 "The state will handle it."
 pe.227.name:0 "Betting Scandal"
 pe.227.desc:0 "Matches of the league were fixed, and the trail leads to people close to §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]). The fans are furious."
 pe.227.a:0 "Settle it quietly. (100 £trade£)"
 pe.227.b:0 "Let the scandal play out."
 pe.228.name:0 "Tourist Accident"
 pe.228.desc:0 "A cruise liner of §Y[Root.GetPeMagnate]§! ([Root.GetPeMagRep]) got too close to a stellar phenomenon. Not everyone came back. The empire mourns."
 pe.228.a:0 "A dark day."
 d_pe_hydroponics:0 "Hydroponic Towers"
 d_pe_hydroponics_desc:0 "Private vertical farms. They produce food without farmers and need some energy."
 pe_overtime_miner:0 "Overtime in the Mines"
 pe_overtime_miner_desc:0 "Extra shifts for better wages."
 pe_overtime_technician:0 "Overtime in the Power Plants"
 pe_overtime_technician_desc:0 "Extra shifts for better wages."
 pe_overtime_farmer:0 "Overtime on the Farms"
 pe_overtime_farmer_desc:0 "Extra shifts for better wages."
 pe_guest_unrest:0 "Resentment of Guest Workers"
 pe_guest_unrest_desc:0 "Not everyone likes strangers in the canteens."
 pe_leasing_miner:0 "Leased Mining Rigs"
 pe_leasing_miner_desc:0 "Automated machines leased by the private firms, maintenance included."
 pe_leasing_technician:0 "Leased Power Equipment"
 pe_leasing_technician_desc:0 "Automated machines leased by the private firms, maintenance included."
 pe_leasing_farmer:0 "Leased Harvesters"
 pe_leasing_farmer_desc:0 "Automated machines leased by the private firms, maintenance included."
 pe_strike:0 "Strike"
 pe_strike_desc:0 "The workers of the private firms have laid down their tools."
 pe_strike_crushed:0 "Strike Crushed"
 pe_strike_crushed_desc:0 "Security forces broke the strike. People remember."
 pe_strike_crushed_mild:0 "Strike Ended by Force"
 pe_strike_crushed_mild_desc:0 "Security forces ended the strike."
 pe_business_upset:0 "Business Upset"
 pe_business_upset_desc:0 "The private economy feels mistreated by the state."
 pe_art:0 "Flourishing Arts"
 pe_art_desc:0 "Museums, theatres and a new monument, paid by a patron."
 pe_league:0 "Sports League"
 pe_league_desc:0 "A stadium of the interstellar league."
 pe_bet_scandal:0 "Betting Scandal"
 pe_bet_scandal_desc:0 "Fixed matches, furious fans."
 pe_corruption:0 "Party Donations"
 pe_corruption_desc:0 "Private money in politics."
 pe_university:0 "Private University"
 pe_university_desc:0 "A university founded by a patron, open to everyone."
 pe_elite_academy:0 "Elite Academy"
 pe_elite_academy_desc:0 "An academy for the very best. Not everyone thinks it is fair."
 pe_tourism:0 "Space Tourism"
 pe_tourism_desc:0 "Cruise liners bring visitors and money."
 pe_tourism_accident:0 "Mourning"
 pe_tourism_accident_desc:0 "The empire mourns the victims of a tourist accident."
 pe_relief:0 "Disaster Relief"
 pe_relief_desc:0 "Private help in a time of crisis."
