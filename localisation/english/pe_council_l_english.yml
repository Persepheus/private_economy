 pe.336.name:0 "Corporate Council"
 pe.336.desc:0 "The boards of our corporations have gathered in the meeting hall of the Private Holdings. Which board shall we speak with?\n\n[Root.GetPeCorpLine1][Root.GetPeCorpLine2][Root.GetPeCorpLine3][Root.GetPeCorpLine4][Root.GetPeCorpLine5][Root.GetPeCorpLine6][Root.GetPeCorpLine7][Root.GetPeCorpLine8]"
 pe.336.k1:0 "[Root.GetPeCorpN1] ([Root.GetPeCorpKind1][Root.GetPeCorpProf1])"
 pe.336.k2:0 "[Root.GetPeCorpN2] ([Root.GetPeCorpKind2][Root.GetPeCorpProf2])"
 pe.336.k3:0 "[Root.GetPeCorpN3] ([Root.GetPeCorpKind3][Root.GetPeCorpProf3])"
 pe.336.k4:0 "[Root.GetPeCorpN4] ([Root.GetPeCorpKind4][Root.GetPeCorpProf4])"
 pe.336.k5:0 "[Root.GetPeCorpN5] ([Root.GetPeCorpKind5][Root.GetPeCorpProf5])"
 pe.336.k6:0 "[Root.GetPeCorpN6] ([Root.GetPeCorpKind6][Root.GetPeCorpProf6])"
 pe.336.k7:0 "[Root.GetPeCorpN7] ([Root.GetPeCorpKind7][Root.GetPeCorpProf7])"
 pe.336.k8:0 "[Root.GetPeCorpN8] ([Root.GetPeCorpKind8][Root.GetPeCorpProf8])"
 pe.336.z:0 "Close the session."
 pe.337.name:0 "[Root.GetPeCorpName]"
 pe.337.desc.1:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine1]"
 pe.337.desc.2:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine2]"
 pe.337.desc.3:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine3]"
 pe.337.desc.4:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine4]"
 pe.337.desc.5:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine5]"
 pe.337.desc.6:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine6]"
 pe.337.desc.7:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine7]"
 pe.337.desc.8:0 "§Y[Root.GetPeCorpCeo]§!, chief executive of §Y[Root.GetPeCorpName]§!, receives our delegation.\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\n[Root.GetPeCorpLine8]"
 pe.337.p:0 "What kind of company do you run?"
 pe.337.dc:0 "Discuss a defence contract."
 pe.337.dc.tt:0 "The corporation presents its offer: §Y[Root.pe_dlg_dcs]%§! of our fleet upkeep, paid from its cash."
 pe.337.dc.busy:0 "We already have a defence contract with §Y[Root.GetPeCorpName308]§!."
 pe.337.dc.cash:0 "The corporation needs at least 5000 £trade£ in cash (now [Root.pe_dlg_cashr])."
 pe.337.dc.cut:0 "We ended our defence contract with this corporation. It will not negotiate with us for now."
 pe.337.dx:0 "End the defence contract."
 pe.337.dx.tt:0 "The corporation no longer carries any of our fleet upkeep. Arms orders and the arms centre end with the next quarter. For a while it will not negotiate with us: a defence or family corporation for ten years, a solid house for three, any other for five."
 pe.337.wl:0 "Lease ships for the war."
 pe.337.wl.tt:0 "The corporation presents its lease offer."
 pe.337.wl.run:0 "We already lease a corporate fleet."
 pe.337.wl.cash:0 "An industrial corporation needs at least 600 £trade£ in cash, any other 1200 (now [Root.pe_dlg_cashr])."
 pe.337.a:0 "Discuss a tender."
 pe.337.a.tt:0 "State tenders arrive in one of the next versions."
 pe.337.b:0 "Back to the council."
 pe.337.z:0 "Goodbye."
 pe.338.desc.1:0 "§Y[Root.GetPeCorpCeo]§!: \"Steel for your fleets, goods for your citizens. We build what holds this empire together.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\nSteel mills and consumer goods factories. An industrial corporation with at least 5000 £trade£ in cash can sign a §Ydefence contract§!: it carries 10% of our fleet upkeep (20% from 15,000 £trade£), its steel mills get arms orders, and its headquarters become an arms centre. At war it leases us fleets from as little as 600 £trade£ in cash.[Root.GetPeDlgProfText]\n\n§HAll corporations§!\nFrom 3000 £trade£ in cash they pay their staff benefits. Rich corporations build citadels, habitats, stations and specialisation buildings they lease to us."
 pe.338.desc.2:0 "§Y[Root.GetPeCorpCeo]§!: \"Trade is trust. And trust is a business that pays.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\nTrade houses and entertainment. Its firms bring trade and amenities, its stations process raw materials into its product. At war it leases us fleets once it has 1200 £trade£ in cash.[Root.GetPeDlgProfText]\n\n§HAll corporations§!\nFrom 3000 £trade£ in cash they pay their staff benefits. Rich corporations build citadels, habitats, stations and specialisation buildings they lease to us."
 pe.338.desc.3:0 "§Y[Root.GetPeCorpCeo]§!: \"Every discovery is a market that did not exist yesterday.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\nLaboratories and media houses: research and unity. A rich corporation runs a research institute of its field at its headquarters. At war it leases us fleets once it has 1200 £trade£ in cash.[Root.GetPeDlgProfText]\n\n§HAll corporations§!\nFrom 3000 £trade£ in cash they pay their staff benefits. Rich corporations build citadels, habitats, stations and specialisation buildings they lease to us."
 pe.338.desc.4:0 "§Y[Root.GetPeCorpCeo]§!: \"Under every rock lies a contract nobody has signed yet.\"\n\n§H[Root.GetPeDlgKind][Root.GetPeDlgProfC]§!: main product [Root.GetPeDlgProd], headquarters [Root.GetPeDlgHq]\n\nMines, power plants and farms. It builds orbital stations on unused deposits and automates its firms at its own expense when workers are missing. At war it leases us fleets once it has 1200 £trade£ in cash.[Root.GetPeDlgProfText]\n\n§HAll corporations§!\nFrom 3000 £trade£ in cash they pay their staff benefits. Rich corporations build citadels, habitats, stations and specialisation buildings they lease to us."
 pe.338.a:0 "Back to the conversation."
 pe.339.desc:0 "§Y[Root.GetPeCorpCeo]§! takes the notice in silence and slides the contract back across the table. \"We delivered what we promised. Our works will find other customers.\"\n\nThe defence contract with §Y[Root.GetPeCorpName]§! has ended."
