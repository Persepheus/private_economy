 d_pe_hq_1:0 "Headquarters: Kessler-Orin Heavy Industries"
 d_pe_hq_1_desc:0 "The corporation Kessler-Orin Heavy Industries has its headquarters here.\n\n§HCorporate production§!\nThe corporation owns orbital stations and Dyson swarms, held by our Private Holdings. It built the stations on deposits we did not use, or bought them from us. It processes their output itself and delivers us here, every month, one and a half times their value (at base prices) in its own product: the resource above. More stations or a bigger swarm mean more corporate production.\n\nThe planet decision §YRegister of Firms§! shows each corporation's stations and production."
