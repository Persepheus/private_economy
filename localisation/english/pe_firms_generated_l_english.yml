 pe_deposit_cat_sites:0 "Private Construction"
 d_pe_site_city:0 "Private Construction Site"
 d_pe_site_city_desc:0 "Investors are building or converting a private firm here. It occupies a district slot until it opens."
 d_pe_site_mining:0 "Private Construction Site"
 d_pe_site_mining_desc:0 "Investors are building or converting a private firm here. It occupies a district slot and one mining district until it opens."
 d_pe_site_generator:0 "Private Construction Site"
 d_pe_site_generator_desc:0 "Investors are building or converting a private firm here. It occupies a district slot and one generator district until it opens."
 d_pe_site_farming:0 "Private Construction Site"
 d_pe_site_farming_desc:0 "Investors are building or converting a private firm here. It occupies a district slot and one farming district until it opens."
 pe_deposit_cat_automation:0 "Private Automation"
 pe_deposit_cat_ledger:0 "Private Economy"
 pe_msg_relocate:0 "§Y$FIRM$§! has moved from $PLANET$ to $DEST$, whose designation suits it better. Its workers came along."
 pe_msg_relocate_need:0 "§Y$FIRM$§! has moved from $PLANET$, which lacks housing or amenities, to $DEST$. Its workers came along."
 pe_msg_site_cancel:0 "Investors have given up a construction site on $PLANET$: for two years there were no workers for the new firm. They got their down payment back."
 pe_private_dividends:0 "Dividends"
 d_pe_ledger_dividend:0 "State Shareholdings"
 d_pe_ledger_dividend_desc:0 "Shares the state bought in private corporations; they pay dividends every month."
 pe_private_profits:0 "Profit Payouts to Private Firms"
 pe_private_savings:0 "Private Savings"
 d_pe_ledger_profit:0 "Profit Payout to Private Firms"
 d_pe_ledger_profit_desc:0 "§HAn expense of the state.§! The private firms on this planet deliver everything they produce to the empire, just like state jobs. In return the state pays them their profit share every month, in trade: a part of the value their jobs create, by economic order (Guided 15%, Mixed 20%, Free Market 25%, Laissez-faire 35%), minus their running costs. With it the firms grow and new ones are founded.\n\nProfits and savings together cost at most 40% of the gross trade income; what the state does not pay, the firms do not get either."
 d_pe_ledger_savings:0 "Private Savings"
 d_pe_ledger_savings_desc:0 "§HAn expense of the state.§! Every month a part of our trade income flows into the investor pool as private savings, by economic order (Guided 5%, Mixed 10%, Free Market 15%, Laissez-faire 20%). From the pool investors found new firms and buy state districts."
 pe_msg_conq_hq_lost:0 "With $PLANET$ we have lost the headquarters of §Y$CORP$§!. The corporation leaves our economy; its firms here are independent now, its stations and megastructures are ours."
 pe_msg_conq_hq_gained:0 "With $PLANET$ the corporation §Y$CORP$§! has come under our rule: its headquarters and its firms there are part of our economy now."
 pe_msg_conq_corp_gone:0 "§Y$CORP$§! has its headquarters on $PLANET$, which is ours now, but our economy has no room for it: the corporation is dissolved, its firms are independent."
 pe_msg_firm_ruined:0 "A private firm on $PLANET$ has been destroyed by the bombardment. Its ruins block the district slot until they are cleared or rebuilt."
 d_pe_ruins:0 "Ruins of a Private Firm"
 d_pe_ruins_desc:0 "What the bombardment left of a private firm. The ruins block a district slot. They can be cleared, or rebuilt: by the firm's corporation from its cash, otherwise with a subsidy from us."
 pe_deposit_cat_ruins:0 "Ruins"
 pe_supply_deal:0 "Supply Deal with a Private Firm"
 d_pe_supply_deal:0 "Supply Deal"
 d_pe_supply_deal_desc:0 "A private firm delivers us this good every month for two years and takes another one in return, of which we had plenty (event §YA Special Deal§!). The deal ends early if we run out of the good we pay with."
 d_pe_auto_miner_1:0 "Private Automation (Mining) I"
 d_pe_auto_miner_1_desc:0 "The private firms here have automated part of their work: 25% of their $job_pe_private_miner_plural$ jobs need no pops. The firms pay for it from their own capital."
 pe_msg_auto_miner_1:0 "Lacking workers, the private firms on $PLANET$ have invested in §YPrivate Automation (Mining) I§!."
 d_pe_auto_miner_2:0 "Private Automation (Mining) II"
