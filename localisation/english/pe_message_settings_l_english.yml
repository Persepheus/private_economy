l_english:
 decision_pe_message_settings:0 "Private Economy: Message settings"
 decision_pe_message_settings_desc:0 "Choose which Private Economy notifications and information windows you want to receive. Applies throughout your empire; change settings freely at any time."
 pe_settings.1.name:0 "Messages: Firms and economy (1/2)"
 pe_settings.2.name:0 "Messages: Projects and empire (2/2)"
 pe_settings.desc:0 "§GOn§! / §RMuted§! shows the current state. Click a category to toggle it. Changes apply immediately to future notifications throughout your empire and are saved with the game.\n\n§YActual decisions and offers remain visible.§! Economic activity, costs, rewards and negative consequences continue even when messages are muted. Existing notifications are not removed.\n\nDefault: everything on. General Stellaris message settings still apply."
 pe_settings_all_on:0 "Enable all messages (default)"
 pe_settings_all_off:0 "Mute all messages"
 pe_settings_all_tip:0 "Applies to all categories on both pages. Events with choices remain visible."
 pe_settings_page_1:0 "Back: Firms and economy (1/2)"
 pe_settings_page_2:0 "Next: Projects and empire (2/2)"
 pe_settings_close:0 "Close"
 pe_settings_firms_on:0 "£pe_message_firms£ §GOn§!: Firm development"
