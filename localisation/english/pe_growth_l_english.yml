l_english:
 pe.332.name:0 "Two Firms Want to Merge"
 pe.332.desc:0 "On §Y[pe_mg_planet.GetName]§! two firms of the same trade want to merge. Both have the money for their next expansion, but the planet lacks the workers for it.\n\nTogether they become one firm a stage larger, with the money of both. The new firm has fewer jobs than the two had together, and a district slot becomes free. The workers it frees can let other firms here grow."
 pe.332.a:0 "Agree"
 pe.332.a.tt:0 "The richer of the two firms takes over the other and grows by a stage. A district slot becomes free."
 pe.332.b:0 "Object"
 pe.332.b.tt:0 "The two firms stay apart and do not ask again for five years."
 pe_msg_merge:0 "Two firms of the same trade on $PLANET$ have merged: the new firm is a stage larger and has the money of both. It has fewer jobs than the two before, and a district slot has become free."
 pe.333.name:0 "A Corporation Wants to Build"
 pe.333.desc.all:0 "§Y[Root.GetPeCorpName333]§! wants to build a §Y[Root.GetPeSpbBuilding]§! on §Y[pe_spb_planet.GetName]§!, [Root.GetPeSpbPlace]. The private firms there would produce more with it, and all workers of its kind benefit.\n\nThe corporation pays for the construction. We lease the building for ten years at §Y[Root.pe_spb_rent]§! £trade£ trade a month (its cost plus a 20% margin); then it is ours. The planet decision Pay Off Lease ends the lease earlier at its remaining value."
 pe.333.desc.rest:0 "§Y[Root.GetPeCorpName333]§! wants to build a §Y[Root.GetPeSpbBuilding]§! on §Y[pe_spb_planet.GetName]§!, [Root.GetPeSpbPlace]. For the corporation the building alone is worth it, the rest is not.\n\nIf we pay the rest ourselves (§Y[Root.pe_spb_rest]§! £minerals£ minerals), the corporation builds the building and leases it to us for ten years at §Y[Root.pe_spb_rent]§! £trade£ trade a month (its cost plus a 20% margin). Then it is ours."
 pe.333.a:0 "Accept"
 pe.333.a.tt:0 "The corporation builds. We pay the lease for ten years as the budget line Lease of Corporate Buildings."
 pe.333.c:0 "We pay for the specialisation (1000 minerals)"
 pe.333.c.tt:0 "We pay for the specialisation; the corporation builds the building and leases it to us for ten years."
 pe.333.d:0 "We pay for district and specialisation (1300 minerals)"
 pe.333.d.tt:0 "We pay for the district and the specialisation; the corporation builds the building and leases it to us for ten years."
 pe.333.b:0 "Refuse"
 pe.333.b.tt:0 "No corporation asks again for this building on this planet for five years."
 pe_spb_b_1:0 "$building_mineral_purification_plant$"
 pe_spb_b_2:0 "$building_energy_grid$"
 pe_spb_b_3:0 "$building_food_processing_facility$"
 pe_spb_place_1:0 "in the existing specialisation"
 pe_spb_place_2:0 "with a new specialisation in our district"
 pe_spb_place_3:0 "with a new district and its specialisation"
 pe.334.name:0 "Pay Off Lease"
 pe.334.desc:0 "The lease of the corporate buildings on §Y[pe_spb_bb_planet.GetName]§! is still running. Paying it off costs its remaining value: §Y[Root.pe_spb_bb]§! £trade£ trade. Then the buildings are ours and the lease ends."
 pe.334.a:0 "Pay off"
 pe.334.a.tt:0 "We pay the remaining value, the corporations receive it, and the lease ends."
 pe.334.b:0 "Not now"
 decision_pe_spb_buyback:0 "Pay Off Lease"
 decision_pe_spb_buyback_desc:0 "Ends the lease of the corporate buildings on this planet at their remaining value. Then they are ours."
 pe_msg_spb_built:0 "§Y$CORP$§! has built a specialisation building on $PLANET$. We lease it for ten years; then it is ours."
 pe_msg_spb_end:0 "The lease of §Y$CORP$§!'s specialisation building on $PLANET$ has ended: the corporation no longer exists, or the building is gone. Whatever stands is ours."
 pe_msg_spb_paid:0 "The lease of §Y$CORP$§!'s specialisation building on $PLANET$ is paid off. The building is ours now."
